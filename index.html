function navigate(page, extra){
  state.ui.page=page;
  if(page==='notebooks' && !extra) { if(state.ui.notebooksUi) state.ui.notebooksUi.selected=null; }
  if(extra) Object.assign(state.ui, extra);
  render();
  window.scrollTo(0,0);
}
document.getElementById('mobile-menu-btn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

const PAGES = {};
function render(){
  flushPendingCloudSnapshot();
  renderSidebar();
  const main=document.getElementById('main');
  try{
    const pageFn = PAGES[state.ui.page] || PAGES.dashboard;
    const {html, mount} = pageFn();
    main.innerHTML = html;
    if(mount) mount(main);
  }catch(err){
    console.error('Lỗi khi hiển thị trang "'+state.ui.page+'":', err);
    main.innerHTML = `
      <div class="card" style="border-color:var(--bad); max-width:680px;">
        <h3 style="color:var(--bad); margin-bottom:8px;">Đã xảy ra lỗi khi tải trang này</h3>
        <p class="hint" style="margin-top:0;">Vui lòng mở Console (F12) trên trình duyệt để xem chi tiết lỗi bên dưới, hoặc thử bấm lại menu bên trái.</p>
        <pre style="white-space:pre-wrap; font-size:12px; background:#FCFCFA; border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px; color:var(--bad);">${escapeHtml((err && err.stack) || String(err))}</pre>
        <button class="btn" style="margin-top:10px;" onclick="navigate('dashboard')">Về Tổng quan</button>
      </div>`;
  }
}

/* =========================================================================
   PAGE: TODAY — phiên học tự động
   ========================================================================= */
PAGES.today = function(){
  const plan=buildTodayPlan();
  const dueCount=plan.filter(x=>x.reason==='Đến hạn').length;
  const weakCount=plan.filter(x=>x.reason==='Từ yếu').length;
  const newCount=plan.filter(x=>x.reason==='Từ mới').length;
  const weak=weakWords(6);
  const html=`
    <div class="page-head"><div><h2>Học hôm nay</h2><p>App tự chọn từ đến hạn, từ yếu và một ít từ mới.</p></div></div>
    <div class="card" style="max-width:760px;margin-bottom:16px;background:linear-gradient(135deg,var(--paper),var(--accent-tint));">
      <div style="display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap;">
        <div><h3 style="font-size:20px;margin-bottom:6px;">Phiên ${plan.length} từ · khoảng 10 phút</h3><div class="hint">${dueCount} đến hạn · ${weakCount} từ yếu · ${newCount} từ mới · còn lại ôn củng cố</div></div>
        <button class="btn btn-primary" id="today-start" ${plan.length?'':'disabled'}>Bắt đầu học</button>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="card"><h3 style="font-size:15px;margin-bottom:10px;">Kế hoạch hôm nay</h3>
        ${plan.length?`<div class="table-wrap"><table><thead><tr><th>Từ</th><th>Lý do</th><th>Ôn tiếp</th></tr></thead><tbody>${plan.map(x=>`<tr><td><b>${escapeHtml(x.word.english)}</b><br><span class="hint">${escapeHtml(x.word.vietnamese)}</span></td><td>${escapeHtml(x.reason)}</td><td>${ensureSrs(x.word).correct+ensureSrs(x.word).wrong?fmtDateShort(ensureSrs(x.word).nextReview):'Mới'}</td></tr>`).join('')}</tbody></table></div>`:`<p class="hint">Chưa có từ nào. Hãy thêm từ vào Notebook trước.</p>`}
      </div>
      <div class="card"><h3 style="font-size:15px;margin-bottom:10px;">Từ yếu cần cứu</h3>
        ${weak.length?weak.map(w=>{const sr=ensureSrs(w),t=sr.correct+sr.wrong,rate=t?Math.round(sr.correct/t*100):0;return `<div style="padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;"><div><b>${escapeHtml(w.english)}</b><div class="hint">${escapeHtml(w.vietnamese)}</div></div><div style="text-align:right;font-size:12px;color:var(--bad);">Sai ${sr.wrong} · đúng ${rate}%</div></div>`;}).join(''):`<p class="hint">Chưa có đủ dữ liệu để xác định từ yếu.</p>`}
      </div>
    </div>`;
  const mount=(root)=>{
    const btn=root.querySelector('#today-start');
    if(btn) btn.addEventListener('click',()=>{
      if(!plan.length) return;
      const pool=allWords();
      const normalModes=['vi2en','write','fill','listen'];
      const questions=plan.map((x,i)=>{
        let mode;
        if(x.reason==='Từ mới') mode=i%2?'en2vi':'mcq';
        else if(x.reason==='Từ yếu') mode=['write','fill','vi2en'][i%3];
        else mode=normalModes[i%normalModes.length];
        return buildQuestion(x.word,[mode],pool);
      });
      state.ui.practiceSession={phase:'active',index:0,questions,answers:[],modes:[...new Set(questions.map(q=>q.mode))],source:{type:'today'}};
      navigate('practice');
    });
  };
  return {html,mount};
};

      <div class="stat-tile"><div class="num">${state.translationHistory.length}</div><div class="lbl">Câu đã luyện dịch</div></div>
    </div>

    <div class="grid grid-2" style="align-items:start;">
      <div class="card">

        <p class="hint" style="margin-bottom:0;">Số lượt ôn từ &amp; câu dịch mỗi ngày</p>
        <div class="chart-bars">
          ${activity.map(a=>`
            <div class="bar-col">
              <div class="bar" style="height:${Math.max(4,a.count/maxAct*100)}%" title="${a.count} lượt"></div>

            </div>`).join('')}
        </div>
      </div>

      <div class="card">
        <h3 style="font-size:15px;">Phân bổ trạng thái từ</h3>
        <div class="stack-bar">
          ${stackSegs.map(s=>`<div style="width:${s.val/total*100}%;background:${s.color}" title="${s.label}: ${s.val}"></div>`).join('')}
        </div>

    <div class="toolbar" style="margin-top:22px;">
      <button class="btn btn-primary" data-act="review-due">Ôn ${dueCount} từ cần ôn hôm nay</button>

      navigate('practice', {practicePrefill:{type:'all'}, practiceAutoStart:true});

  };
  return {html, mount};
};

/* =========================================================================
   PAGE: NOTEBOOKS

PAGES.notebooks = function(){
  const ui = state.ui.notebooksUi || (state.ui.notebooksUi = { selected:null, search:'', statusFilter:'all', posFilter:'all' });

  if(ui.selected){
    return renderNotebookDetail(ui.selected);
  }
  return renderNotebookList();
};

function renderNotebookList(){
  const html = `
    <div class="page-head">
      <div><h2>Notebook từ vựng</h2><p>Tổ chức từ vựng theo từng chủ đề hoặc lớp học.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn" data-act="import-csv">Nhập CSV</button>
        <button class="btn" data-act="export-csv">Xuất CSV</button>
        <button class="btn" data-act="merge">Gộp Notebook</button>
        <button class="btn btn-primary" data-act="new-nb">+ Notebook mới</button>
      </div>
    </div>

    ${state.notebooks.length===0? `
      <div class="empty-state card">
        <h3>Chưa có notebook nào</h3>
        <p>Tạo notebook đầu tiên để bắt đầu thêm từ vựng.</p>
        <button class="btn btn-primary" data-act="new-nb" style="margin-top:10px;">+ Tạo notebook</button>
      </div>` : `
      <div class="grid grid-3" id="nb-grid">
        ${state.notebooks.map(nb=>{
          const ws=wordsOfNotebook(nb.id);
          const c=wordCounts(ws);
          const pct = ws.length? Math.round(c.mastered/ws.length*100):0;

          <div class="nb-card" data-nb="${nb.id}">

              <p>${escapeHtml(nb.description||'')}</p>
              <div class="nb-meta"><span>${ws.length} từ</span><span>${pct}% thành thạo</span>${c.due?`<span style="color:var(--bad)">${c.due} cần ôn</span>`:''}</div>
            </div>
            <div class="nb-foot">
              <button class="btn btn-sm" data-act="learn" data-nb="${nb.id}">Học nhóm này</button>
              <button class="btn btn-sm btn-ghost" data-act="edit-nb" data-nb="${nb.id}">Sửa</button>
              <button class="btn btn-sm btn-ghost" data-act="del-nb" data-nb="${nb.id}" style="margin-left:auto;color:var(--bad)">Xoá</button>
            </div>
          </div>`;
        }).join('')}
      </div>`}

    ${state.mergedSets.length? `
      <h3 style="margin-top:28px;margin-bottom:12px;font-size:16px;">Bộ học gộp</h3>
      <div class="grid grid-3">
        ${state.mergedSets.map(m=>{
          const ws=wordsOfMergedSet(m.id);
          return `
          <div class="nb-card" data-ms="${m.id}">
            <div class="nb-tab" style="background:var(--warm)"></div>
            <div class="nb-body">
              <h3>${escapeHtml(m.name)}</h3>
              <p>Gộp từ ${m.notebookIds.length} notebook — dữ liệu gốc không đổi</p>
              <div class="nb-meta"><span>${ws.length} từ</span></div>
            </div>
            <div class="nb-foot">
              <button class="btn btn-sm" data-act="learn-ms" data-ms="${m.id}">Học nhóm này</button>
              <button class="btn btn-sm btn-ghost" data-act="del-ms" data-ms="${m.id}" style="margin-left:auto;color:var(--bad)">Xoá bộ gộp</button>
            </div>
          </div>`;
        }).join('')}
      </div>` : ''}
  `;

  const mount=(root)=>{
    root.querySelectorAll('[data-act="new-nb"]').forEach(b=>b.addEventListener('click', openNotebookForm));
    root.querySelectorAll('[data-act="edit-nb"]').forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation(); openNotebookForm(getNotebook(b.getAttribute('data-nb')));
    }));
    root.querySelectorAll('[data-act="del-nb"]').forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation();
      const nb=getNotebook(b.getAttribute('data-nb'));
      if(confirm(`Xoá notebook "${nb.name}" và toàn bộ ${wordsOfNotebook(nb.id).length} từ bên trong? Hành động này không thể hoàn tác.`)){
        deleteNotebook(nb.id); toast('Đã xoá notebook'); render();
      }
    }));
    root.querySelectorAll('[data-act="learn"]').forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation(); navigate('practice', {practicePrefill:{type:'notebook', id:b.getAttribute('data-nb')}});
    }));
    root.querySelectorAll('[data-act="learn-ms"]').forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation(); navigate('practice', {practicePrefill:{type:'merged', id:b.getAttribute('data-ms')}});
    }));
    root.querySelectorAll('[data-act="del-ms"]').forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation();

    }));

      render();

    const mergeBtn = root.querySelector('[data-act="merge"]');
    if(mergeBtn) mergeBtn.addEventListener('click', openMergeForm);
    const impBtn = root.querySelector('[data-act="import-csv"]');
    if(impBtn) impBtn.addEventListener('click', openImportForm);
    const expBtn = root.querySelector('[data-act="export-csv"]');
    if(expBtn) expBtn.addEventListener('click', ()=>exportWordsCSV(allWords(), 'tat-ca-tu-vung'));
  };
  return {html, mount};
}

function renderNotebookDetail(nbId){
  const nb = getNotebook(nbId);
  if(!nb){ state.ui.notebooksUi.selected=null; return renderNotebookList(); }
  const ui = state.ui.notebooksUi;
  let words = wordsOfNotebook(nbId);

  if(ui.search){
    const q = normalizeLoose(ui.search);
    words = words.filter(w=> normalizeLoose(w.english).includes(q) || normalizeLoose(w.vietnamese).includes(q));
  }
  if(ui.statusFilter && ui.statusFilter!=='all'){
    words = words.filter(w=>statusOf(w)===ui.statusFilter);
  }
  if(ui.posFilter && ui.posFilter!=='all'){
    words = words.filter(w=>w.pos===ui.posFilter);
  }
  const posSet = [...new Set(wordsOfNotebook(nbId).map(w=>w.pos).filter(Boolean))];

  const statusBadge = (w)=>{
    const s=statusOf(w);
    const map={new:['Mới','badge-new'],learning:['Đang học','badge-learning'],due:['Cần ôn','badge-due'],mastered:['Thành thạo','badge-mastered']};

  const html = `
    <div class="page-head">
      <div>

        <button class="btn btn-primary" data-act="new-word">+ Từ mới</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="nb-search" placeholder="Tìm từ tiếng Anh hoặc tiếng Việt..." value="${escapeHtml(ui.search)}">
      </div>
      <select id="nb-status-filter">
        <option value="all">Tất cả trạng thái</option>
        <option value="new" ${ui.statusFilter==='new'?'selected':''}>Mới</option>
        <option value="learning" ${ui.statusFilter==='learning'?'selected':''}>Đang học</option>
        <option value="due" ${ui.statusFilter==='due'?'selected':''}>Cần ôn</option>
        <option value="mastered" ${ui.statusFilter==='mastered'?'selected':''}>Thành thạo</option>
      </select>
      ${posSet.length? `<select id="nb-pos-filter">
        <option value="all">Tất cả từ loại</option>
        ${posSet.map(p=>`<option value="${escapeHtml(p)}" ${ui.posFilter===p?'selected':''}>${escapeHtml(p)}</option>`).join('')}
      </select>` : ''}
      <div class="spacer"></div>
      <span class="hint">${words.length} kết quả</span>
    </div>

    ${words.length===0? `<div class="empty-state card"><h3>Không có từ nào</h3><p>Thử thay đổi bộ lọc hoặc thêm từ mới.</p></div>` : `
    <div class="table-wrap">
      <table>
        <thead><tr><th>English</th><th>Từ loại</th><th>Nghĩa</th><th>Ví dụ</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody>
          ${words.map(w=>`
            <tr class="word-row" data-word="${w.id}" tabindex="0" title="Bấm vào để sửa từ này">
              <td><b>${escapeHtml(w.english)}</b>${w.pronunciation?`<br><span class="hint">${escapeHtml(w.pronunciation)}</span>`:''}${w.synonyms?`<br><span class="hint">≈ ${escapeHtml(w.synonyms)}</span>`:''}${w.collocations?`<br><span class="hint">Collocation: ${escapeHtml(w.collocations)}</span>`:''}${w.wordFamily?`<br><span class="hint">Word family: ${escapeHtml(w.wordFamily)}</span>`:''}</td>
              <td>${escapeHtml(w.pos||'—')}</td>
              <td>${escapeHtml(w.vietnamese)}</td>
              <td style="max-width:220px;">${escapeHtml(w.example||'—')}</td>
              <td>${statusBadge(w)}</td>
              <td style="white-space:nowrap;">
                <button class="btn btn-sm btn-ghost" data-act="speak" title="Nghe phát âm">🔊</button>
                <button class="btn btn-sm btn-ghost" data-act="del-word" style="color:var(--bad)">Xoá</button>

    root.querySelector('[data-act="learn-nb"]').addEventListener('click', ()=>navigate('practice', {practicePrefill:{type:'notebook', id:nbId}}));
    root.querySelector('[data-act="export-nb"]').addEventListener('click', ()=>exportWordsCSV(wordsOfNotebook(nbId), nb.name.replace(/\s+/g,'-')));
    const s=root.querySelector('#nb-search');
    s.addEventListener('input', debounce(()=>{ ui.search=s.value; render(); document.getElementById('nb-search').focus(); document.getElementById('nb-search').setSelectionRange(999,999); }, 220));
    const sf=root.querySelector('#nb-status-filter');

    root.querySelectorAll('[data-word]').forEach(row=>{

        if(confirm(`Xoá từ "${w.english}"?`)){ deleteWord(id); toast('Đã xoá từ'); render(); }

  return {html, mount};
}

  if(playAudioBtn) playAudioBtn.addEventListener('click', ()=>speakWord({english: englishInput.value.trim(), pronunciationAudio: audioInput.value}));

  /* Chỉ tra cứu khi người dùng CHỦ ĐỘNG bấm nút — không tự động gọi khi rời khỏi ô,
     để tránh làm chậm khi bạn thêm nhiều từ liên tiếp. Nếu cần thêm nhiều từ cùng
     lúc, dùng nút "+ Thêm nhiều từ" ở trang Notebook. Cả hai đều thử từ điển miễn phí
     (Dictionary API rồi tới Wiktionary) trước, không cần API key, không tốn hạn mức
     Gemini — trừ khi bạn có bật "Dùng AI dự phòng" trong Cài đặt và cả hai nguồn miễn
     phí đều không có dữ liệu. */

    if(!en){ toast('Nhập từ tiếng Anh trước đã'); englishInput.focus(); return; }

    const oldLabel = autofillBtn.textContent;
    autofillBtn.textContent = '⏳ Đang tra...';
    statusEl.textContent = '';
    statusEl.style.color = 'var(--ink-faint)';

      const info = await DictModule.lookupWordInfo(en);
      let filled=[];

      if(info.vietnamese && info.vietnamese.trim()){ viInput.value = info.vietnamese.trim(); filled.push('nghĩa'); }
      if(info.pos && posSelect){
        const match = POS_OPTIONS.find(p=>p===info.pos) || POS_OPTIONS.find(p=>info.pos.includes(p));

      if(info.example && exampleTextarea){ exampleTextarea.value = info.example.trim(); filled.push('ví dụ'); }
      if(info.audio){ audioInput.value = info.audio; filled.push('audio thật'); }
      if(filled.length){
        statusEl.textContent = '✓ Đã tự điền: ' + filled.join(', ') + (info.usedAI ? ' (2 từ điển miễn phí đều không có dữ liệu, đã dùng AI dự phòng — tốn 1 request Gemini)' : '');
        statusEl.style.color = 'var(--good)';
      } else {
        statusEl.textContent = 'Từ này chưa có dữ liệu miễn phí; bạn có thể nhập tay.';
        statusEl.style.color = 'var(--amber)';
      }

      statusEl.textContent = 'Không thể tra cứu: ' + (e.message||'lỗi không xác định');
      statusEl.style.color = 'var(--bad)';
    }finally{
      autofillBtn.disabled = false;
      autofillBtn.textContent = oldLabel;
    }
  });

  box.querySelector('#word-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const data={
      english:fd.get('english'), vietnamese:fd.get('vietnamese'), pos:fd.get('pos'),
      example:fd.get('example'), pronunciation:fd.get('pronunciation'), note:fd.get('note'),
      synonyms:fd.get('synonyms'), collocations:fd.get('collocations'), wordFamily:fd.get('wordFamily'),
      confusable:fd.get('confusable'), pronunciationAudio:fd.get('pronunciationAudio'),
      notebookId: fd.get('notebookId')||notebookId
    };
    if(!data.english.trim() || !data.vietnamese.trim()){ toast('Vui lòng nhập đủ English và nghĩa tiếng Việt'); return; }
    if(isEdit) updateWord(word.id, data); else createWord(data.notebookId, data);
    toast(isEdit?'Đã lưu từ':'Đã thêm từ mới');
    closeModal(); render();
  });

/* ---------------------------- Nhập một dãy từ ở nhiều định dạng ---------------------------- */
function parseBulkEnglishInput(raw){
  const text = String(raw||'').replace(/\r\n?/g,'\n');
  if(!text.trim()) return [];

  // Quy tắc cố định: MỖI DÒNG = MỘT MỤC TỪ VỰNG.
  // Vì vậy mọi cụm nhiều từ/phrasal verb đều được giữ nguyên, không cần hardcode
  // và không cần gọi AI chỉ để đoán ranh giới cụm.
  const cleanLine = line => String(line||'')
    .trim()
    // Bỏ bullet / số thứ tự ở đầu dòng nhưng giữ nguyên phần tiếng Anh phía sau.
    .replace(/^[•●▪◦\-*]\s+/, '')
    .replace(/^\d+\s*[.)]\s*/, '')
    // Cho phép người dùng bao cụm bằng ngoặc kép.
    .replace(/^["“”']+|["“”']+$/g, '')
    .replace(/\s+/g, ' ')
    .trim();

  const seen = new Set();
  const result = [];

  for(const rawLine of text.split('\n')){
    const item = cleanLine(rawLine);
    if(!item || !/[A-Za-z]/.test(item)) continue;
    const key = normalizeWordText(item);
    if(!key || seen.has(key)) continue;
    seen.add(key);
    result.push(item);
  }

  return result;
}

function openBulkAddWordsForm(notebookId){
  openModal(`
    <div class="modal-head"><h3>Thêm nhiều từ cùng lúc</h3><button class="modal-close" data-close>&times;</button></div>
    <p class="hint" style="margin-top:0;"><b>Mỗi dòng = một từ hoặc một cụm.</b> Vì vậy bạn có thể nhập bất kỳ phrasal verb nào, kể cả cụm chưa từng có trong code, và hệ thống sẽ giữ nguyên cả dòng. Ví dụ: <b>come up against</b>, <b>brush up on</b>, <b>take issue with</b>. Sau đó hệ thống tự điền <b>nghĩa, từ loại, IPA và ví dụ</b>. Nguồn mở MinhQND + Dictionary API + Wiktionary + cache được dùng trước. Phrasal verb không còn dùng máy dịch literal MyMemory. Nếu vẫn thiếu dữ liệu và đã bật AI dự phòng: <b>1-3 mục dùng prompt mini</b>, từ <b>4 mục trở lên dùng batch</b>; AI chỉ nhận đúng các ô còn thiếu và mỗi lần phân tích vẫn <b>tối đa 1 request Gemini</b>.</p>
    <div class="field"><label>Danh sách từ tiếng Anh *</label>
      <textarea id="bulk-input" rows="8" placeholder="Mỗi dòng một mục. VD:
abundant
diligent
look forward to
brush up on
come up against
take issue with"></textarea>
    </div>
    <button class="btn btn-primary btn-block" id="bulk-lookup">Phân tích & tự điền thông tin</button>
    <div id="bulk-status" class="hint" style="margin-top:8px;"></div>
    <div id="bulk-preview"></div>
    <div class="modal-actions" id="bulk-close-row">
      <button type="button" class="btn" data-close>Đóng</button>
    </div>
  `, true);
  const box=document.getElementById('modal-box');
  box.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));

  box.querySelector('#bulk-lookup').addEventListener('click', async ()=>{
    const raw = box.querySelector('#bulk-input').value;
    const words = parseBulkEnglishInput(raw);
    if(words.length===0){ toast('Nhập ít nhất 1 từ'); return; }
    if(words.length>60){ toast('Mỗi lần chỉ nên tra tối đa khoảng 60 từ để tránh bị giới hạn tốc độ'); return; }
    const btn = box.querySelector('#bulk-lookup');
    const statusEl = box.querySelector('#bulk-status');
    btn.disabled=true; btn.textContent=`Đang tra ${words.length} từ (0/${words.length})...`;
    statusEl.textContent=''; box.querySelector('#bulk-preview').innerHTML='';
    try{
      const results = await DictModule.lookupWordInfoBatch(words, (done, total)=>{
        btn.textContent = `Đang tra ${total} từ (${done}/${total})...`;
      });
      renderBulkPreview(box, words, results, notebookId);
      const aiUsedCount = (results||[]).filter(r=>r && r.usedAI).length;
      const stats = DictModule.getLastBatchStats ? DictModule.getLastBatchStats() : {requestCount:aiUsedCount?1:0,mode:aiUsedCount?'batch':'none',aiItems:aiUsedCount,aiFields:0,cacheHits:0};
      if(stats.requestCount){
        const modeLabel=stats.mode==='mini'?'mini prompt':'batch prompt';
        statusEl.textContent = `✓ Đã phân tích ${words.length} mục. Nguồn mở: ${stats.openSourceHits||0} mục. Gemini: 1 request (${modeLabel}), ${stats.aiItems} mục / ${stats.aiFields} ô còn thiếu. Cache hit: ${stats.cacheHits}. Bạn có thể sửa trực tiếp mọi ô trước khi thêm.`;
        statusEl.style.color='var(--amber)';
      }else{
        statusEl.textContent = `✓ Đã phân tích ${words.length} mục. Nguồn mở: ${stats.openSourceHits||0} mục. Gemini: 0 request. Cache hit: ${stats.cacheHits}. Bạn có thể sửa trực tiếp mọi ô trước khi thêm.`;
        statusEl.style.color='var(--good)';
      }
    }catch(e){
      statusEl.textContent = 'Không thể tra cứu: ' + (e.message||'lỗi không xác định') + '. Bạn vẫn có thể điền tay ở bảng bên dưới.';
      statusEl.style.color='var(--bad)';
      renderBulkPreview(box, words, [], notebookId);
    }finally{
      btn.disabled=false; btn.textContent='Phân tích & tự điền thông tin';
    }
  });
}

function renderBulkPreview(box, words, results, notebookId){
  const lookup = new Map();
  (results||[]).forEach(r=>{ if(r && r.english) lookup.set(normalizeWordText(r.english), r); });
  const rows = words.map((w,i)=>{
    const r = lookup.get(normalizeWordText(w)) || (results && results[i]) || {};
    return { english:w, pronunciation:r.pronunciation||'', vietnamese:r.vietnamese||'', pos:r.pos||'', example:r.example||'', audio:r.audio||'' };
  });
  const preview = box.querySelector('#bulk-preview');
  preview.innerHTML = `
    <div class="table-wrap" style="margin-top:14px;">
      <table>
        <thead><tr><th>English</th><th>IPA</th><th>Nghĩa (VI)</th><th>Từ loại</th><th>Ví dụ</th><th>Audio</th></tr></thead>
        <tbody>
          ${rows.map((r,i)=>`
            <tr data-row="${i}">
              <td><b>${escapeHtml(r.english)}</b><input type="hidden" class="bulk-audio" value="${escapeHtml(r.audio)}"></td>
              <td><input type="text" class="bulk-ipa" value="${escapeHtml(r.pronunciation)}" style="width:110px;"></td>
              <td><input type="text" class="bulk-vi" value="${escapeHtml(r.vietnamese)}" style="width:140px;"></td>
              <td>
                <select class="bulk-pos">
                  <option value="">—</option>
                  ${POS_OPTIONS.map(p=>`<option value="${p}" ${r.pos===p?'selected':''}>${p}</option>`).join('')}
                </select>
              </td>
              <td><input type="text" class="bulk-example" value="${escapeHtml(r.example)}" style="width:220px;"></td>
              <td>${r.audio? '🔊 có' : '—'}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <button class="btn btn-primary btn-block" id="bulk-save" style="margin-top:14px;">Thêm tất cả (${rows.length} từ) vào Notebook</button>
  `;
  preview.querySelector('#bulk-save').addEventListener('click', ()=>{
    const trs = preview.querySelectorAll('tbody tr');
    let added=0;
    trs.forEach(tr=>{
      const idx = Number(tr.getAttribute('data-row'));
      const w = rows[idx];
      const vi = tr.querySelector('.bulk-vi').value.trim();
      if(!w.english.trim() || !vi) return;
      createWord(notebookId, {
        english: w.english,
        vietnamese: vi,
        pos: tr.querySelector('.bulk-pos').value,
        pronunciation: tr.querySelector('.bulk-ipa').value.trim(),
        example: tr.querySelector('.bulk-example').value.trim(),
        synonyms: '',
        pronunciationAudio: tr.querySelector('.bulk-audio').value.trim()
      });
      added++;
    });
    toast(`Đã thêm ${added} từ vào notebook`);
    closeModal(); render();
  });
}

/* =========================================================================
   PAGE: PRACTICE (Kiểm tra từ)
   ========================================================================= */
const PRACTICE_MODES = [
  {id:'vi2en', label:'Việt → Anh'},
  {id:'en2vi', label:'Anh → Việt'},
  {id:'mcq', label:'Trắc nghiệm'},
  {id:'fill', label:'Điền từ vào câu'},
  {id:'listen', label:'Nghe → đoán nghĩa'},
  {id:'write', label:'Nghĩa → viết từ'}
];

const PRACTICE_MODE_IDS = new Set(PRACTICE_MODES.map(m=>m.id));
function normalizePracticeModes(modes){
  const valid=(Array.isArray(modes)?modes:[]).filter(m=>PRACTICE_MODE_IDS.has(m));
  return valid.length ? valid : ['vi2en','write','fill'];
}

PAGES.practice = function(){
  const sess = state.ui.practiceSession;
  if(sess && sess.phase==='active') return renderPracticeSession();
  if(sess && sess.phase==='summary') return renderPracticeSummary();
  return renderPracticeSetup();
};

function renderPracticeSetup(){
  const prefill = state.ui.practicePrefill;
  const selectedSourceVal = prefill ? (prefill.type==='all'?'all':prefill.type+':'+prefill.id) : 'all';
  const autoStart = state.ui.practiceAutoStart;
  state.ui.practicePrefill=null; state.ui.practiceAutoStart=false;

  const html = `
    <div class="page-head"><div><h2>Kiểm tra từ vựng</h2><p>Chọn nguồn từ và dạng bài để bắt đầu luyện tập.</p></div></div>

      </div>

        <div class="field" style="display:flex;align-items:flex-end;padding-bottom:9px;">
          <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:13.5px;color:var(--ink);">
            <input type="checkbox" id="p-prioritize" checked style="width:auto;"> Ưu tiên từ sai / lâu chưa ôn
          </label>
        </div>
      </div>
      <div class="field"><label>Dạng luyện tập</label>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${PRACTICE_MODES.map(m=>`<label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:13.5px;"><input type="checkbox" class="p-mode" value="${m.id}" checked style="width:auto;"> ${m.label}</label>`).join('')}
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="p-start" style="margin-top:6px;">Bắt đầu luyện tập</button>
    </div>
  `;
  const mount=(root)=>{
    const startBtn=root.querySelector('#p-start');
    const doStart=()=>{
      const source = parseSourceValue(root.querySelector('#p-source').value);
      let pool = wordsFromSource(source);
      if(pool.length===0){ toast('Nguồn từ vựng này chưa có từ nào'); return; }
      const count = Math.max(1, Math.min(200, parseInt(root.querySelector('#p-count').value)||10));
      const prioritize = root.querySelector('#p-prioritize').checked;
      const modes = [...root.querySelectorAll('.p-mode:checked')].map(c=>c.value);
      if(modes.length===0){ toast('Chọn ít nhất 1 dạng luyện tập'); return; }
      const queueWords = buildQueue(pool, count, prioritize);
      const questions = queueWords.map(w=>buildQuestion(w, modes, pool));
      state.ui.practiceSession = { phase:'active', index:0, questions, answers:[], modes, source, answered:false };
      render();
    };
    startBtn.addEventListener('click', doStart);
    if(autoStart) doStart();
  };
  return {html, mount};
}

function buildQuestion(word, modes, pool){
  modes = normalizePracticeModes(modes);
  const mode = pick(modes);
  const q = { wordId: word.id, mode };
  if(mode==='mcq' || mode==='listen'){
    const direction = mode==='listen' ? 'en2vi' : (Math.random()<0.5?'en2vi':'vi2en');
    q.direction = direction;
    const correctVal = direction==='en2vi' ? word.vietnamese : word.english;
    const confusableTerms = String(word.confusable||'').split(/[,;/|]+/).map(normalizeWordText).filter(Boolean);
    const distractorPool = shuffleArray(pool.filter(w=>w.id!==word.id)).sort((a,b)=>{
      const score=(candidate)=>{
        let sc=0;
        if(word.pos && candidate.pos===word.pos) sc+=6;
        if(confusableTerms.includes(normalizeWordText(candidate.english))) sc+=20;
        const back=String(candidate.confusable||'').split(/[,;/|]+/).map(normalizeWordText);
        if(back.includes(normalizeWordText(word.english))) sc+=20;
        if(candidate.english?.[0]?.toLowerCase()===word.english?.[0]?.toLowerCase()) sc+=1;
        if(Math.abs(String(candidate.english||'').length-String(word.english||'').length)<=2) sc+=1;
        return sc;
      };
      return score(b)-score(a);
    });
    const distractors = [];
    const seen = new Set([normalizeAnswer(correctVal)]);
    for(const candidate of distractorPool){
      const value = direction==='en2vi' ? candidate.vietnamese : candidate.english;
      const key = normalizeAnswer(value);
      if(!key || seen.has(key)) continue;
      seen.add(key);
      distractors.push(value);
      if(distractors.length>=3) break;
    }
    q.options = shuffleArray([correctVal, ...distractors]);
  }
  if(mode === 'fill'){
  const ex = word.example || '';

  const escapedWord = word.english.replace(
    /[.*+?^${}()|[\]\\]/g,
    '\\$&'
  );

  const re = new RegExp(
    `(^|\\s)${escapedWord}(?=\\s|[.,!?;:]|$)`,
    'i'
  );

  if(ex && re.test(ex)){
    q.sentence = ex.replace(re, '$1_____');
  } else {
    q.mode = 'vi2en';
  }
}
  return q;
}

function renderPracticeSession(){
  const sess = state.ui.practiceSession;
  const q = sess.questions[sess.index];
  if(q && !PRACTICE_MODE_IDS.has(q.mode)){
    console.warn('Mode luyện tập cũ/không hợp lệ, chuyển sang vi2en:', q.mode);
    q.mode='vi2en';
    delete q.options;
    delete q.direction;
    delete q.sentence;
  }
  const word = q ? getWord(q.wordId) : null;
  if(!q || !word){ sess.index++; if(sess.index>=sess.questions.length) sess.phase='summary'; render(); return {html:'',mount:null}; }
  const pct = Math.round(sess.index/sess.questions.length*100);
  const modeLabel = PRACTICE_MODES.find(m=>m.id===q.mode)?.label || q.mode;

  let bodyHtml='';
  if(q.mode==='vi2en'){
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt">${escapeHtml(word.vietnamese)}</div>
      <div class="q-sub">${escapeHtml(word.pos||'')}</div>
      <input type="text" class="q-input" id="q-answer" placeholder="Nhập từ tiếng Anh..." autocomplete="off">
      <button class="btn btn-primary btn-block" id="q-submit" style="margin-top:16px;">Kiểm tra</button>
    `;
  } else if(q.mode==='en2vi'){
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt">${escapeHtml(word.english)}</div>
      <div class="q-sub">${escapeHtml(word.pronunciation||'')}</div>
      <input type="text" class="q-input" id="q-answer" placeholder="Nhập nghĩa tiếng Việt..." autocomplete="off">
      <button class="btn btn-primary btn-block" id="q-submit" style="margin-top:16px;">Kiểm tra</button>
    `;
  } else if(q.mode==='write'){
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt">${escapeHtml(word.vietnamese)}</div>
      <div class="q-sub">${escapeHtml([word.pos, word.note].filter(Boolean).join(' · ')||'Viết từ tiếng Anh tương ứng')}</div>
      <input type="text" class="q-input" id="q-answer" placeholder="Viết từ tiếng Anh..." autocomplete="off">
      <button class="btn btn-primary btn-block" id="q-submit" style="margin-top:16px;">Kiểm tra</button>
    `;
  } else if(q.mode==='fill'){
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt" style="font-size:19px;">${escapeHtml(q.sentence)}</div>
      <div class="q-sub">Nghĩa: ${escapeHtml(word.vietnamese)}</div>
      <input type="text" class="q-input" id="q-answer" placeholder="Điền từ còn thiếu..." autocomplete="off">
      <button class="btn btn-primary btn-block" id="q-submit" style="margin-top:16px;">Kiểm tra</button>
    `;
  } else if(q.mode==='mcq'){
    const promptText = q.direction==='en2vi' ? word.english : word.vietnamese;
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt">${escapeHtml(promptText)}</div>
      <div class="q-sub">${q.direction==='en2vi'?'Chọn nghĩa tiếng Việt đúng':'Chọn từ tiếng Anh đúng'}</div>
      <div class="mcq-grid" id="q-mcq">
        ${q.options.map((o,i)=>`<button class="mcq-opt" data-val="${escapeHtml(o)}" data-i="${i}">${escapeHtml(o)}</button>`).join('')}
      </div>
    `;
  } else if(q.mode==='listen'){
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <button class="speak-btn" id="q-speak" title="Nghe">🔊</button>
      <div class="q-sub">Nghe và chọn nghĩa đúng</div>
      <div class="mcq-grid" id="q-mcq">
        ${q.options.map((o,i)=>`<button class="mcq-opt" data-val="${escapeHtml(o)}" data-i="${i}">${escapeHtml(o)}</button>`).join('')}
      </div>
    `;
  }

  const html = `
    <div class="practice-wrap">
      <div class="progress-bar"><div style="width:${pct}%"></div></div>
      <div class="q-card">
        ${bodyHtml}
        <div id="q-feedback"></div>
      </div>
      <div class="session-actions">
        <button class="btn btn-ghost" id="q-quit">Thoát luyện tập</button>
      </div>
    </div>
  `;

  const mount=(root)=>{
    root.querySelector('#q-quit').addEventListener('click', ()=>{
      if(confirm('Thoát phiên luyện tập hiện tại?')){ state.ui.practiceSession=null; render(); }
    });
    const speakBtn = root.querySelector('#q-speak');
    if(speakBtn){
      if(!isMobileDevice && state.settings.autoTTS) speakWord(word);
      speakBtn.addEventListener('click', ()=>speakWord(word));
    }

    const finishAnswer = (isCorrect, userVal)=>{
      playUiSound(isCorrect?'correct':'wrong');
      sess.answers.push({wordId:word.id, mode:q.mode, correct:isCorrect, userVal});
      if(!isCorrect && !q.isRetry){
        const retryModes=['write','fill','vi2en'].filter(m=>m!==q.mode);
        const retryQ=buildQuestion(word,retryModes.length?retryModes:['vi2en'],allWords());
        retryQ.isRetry=true;
        sess.questions.splice(Math.min(sess.questions.length,sess.index+4),0,retryQ);
      }
      const explainParts=[];
      if(word.pos) explainParts.push(word.pos);
      if(word.collocations) explainParts.push('Collocation: '+word.collocations);
      if(word.wordFamily) explainParts.push('Word family: '+word.wordFamily);
      if(word.confusable) explainParts.push('Dễ nhầm: '+word.confusable);
      if(word.example) explainParts.push('VD: '+word.example);
      if(word.note) explainParts.push(word.note);
      const fb=root.querySelector('#q-feedback');
      const ratingButtons=isCorrect ? `
        <div class="hint" style="text-align:center;margin:12px 0 7px;">Bạn nhớ từ này ở mức nào?</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
          <button class="btn" data-rating="hard">Khó</button><button class="btn btn-primary" data-rating="good">Nhớ</button><button class="btn" data-rating="easy" style="background:var(--good-tint);color:var(--good);border-color:var(--good-tint);">Rất dễ</button>
        </div>` : `<button class="btn btn-warm btn-block" data-rating="again" style="margin-top:14px;">Ôn lại sớm</button>`;
      fb.innerHTML=`
        <div class="feedback-panel ${isCorrect?'ok':'no'}"><div class="fb-title">${isCorrect?'✓ Chính xác!':'✗ Chưa đúng'}</div><div class="fb-body"><b>${escapeHtml(word.english)}</b> — ${escapeHtml(word.vietnamese)}${explainParts.length?'<br><span style="color:var(--ink-soft)">'+escapeHtml(explainParts.join(' · '))+'</span>':''}</div></div>${ratingButtons}`;
      root.querySelectorAll('.mcq-opt').forEach(b=>b.setAttribute('disabled','true'));
      const input=root.querySelector('#q-answer'); if(input) input.setAttribute('disabled','true');
      const sub=root.querySelector('#q-submit'); if(sub) sub.remove();
      const advanceWithRating=(rating)=>{
        updateSrs(word,rating,q.mode);
        const last=sess.answers[sess.answers.length-1]; if(last) last.rating=rating;
        sess.index++;
        if(sess.index>=sess.questions.length){
          const total=sess.answers.length, correct=sess.answers.filter(a=>a.correct).length;
          state.practiceSessions.push({id:uid('ps'),date:new Date().toISOString(),modes:sess.modes,total,correct,answers:sess.answers});
          if(state.practiceSessions.length>1000) state.practiceSessions=state.practiceSessions.slice(-1000);
          sess.phase='summary';
        }
        persist(); render();
      };
      fb.querySelectorAll('[data-rating]').forEach(b=>b.addEventListener('click',()=>advanceWithRating(b.getAttribute('data-rating'))));
    };

    if(q.mode==='mcq' || q.mode==='listen'){
      const correctVal = q.direction==='en2vi' ? word.vietnamese : word.english;
      root.querySelectorAll('.mcq-opt').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const val=btn.getAttribute('data-val');
          const isCorrect = val===correctVal;
          root.querySelectorAll('.mcq-opt').forEach(b=>{
            if(b.getAttribute('data-val')===correctVal) b.classList.add('correct');
          });
          if(!isCorrect) btn.classList.add('wrong');
          finishAnswer(isCorrect, val);
        });
      });
    } else {
      const input = root.querySelector('#q-answer');
      const submit = root.querySelector('#q-submit');
      if(!input || !submit){
        console.error('Không tìm thấy input/nút kiểm tra cho mode:', q.mode);
        return;
      }
      const checkAns = ()=>{
        const val = input.value;
        let isCorrect=false;
        if(q.mode==='en2vi'){
          isCorrect = answerMatches(val, word.vietnamese.split(/[\/,;]/), true);
        } else if(q.mode==='fill'){
          isCorrect = answerMatches(val, word.english.split('/'), false);
        } else {
          isCorrect = answerMatches(val, acceptedEnglishAnswers(word), false);
        }
        finishAnswer(isCorrect, val);
      };
      submit.addEventListener('click', checkAns);
      input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); checkAns(); } });
      input.focus();
    }
  };
  return {html, mount};
}

function renderPracticeSummary(){
  const sess = state.ui.practiceSession;
  const total = sess.answers.length;
  const correct = sess.answers.filter(a=>a.correct).length;
  const pct = total? Math.round(correct/total*100) : 0;
  const wrongIds = [...new Set(sess.answers.filter(a=>!a.correct).map(a=>a.wordId))];
  const wrongWords = wrongIds.map(getWord).filter(Boolean);

  const html = `
    <div class="practice-wrap">
      <div class="card" style="text-align:center;padding:36px 24px;">
        <div class="score-badge" style="margin:0 auto 14px;background:${pct>=80?'var(--good-tint)':pct>=50?'var(--amber-tint)':'var(--bad-tint)'};color:${pct>=80?'var(--good)':pct>=50?'var(--amber)':'var(--bad)'}">${pct}%</div>
        <h2 style="margin-bottom:4px;">Hoàn thành phiên luyện tập</h2>
        <p style="color:var(--ink-soft);">Đúng ${correct}/${total} câu</p>
      </div>
      ${wrongWords.length? `
      <div class="card" style="margin-top:16px;">
        <h3 style="font-size:15px;margin-bottom:10px;">Các từ cần chú ý (${wrongWords.length})</h3>
        <div class="table-wrap"><table><thead><tr><th>English</th><th>Nghĩa</th></tr></thead><tbody>
          ${wrongWords.map(w=>`<tr><td><b>${escapeHtml(w.english)}</b></td><td>${escapeHtml(w.vietnamese)}</td></tr>`).join('')}
        </tbody></table></div>
      </div>` : ''}
      <div class="session-actions">
        ${wrongWords.length? `<button class="btn btn-warm" id="retry-wrong">Luyện lại từ sai</button>` : ''}
        <button class="btn btn-primary" id="back-dash">Về Tổng quan</button>
        <button class="btn" id="new-session">Luyện tiếp</button>
      </div>
    </div>
  `;
  const mount=(root)=>{
    const retryBtn=root.querySelector('#retry-wrong');
    if(retryBtn) retryBtn.addEventListener('click', ()=>{
      const modes = normalizePracticeModes(sess.modes);
      const questions = wrongWords.map(w=>buildQuestion(w, modes, wrongWords.length>3?wrongWords:allWords()));
      state.ui.practiceSession = {phase:'active', index:0, questions, answers:[], modes, source:sess.source};
      render();
    });
    root.querySelector('#back-dash').addEventListener('click', ()=>{ state.ui.practiceSession=null; navigate('dashboard'); });
    root.querySelector('#new-session').addEventListener('click', ()=>{ state.ui.practiceSession=null; render(); });
  };
  return {html, mount};
}

PAGES.translate = function(){
  const t = state.ui.translateUi || (state.ui.translateUi = { source:'all', perSentence:2, current:null, aiOk:true, loading:false, showHint:true, generatedLog:[], generatedTargets:[], prefetched:null, combo:0, xp:0, lastLatency:0 });

  const html = `
    <div class="page-head"><div><h2>Luyện dịch câu</h2><p>AI tạo câu tiếng Việt dựa trên từ vựng bạn đang học, bạn dịch sang tiếng Anh và được chấm chi tiết.</p></div></div>

    <div class="card" style="max-width:640px;margin-bottom:18px;">

          <select id="t-count"><option value="1" ${t.perSentence===1?'selected':''}>1 từ</option><option value="2" ${t.perSentence===2?'selected':''}>2 từ</option><option value="3" ${t.perSentence===3?'selected':''}>3 từ</option></select>
        </div>

function renderTranslateStatus(root){
  const t=state.ui.translateUi||{};
  const combo=root.querySelector('#t-combo'), xp=root.querySelector('#t-xp'), speed=root.querySelector('#t-speed');
  if(combo) combo.textContent=t.combo||0;
  if(xp) xp.textContent=t.xp||0;
  if(speed){
    speed.style.display=t.lastLatency?'inline-flex':'none';
    const span=speed.querySelector('span'); if(span) span.textContent=t.lastLatency?`${(t.lastLatency/1000).toFixed(1)}s`:'';
  }
}

function getNextTranslateWords(t){
  const source=parseSourceValue(t.source), pool=wordsFromSource(source);
  if(!pool.length) return [];
  const recentTargets=[
    ...(t.current?.targetWords||[]),
    ...state.translationHistory.slice(-12).flatMap(h=>Array.isArray(h.targetWords)?h.targetWords:[]),
    ...(Array.isArray(t.generatedTargets)?t.generatedTargets.slice(-8).flat():[])
  ];
  return buildDiverseQueue(pool,t.perSentence,recentTargets,true);
}

function translatePrefetchMatches(t){
  return !!(t.prefetched && t.prefetched.source===t.source && t.prefetched.perSentence===t.perSentence && t.prefetched.data);
}

async function generateNewSentence(root){
  const t = state.ui.translateUi;
  const source = parseSourceValue(t.source);
  const pool = wordsFromSource(source);
  if(pool.length===0){ playUiSound('error'); toast('Nguồn từ vựng này chưa có từ nào'); return; }

  // Nếu câu kế tiếp đã được tạo chung trong request chấm bài trước đó, dùng ngay: 0 request, gần như 0 giây.
  if(translatePrefetchMatches(t)){
    const p=t.prefetched; t.prefetched=null;
    t.current={...p.data,result:null,aiError:''}; t.aiOk=true; t.lastLatency=0;
    if(!Array.isArray(t.generatedLog)) t.generatedLog=[];
    t.generatedLog.push(t.current.vietnamese); t.generatedLog=t.generatedLog.slice(-10);
    if(!Array.isArray(t.generatedTargets)) t.generatedTargets=[];
    t.generatedTargets.push(t.current.targetWords); t.generatedTargets=t.generatedTargets.slice(-10);
    playUiSound('next'); uiHaptic(12); renderTranslateArea(root); renderTranslateStatus(root); return;
  }

  if(!Array.isArray(t.generatedTargets)) t.generatedTargets=[];
  const recentTargets=[
    ...state.translationHistory.slice(-12).flatMap(h=>Array.isArray(h.targetWords)?h.targetWords:[]),
    ...t.generatedTargets.slice(-8).flat()
  ];
  const targetWords = buildDiverseQueue(pool, t.perSentence, recentTargets, true);
  const genBtn = root.querySelector('#t-generate');
  genBtn.disabled=true; genBtn.textContent='Đang tạo câu...'; genBtn.classList.add('is-loading');
  playUiSound('generate'); uiHaptic(8);
  if(!Array.isArray(t.generatedLog)) t.generatedLog = [];
  const recent = [...state.translationHistory.slice(-10).map(h=>h.vietnamese), ...t.generatedLog.slice(-6)];
  let data, aiOk=true, aiError='';
  const started=performance.now();
  try{
    data = await AIModule.generateSentenceFast(targetWords, recent);
  }catch(e){
    aiOk=false; aiError=e?.message||'Lỗi không xác định khi gọi AI';
    console.error('Lỗi tạo câu bằng AI:',e);
    data=AIModule.fallbackSentence(targetWords);
    let guard=0; while(t.generatedLog.includes(data.vietnamese)&&guard<8){ data=AIModule.fallbackSentence(targetWords); guard++; }
  }
  t.lastLatency=Math.max(1,performance.now()-started);
  t.generatedLog.push(data.vietnamese); if(t.generatedLog.length>10) t.generatedLog=t.generatedLog.slice(-10);
  t.generatedTargets.push(targetWords.map(w=>w.english)); if(t.generatedTargets.length>10) t.generatedTargets=t.generatedTargets.slice(-10);
  t.current={vietnamese:data.vietnamese,targetWords:targetWords.map(w=>w.english),hint:data.hint||'',result:null,aiError};
  t.aiOk=aiOk;
  genBtn.disabled=false; genBtn.textContent='✨ Tạo câu mới'; genBtn.classList.remove('is-loading');
  playUiSound(aiOk?'next':'error'); renderTranslateArea(root); renderTranslateStatus(root);
}

function renderTranslateArea(root){
  const t = state.ui.translateUi;

  if(!t.current){ area.innerHTML=''; return; }
  const c = t.current;
  if(!c.result){
    area.innerHTML = `
      ${!t.aiOk? `<div class="banner banner-warn">⚠️ Không thể kết nối AI để tạo câu — đang dùng câu mẫu cơ bản.<br><small style="opacity:.85">Chi tiết: ${escapeHtml(c.aiError || 'Không rõ nguyên nhân')}</small></div>` : ''}
      <div class="sentence-card duo-enter">
        <div class="sentence-vi">"${escapeHtml(c.vietnamese)}"</div>
        
        <div style="margin-bottom: 16px;">
          <button type="button" class="btn btn-sm btn-ghost t-hint-btn" style="color:var(--ink-soft); font-weight:normal; padding: 4px 8px;">💡 Nhấn để xem từ gợi ý</button>
          <div class="target-chips t-hint-content hidden" style="margin-top:8px;">${c.targetWords.map(w=>`<span class="chip">${escapeHtml(w)}</span>`).join('')}</div>
        </div>

        <div class="field"><label>Bản dịch tiếng Anh của bạn</label><textarea id="t-answer" placeholder="Nhập câu tiếng Anh..." rows="3" spellcheck="false"></textarea></div>
        <button class="btn btn-primary" id="t-submit">Nộp bài</button>
      </div>
    `;
    root.querySelector('#t-submit').addEventListener('click', ()=>submitTranslation(root));
    const hintBtn = root.querySelector('.t-hint-btn');
    if(hintBtn) {
      hintBtn.addEventListener('click', (e)=>{
        playUiSound('hint'); uiHaptic(8);
        e.target.classList.add('hidden');
        root.querySelector('.t-hint-content').classList.remove('hidden');
      });
    }
    const answerBox=root.querySelector('#t-answer');
    if(answerBox) answerBox.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); root.querySelector('#t-submit')?.click(); } });
  } else {
    const r=c.result;
    const scoreColor = r.score>=80?'var(--good)':r.score>=50?'var(--amber)':'var(--bad)';
    const scoreTint = r.score>=80?'var(--good-tint)':r.score>=50?'var(--amber-tint)':'var(--bad-tint)';
    const issueBlock = (title, arr)=> arr && arr.length? `<div style="margin-bottom:10px;"><b style="font-size:12.5px;">${title}</b><ul class="issue-list">${arr.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>` : '';
    area.innerHTML = `
      ${!t.aiOk? `<div class="banner banner-warn">⚠️ Không thể kết nối AI để chấm bài — đây là điểm ước tính cơ bản.</div>` : ''}
      <div class="sentence-card ${r.score>=80?'duo-pop':r.score<50?'duo-shake':'duo-enter'}">
        <div style="display:flex;gap:16px;align-items:flex-start;">
          <div class="score-badge ${r.score>=95?'duo-pulse':''}" style="background:${scoreTint};color:${scoreColor};">${r.score}</div>
          <div style="flex:1;">
            <div class="sentence-vi" style="font-size:16px;">"${escapeHtml(c.vietnamese)}"</div>
            <p style="font-size:13px;color:var(--ink-soft);margin:0;">${escapeHtml(r.overallFeedback||'')}</p>
          </div>
        </div>
        <div class="result-grid">
          <div class="result-box"><h4>Câu của bạn</h4>${escapeHtml(c.userAnswer)}</div>
          <div class="result-box"><h4>Câu đề xuất</h4>${escapeHtml(r.suggested)}</div>
        </div>
        <div style="margin-top:16px;">
          ${issueBlock('Ngữ pháp', r.grammarIssues)}
          ${issueBlock('Từ vựng', r.vocabIssues)}
          ${issueBlock('Chính tả', r.spellingIssues)}
          ${issueBlock('Từ còn thiếu', r.missingWords)}
          ${issueBlock('Từ thừa', r.extraWords)}
        </div>
        ${c.xpEarned?`<div style="margin-top:8px;font-size:12.5px;color:var(--accent-dark);font-weight:700;">+${c.xpEarned} XP · Combo ${t.combo||0}</div>`:''}
        ${translatePrefetchMatches(t)?`<div class="translate-ready">⚡ Câu tiếp theo đã sẵn sàng</div>`:''}
        <div style="margin-top:14px;"><button class="btn btn-primary" id="t-next">Câu tiếp theo →</button></div>
      </div>
    `;
    root.querySelector('#t-next').addEventListener('click', ()=>{ playUiSound('next'); t.current=null; generateNewSentence(root); });
  }
}

async function submitTranslation(root){
  const t = state.ui.translateUi;
  const c = t.current;
  const answerEl=root.querySelector('#t-answer');
  const answer = answerEl.value.trim();
  if(!answer){ playUiSound('error'); uiHaptic([18,25,18]); toast('Vui lòng nhập câu trả lời'); answerEl.classList.add('duo-shake'); setTimeout(()=>answerEl.classList.remove('duo-shake'),380); return; }
  const btn = root.querySelector('#t-submit');
  btn.disabled=true; btn.textContent='Đang chấm bài...'; btn.classList.add('is-loading');
  playUiSound('submit'); uiHaptic(8);

  let result, aiOk=true, prefetched=null;
  const nextWords=getNextTranslateWords(t);
  const recent=[...state.translationHistory.slice(-8).map(h=>h.vietnamese), ...(t.generatedLog||[]).slice(-4)];
  const started=performance.now();
  try{
    const pack=await AIModule.gradeTranslationAndNext(c.vietnamese,answer,c.targetWords,nextWords,recent);
    result=pack.grade;
    if(pack.next){
      prefetched={source:t.source,perSentence:t.perSentence,data:{vietnamese:pack.next.vietnamese,targetWords:pack.next.targetWords,hint:pack.next.hint||'',result:null,aiError:''}};
    }
  }catch(e){
    console.warn('Fast grade+next lỗi, quay về chấm chuẩn:',e);
    try{ result=await AIModule.gradeTranslation(c.vietnamese,answer,c.targetWords); }
    catch(err){ aiOk=false; result=AIModule.fallbackGrade(c.vietnamese,answer,c.targetWords); }
  }
  t.lastLatency=Math.max(1,performance.now()-started);
  t.prefetched=prefetched;

  const score=Number(result.score)||0;
  const xpEarned=score>=95?18:score>=80?14:score>=60?10:score>=40?6:3;
  if(score>=80) t.combo=(t.combo||0)+1;
  else if(score<50) t.combo=0;
  t.xp=(t.xp||0)+xpEarned;
  c.xpEarned=xpEarned;

  if(score>=95){ playUiSound('perfect'); uiHaptic([12,35,12]); }
  else if(score>=80){ playUiSound('correct'); uiHaptic(18); }
  else if(score>=50){ playUiSound('almost'); uiHaptic(12); }
  else { playUiSound('wrong'); uiHaptic([25,35,25]); }

  c.userAnswer=answer; c.result=result; t.aiOk=aiOk;
  state.translationHistory.push({
    id:uid('th'),date:new Date().toISOString(),vietnamese:c.vietnamese,targetWords:c.targetWords,
    userAnswer:answer,score:result.score,suggested:result.suggested
  });
  if(state.translationHistory.length>2000) state.translationHistory=state.translationHistory.slice(-2000);
  c.targetWords.forEach(ew=>{
    const w=state.words.find(x=>x.english.toLowerCase()===ew.toLowerCase());
    if(w) updateSrs(w,containsWholeWord(answer,ew)&&result.score>=50,'translate');
  });
  persist(); renderTranslateArea(root); renderTranslateStatus(root); showTranslateXpFx(xpEarned,score>=95);
}

      <div class="field">
        <label>Từ bạn muốn tự chọn đưa vào hội thoại (không bắt buộc)</label>
        <input type="text" id="c-custom" placeholder="VD: procrastinate, itinerary, overwhelmed — cách nhau bằng dấu phẩy">
        <div class="hint">AI sẽ cố gắng lồng đúng những từ này vào hội thoại, kể cả khi chưa có trong notebook.</div>
      </div>
      <div class="field-row">
        <div class="field"><label>Bốc thêm từ ngẫu nhiên từ</label><select id="c-source">${sourceOptionsHtml('all')}</select></div>
        <div class="field"><label>Số lượng bốc thêm</label>
          <select id="c-count"><option value="0">0 từ (chỉ dùng từ tự nhập)</option><option value="3">3 từ</option><option value="5" selected>5 từ</option><option value="8">8 từ</option></select>
        </div>
      </div>
      <div class="field"><label>Chọn tình huống</label>
        <div class="scenario-grid" id="c-scenarios">
          ${CHAT_SCENARIOS.map((s,i)=>`<div class="scenario-opt ${i===0?'selected':''}" data-sid="${s.id}"><b>${escapeHtml(s.label)}</b><span>${escapeHtml(s.desc)}</span></div>`).join('')}
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="c-start" style="margin-top:6px;">🎙️ Bắt đầu trò chuyện</button>
    </div>
  `;
  const mount=(root)=>{
    let selectedScenario = CHAT_SCENARIOS[0].id;
    root.querySelectorAll('.scenario-opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        selectedScenario = el.getAttribute('data-sid');
        root.querySelectorAll('.scenario-opt').forEach(o=>o.classList.toggle('selected', o===el));
      });
    });
    root.querySelector('#c-start').addEventListener('click', ()=>{
      const customRaw = root.querySelector('#c-custom').value || '';
      const customWords = [...new Set(customRaw.split(/[,\n]/).map(w=>w.trim()).filter(Boolean))];
      const customLower = new Set(customWords.map(w=>w.toLowerCase()));
      const source = parseSourceValue(root.querySelector('#c-source').value);
      const pool = wordsFromSource(source).filter(w=>!customLower.has((w.english||'').toLowerCase()));
      const count = parseInt(root.querySelector('#c-count').value)||0;
      const randomWords = pool.length && count>0 ? buildQueue(pool, Math.min(count, pool.length), true).map(w=>w.english) : [];
      const targetWords = [...customWords, ...randomWords];
      const scenario = CHAT_SCENARIOS.find(s=>s.id===selectedScenario) || CHAT_SCENARIOS[0];
      state.ui.chatSession = {
        phase:'active', scenarioId:scenario.id, scenarioLabel:scenario.label, targetWords,
        transcript:[{role:'ai', text:scenario.opener}], aiOk:true, listening:false
      };
      persist();
      render();
    });
  };
  return {html, mount};
}

function renderChatSession(){
  const sess = state.ui.chatSession;
  const html = `
    <div class="chat-wrap">
      <div class="page-head" style="margin-bottom:12px;">
        <div><h2>${escapeHtml(sess.scenarioLabel)}</h2><p>Nói hoặc gõ chữ để trò chuyện với AI.</p></div>
      </div>
      ${sess.targetWords.length? `<div class="target-chips">${sess.targetWords.map(w=>`<span class="chip">${escapeHtml(w)}</span>`).join('')}</div>` : ''}
      ${!sess.aiOk? `<div class="banner banner-warn">⚠️ Không thể kết nối AI lúc trả lời gần nhất — đang dùng câu trả lời mẫu cơ bản.</div>` : ''}
      <div class="card">
        <div class="chat-log" id="c-log">
          ${sess.transcript.map(m=>`<div class="chat-bubble ${m.role}">${escapeHtml(m.text)}</div>`).join('')}
        </div>
        <div class="chat-input-row">
          ${isSpeechRecognitionSupported()? `<button class="mic-btn" id="c-mic" title="Nhấn để nói">🎤</button>` : ''}
          <textarea id="c-input" rows="1" placeholder="Gõ câu trả lời bằng tiếng Anh, hoặc nhấn micro để nói..."></textarea>
          <button class="btn btn-primary" id="c-send">Gửi</button>
        </div>
      </div>
      <div class="session-actions">
        <button class="btn btn-warm" id="c-end">Kết thúc &amp; Chấm điểm</button>
        <button class="btn btn-ghost" id="c-quit">Thoát (không lưu)</button>
      </div>
    </div>
  `;
  const mount=(root)=>{
    const log = root.querySelector('#c-log');
    log.scrollTop = log.scrollHeight;

    const lastMsg = sess.transcript[sess.transcript.length-1];
    if(!isMobileDevice && lastMsg && lastMsg.role==='ai' && state.settings.autoTTS){
      speak(lastMsg.text);
    }

    const input = root.querySelector('#c-input');
    const sendBtn = root.querySelector('#c-send');
    let sending = false;

    const sendMessage = async (text)=>{
      const msg = (text||'').trim();
      if(!msg || sending) return;
      sending = true;
      sendBtn.disabled = true;
      sess.transcript.push({role:'user', text:msg});
      persist();
      render();
      const rootAfter = document.getElementById('main');
      try{
        const wordObjs = sess.targetWords.map(w=>({english:w, vietnamese:''}));
        wordObjs.forEach(o=>{ const w = state.words.find(x=>x.english.toLowerCase()===o.english.toLowerCase()); if(w) o.vietnamese = w.vietnamese; });
        let reply, aiOk = true;
        try{
          reply = await AIModule.chatReply(sess.scenarioLabel, wordObjs, sess.transcript, msg);
        }catch(e){
          aiOk = false;
          reply = AIModule.fallbackChatReply();
        }
        sess.transcript.push({role:'ai', text:reply});
        sess.aiOk = aiOk;
        persist();
      }finally{
        sending = false;
        render();
      }
    };

    sendBtn.addEventListener('click', ()=>{ const v=input.value; input.value=''; sendMessage(v); });
    input.addEventListener('keydown', e=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); const v=input.value; input.value=''; sendMessage(v); }
    });
    input.focus();

    const micBtn = root.querySelector('#c-mic');
    if(micBtn){
      let recognizer = null;
      micBtn.addEventListener('click', ()=>{
        if(micBtn.classList.contains('listening')){
          recognizer?.stop();
          return;
        }
        recognizer = createSpeechRecognizer({
          onResult:(text)=>{ if(text) sendMessage(text); },
          onError:()=>{ toast('Không nhận diện được giọng nói, thử lại nhé'); },
          onEnd:()=>{ micBtn.classList.remove('listening'); }
        });
        if(!recognizer){ toast('Trình duyệt không hỗ trợ nhận diện giọng nói'); return; }
        micBtn.classList.add('listening');
        recognizer.start();
      });
    }

    root.querySelector('#c-quit').addEventListener('click', ()=>{
      if(confirm('Thoát mà không lưu lại buổi trò chuyện này?')){ state.ui.chatSession=null; render(); }
    });

    root.querySelector('#c-end').addEventListener('click', async ()=>{
      const endBtn = root.querySelector('#c-end');
      endBtn.disabled = true; endBtn.textContent = 'Đang chấm điểm...';
      let result, aiOk = true;
      try{
        result = await AIModule.gradeConversation(sess.scenarioLabel, sess.targetWords, sess.transcript);
      }catch(e){
        aiOk = false;
        result = AIModule.fallbackGradeConversation(sess.targetWords, sess.transcript);
      }
      state.conversationHistory.push({
        id: uid('ch'), date:new Date().toISOString(), scenario:sess.scenarioLabel, targetWords:sess.targetWords,
        transcript: sess.transcript, score:result.score, overallFeedback:result.overallFeedback,
        strengths:result.strengths, improvements:result.improvements, wordsUsed:result.wordsUsed
      });
      if(state.conversationHistory.length > 500){
        state.conversationHistory = state.conversationHistory.slice(-500);
      }
      sess.targetWords.forEach(ew=>{
        const w = state.words.find(x=>x.english.toLowerCase()===ew.toLowerCase());
        if(w){
          const usage=(result.wordUsage||[]).find(u=>String(u.word||'').toLowerCase()===ew.toLowerCase());
          const userText=sess.transcript.filter(m=>m.role==='user').map(m=>m.text).join(' ');
          const correctUsage=usage?!!usage.correct:containsWholeWord(userText,ew);
          updateSrs(w,correctUsage?'good':'again','chat');
        }
      });
      sess.phase = 'summary';
      sess.result = result;
      sess.aiOk = aiOk;
      persist();
      render();
    });
  };
  return {html, mount};
}

function renderChatSummary(){
  const sess = state.ui.chatSession;
  const r = sess.result || {score:0, overallFeedback:'', strengths:[], improvements:[], wordsUsed:[]};
  const issueBlock = (title, arr)=> arr && arr.length? `<div style="margin-bottom:10px;"><b style="font-size:12.5px;">${title}</b><ul class="issue-list">${arr.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>` : '';
  const html = `

        <div class="score-badge" style="margin:0 auto 14px;background:${r.score>=80?'var(--good-tint)':r.score>=50?'var(--amber-tint)':'var(--bad-tint)'};color:${r.score>=80?'var(--good)':r.score>=50?'var(--amber)':'var(--bad)'}">${r.score}</div>
        <h2 style="margin-bottom:4px;">Kết thúc buổi trò chuyện</h2>
        <p style="color:var(--ink-soft);">${escapeHtml(sess.scenarioLabel)}</p>

      <div class="card" style="margin-top:16px;">

        ${r.wordsUsed && r.wordsUsed.length? `<div><b style="font-size:12.5px;">Từ vựng đã dùng</b><div class="target-chips" style="margin-top:6px;">${r.wordsUsed.map(w=>`<span class="chip">${escapeHtml(w)}</span>`).join('')}</div></div>` : ''}
      </div>
      <div class="session-actions">
        <button class="btn btn-primary" id="c-back">Về Tổng quan</button>
        <button class="btn" id="c-again">Trò chuyện tiếp</button>
      </div>
