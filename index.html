const POS_OPTIONS = ['danh từ','động từ','tính từ','trạng từ','cụm từ','giới từ','khác'];

function openWordForm(word, notebookId){
  const isEdit = !!word;
  openModal(`
    <div class="modal-head"><h3>${isEdit?'Sửa từ':'Từ mới'}</h3><button class="modal-close" data-close>&times;</button></div>
    <form id="word-form">
      ${state.notebooks.length>1? `
      <div class="field"><label>Notebook</label>
        <select name="notebookId">${state.notebooks.map(n=>`<option value="${n.id}" ${(isEdit?word.notebookId:notebookId)===n.id?'selected':''}>${escapeHtml(n.name)}</option>`).join('')}</select>
      </div>` : ''}
      <div class="field">
        <label>English / Phrasal verb *</label>
        <input type="text" name="english" required value="${isEdit?escapeHtml(word.english):''}" placeholder="VD: commit / commit to / give up / look forward to">
        <div class="hint">Nhập được cả từ đơn, phrasal verb và cụm động từ (ví dụ: <b>commit to</b>, <b>look after</b>).</div>
      </div>
      <div class="field">
        <label>Nghĩa tiếng Việt *</label>
        <input type="text" name="vietnamese" id="wf-vi" required value="${isEdit?escapeHtml(word.vietnamese):''}" placeholder="VD: cam kết, tận tâm với; từ bỏ; mong đợi...">
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin:-4px 0 12px;flex-wrap:wrap;">
        <button type="button" class="btn btn-sm" id="wf-autofill" title="Tra cứu từ / phrasal verb miễn phí" style="white-space:nowrap;">📖 Tra từ / phrasal verb</button>
        <span class="hint" id="wf-autofill-status" style="margin:0;"></span>
      </div>
      <div class="field-row">
        <div class="field"><label>Từ loại</label>
          <select name="pos">
            <option value="">— Chọn —</option>
            ${POS_OPTIONS.map(p=>`<option value="${p}" ${isEdit&&word.pos===p?'selected':''}>${p}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Phát âm (IPA)</label><input type="text" name="pronunciation" id="wf-ipa" value="${isEdit?escapeHtml(word.pronunciation||''):''}" placeholder="VD: /əˈbʌndənt/"></div>
      </div>
      <div class="field"><label>Từ đồng nghĩa (tiếng Anh, cách nhau bằng dấu phẩy)</label><input type="text" name="synonyms" value="${isEdit?escapeHtml(word.synonyms||''):''}" placeholder="VD: attain, accomplish"><div class="hint">Khi luyện tập, gõ đúng từ chính hoặc bất kỳ từ đồng nghĩa nào ở đây đều được tính là đúng.</div></div>
      <div class="field"><label>Câu ví dụ</label><textarea name="example" placeholder="Câu ví dụ có chứa từ này...">${isEdit?escapeHtml(word.example||''):''}</textarea></div>
      <div class="field"><label>Ghi chú</label><textarea name="note" placeholder="Ghi chú thêm (không bắt buộc)">${isEdit?escapeHtml(word.note||''):''}</textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Huỷ</button>
        <button type="submit" class="btn btn-primary">${isEdit?'Lưu thay đổi':'Thêm từ'}</button>
      </div>
    </form>
  `);
  const box=document.getElementById('modal-box');
  box.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));

  const englishInput = box.querySelector('input[name="english"]');
  const viInput = box.querySelector('#wf-vi');
  const ipaInput = box.querySelector('#wf-ipa');
  const posSelect = box.querySelector('select[name="pos"]');
  const exampleTextarea = box.querySelector('textarea[name="example"]');
  const autofillBtn = box.querySelector('#wf-autofill');
  const statusEl = box.querySelector('#wf-autofill-status');

  /* Chỉ tra cứu khi người dùng CHỦ ĐỘNG bấm nút — không tự động gọi khi rời khỏi ô,
     để tránh làm chậm khi bạn thêm nhiều từ liên tiếp. Nếu cần thêm nhiều từ cùng
     lúc, dùng nút "+ Thêm nhiều từ" ở trang Notebook. Cả hai đều dùng từ điển miễn phí
     (Dictionary API + MyMemory), không cần API key, không tốn hạn mức Gemini. */
  autofillBtn.addEventListener('click', async ()=>{
    const en = englishInput.value.trim();
    if(!en){ toast('Nhập từ tiếng Anh trước đã'); englishInput.focus(); return; }
    autofillBtn.disabled = true;
    const oldLabel = autofillBtn.textContent;
    autofillBtn.textContent = '⏳ Đang tra...';
    statusEl.textContent = '';
    statusEl.style.color = 'var(--ink-faint)';
    try{
      const info = await DictModule.lookupWordInfo(en);
      let filled=[];
      if(info.pronunciation && info.pronunciation.trim()){ ipaInput.value = info.pronunciation.trim(); filled.push('IPA'); }
      if(info.vietnamese && info.vietnamese.trim()){ viInput.value = info.vietnamese.trim(); filled.push('nghĩa'); }
      if(info.pos && posSelect){
        const match = POS_OPTIONS.find(p=>p===info.pos) || POS_OPTIONS.find(p=>info.pos.includes(p));
        if(match){ posSelect.value = match; filled.push('từ loại'); }
      }
      if(info.example && exampleTextarea){ exampleTextarea.value = info.example.trim(); filled.push('ví dụ'); }
      if(filled.length){
        statusEl.textContent = '✓ Đã tự điền: ' + filled.join(', ');
        statusEl.style.color = 'var(--good)';
      } else {
        statusEl.textContent = 'Từ này chưa có dữ liệu miễn phí; bạn có thể nhập tay.';
        statusEl.style.color = 'var(--amber)';
      }
    }catch(e){
      statusEl.textContent = 'Không thể tra cứu: ' + (e.message||'lỗi không xác định');
      statusEl.style.color = 'var(--bad)';
    }finally{
      autofillBtn.disabled = false;
      autofillBtn.textContent = oldLabel;
    }
  });

  box.querySelector('#word-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const data={
      english:fd.get('english'), vietnamese:fd.get('vietnamese'), pos:fd.get('pos'),
      example:fd.get('example'), pronunciation:fd.get('pronunciation'), note:fd.get('note'),
      synonyms:fd.get('synonyms'),
      notebookId: fd.get('notebookId')||notebookId
    };
    if(!data.english.trim() || !data.vietnamese.trim()){ toast('Vui lòng nhập đủ English và nghĩa tiếng Việt'); return; }
    if(isEdit) updateWord(word.id, data); else createWord(data.notebookId, data);
    toast(isEdit?'Đã lưu từ':'Đã thêm từ mới');
    closeModal(); render();
  });
}

/* ---------------------------- Thêm nhiều từ cùng lúc (tra từ điển MIỄN PHÍ, không cần API key) ----------------------------
   Người dùng gõ hết danh sách từ tiếng Anh muốn thêm, rồi bấm 1 nút để hệ thống tra cứu TẤT CẢ
   qua Dictionary API (IPA, từ loại, ví dụ) + MyMemory (nghĩa tiếng Việt) — miễn phí, không cần
   API key, không tốn hạn mức Gemini. */
function openBulkAddWordsForm(notebookId){
  openModal(`
    <div class="modal-head"><h3>Thêm nhiều từ cùng lúc</h3><button class="modal-close" data-close>&times;</button></div>
    <p class="hint" style="margin-top:0;">Gõ/dán hết danh sách từ tiếng Anh bạn muốn thêm (mỗi từ một dòng, hoặc cách nhau bằng dấu phẩy). Hệ thống sẽ tra IPA, từ loại, câu ví dụ (Dictionary API) và nghĩa tiếng Việt (MyMemory) — <b>miễn phí, không cần API key, không dùng hạn mức Gemini</b>.</p>
    <div class="field"><label>Danh sách từ tiếng Anh *</label>
      <textarea id="bulk-input" rows="6" placeholder="VD:
abundant
diligent
achieve, environment, improve"></textarea>
    </div>
    <button class="btn btn-primary btn-block" id="bulk-lookup">📖 Tra cứu miễn phí (không cần API key)</button>
    <div id="bulk-status" class="hint" style="margin-top:8px;"></div>
    <div id="bulk-preview"></div>
    <div class="modal-actions" id="bulk-close-row">
      <button type="button" class="btn" data-close>Đóng</button>
    </div>
  `, true);
  const box=document.getElementById('modal-box');
  box.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));

  box.querySelector('#bulk-lookup').addEventListener('click', async ()=>{
    const raw = box.querySelector('#bulk-input').value;
    const words = [...new Set(raw.split(/[\n,]/).map(w=>w.trim()).filter(Boolean))];
    if(words.length===0){ toast('Nhập ít nhất 1 từ'); return; }
    if(words.length>60){ toast('Mỗi lần chỉ nên tra tối đa khoảng 60 từ để tránh bị giới hạn tốc độ'); return; }
    const btn = box.querySelector('#bulk-lookup');
    const statusEl = box.querySelector('#bulk-status');
    btn.disabled=true; btn.textContent=`Đang tra ${words.length} từ (0/${words.length})...`;
    statusEl.textContent=''; box.querySelector('#bulk-preview').innerHTML='';
    try{
      const results = await DictModule.lookupWordInfoBatch(words, (done, total)=>{
        btn.textContent = `Đang tra ${total} từ (${done}/${total})...`;
      });
      renderBulkPreview(box, words, results, notebookId);
      statusEl.textContent = `✓ Đã tra xong ${words.length} từ (miễn phí, không cần API key) — kiểm tra/sửa lại bên dưới rồi bấm "Thêm tất cả".`;
      statusEl.style.color='var(--good)';
    }catch(e){
      statusEl.textContent = 'Không thể tra cứu: ' + (e.message||'lỗi không xác định') + '. Bạn vẫn có thể điền tay ở bảng bên dưới.';
      statusEl.style.color='var(--bad)';
      renderBulkPreview(box, words, [], notebookId);
    }finally{
      btn.disabled=false; btn.textContent='📖 Tra cứu miễn phí (không cần API key)';
    }
  });
}

function renderBulkPreview(box, words, results, notebookId){
  const lookup = new Map();
  (results||[]).forEach(r=>{ if(r && r.english) lookup.set(normalizeWordText(r.english), r); });
  const rows = words.map((w,i)=>{
    const r = lookup.get(normalizeWordText(w)) || (results && results[i]) || {};
    return { english:w, pronunciation:r.pronunciation||'', vietnamese:r.vietnamese||'', pos:r.pos||'', example:r.example||'' };
  });
  const preview = box.querySelector('#bulk-preview');
  preview.innerHTML = `
    <div class="table-wrap" style="margin-top:14px;">
      <table>
        <thead><tr><th>English</th><th>IPA</th><th>Nghĩa (VI)</th><th>Từ loại</th><th>Ví dụ</th></tr></thead>
        <tbody>
          ${rows.map((r,i)=>`
            <tr data-row="${i}">
              <td><b>${escapeHtml(r.english)}</b></td>
              <td><input type="text" class="bulk-ipa" value="${escapeHtml(r.pronunciation)}" style="width:110px;"></td>
              <td><input type="text" class="bulk-vi" value="${escapeHtml(r.vietnamese)}" style="width:140px;"></td>
              <td>
                <select class="bulk-pos">
                  <option value="">—</option>
                  ${POS_OPTIONS.map(p=>`<option value="${p}" ${r.pos===p?'selected':''}>${p}</option>`).join('')}
                </select>
              </td>
              <td><input type="text" class="bulk-example" value="${escapeHtml(r.example)}" style="width:220px;"></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <button class="btn btn-primary btn-block" id="bulk-save" style="margin-top:14px;">Thêm tất cả (${rows.length} từ) vào Notebook</button>
  `;
  preview.querySelector('#bulk-save').addEventListener('click', ()=>{
    const trs = preview.querySelectorAll('tbody tr');
    let added=0;
    trs.forEach(tr=>{
      const idx = Number(tr.getAttribute('data-row'));
      const w = rows[idx];
      const vi = tr.querySelector('.bulk-vi').value.trim();
      if(!w.english.trim() || !vi) return;
      createWord(notebookId, {
        english: w.english,
        vietnamese: vi,
        pos: tr.querySelector('.bulk-pos').value,
        pronunciation: tr.querySelector('.bulk-ipa').value.trim(),
        example: tr.querySelector('.bulk-example').value.trim(),
        synonyms: ''
      });
      added++;
    });
    toast(`Đã thêm ${added} từ vào notebook`);
    closeModal(); render();
  });
}

function exportWordsCSV(words, filenameBase){
  const header=['Notebook','English','Vietnamese','PartOfSpeech','Example','Pronunciation','Synonyms','Note'];
  const lines=[header.map(csvEscape).join(',')];
  words.forEach(w=>{
    const nb=getNotebook(w.notebookId);
    lines.push([nb?nb.name:'', w.english, w.vietnamese, w.pos, w.example, w.pronunciation, w.synonyms, w.note].map(csvEscape).join(','));
  });
  downloadTextFile(`${filenameBase||'tu-vung'}-${new Date().toISOString().slice(0,10)}.csv`, '\uFEFF'+lines.join('\n'), 'text/csv;charset=utf-8');
  toast('Đã xuất file CSV');
}

function openImportForm(){
  openModal(`
    <div class="modal-head"><h3>Nhập từ vựng từ CSV</h3><button class="modal-close" data-close>&times;</button></div>
    <p class="hint">File CSV cần có các cột: <b>English, Vietnamese</b> (bắt buộc), và tuỳ chọn: Notebook, PartOfSpeech, Example, Pronunciation, Synonyms, Note.</p>
    <div class="field"><label>Chọn file CSV *</label><input type="file" id="csv-file" accept=".csv,text/csv"></div>
    <div class="field"><label>Notebook đích (dùng khi dòng không có cột Notebook, hoặc notebook đó chưa tồn tại)</label>
      <select id="csv-target-nb">
        <option value="__new__">+ Tạo notebook mới từ tên file</option>
        ${state.notebooks.map(n=>`<option value="${n.id}">${escapeHtml(n.name)}</option>`).join('')}
      </select>
    </div>
    <div id="csv-preview" class="hint"></div>
    <div class="modal-actions">
      <button type="button" class="btn" data-close>Huỷ</button>
      <button type="button" class="btn btn-primary" id="csv-import-btn" disabled>Nhập dữ liệu</button>
    </div>
  `);
  const box=document.getElementById('modal-box');
  box.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
  let parsedRows=null, headerIdx=null, fileBase='nhap-tu';
  box.querySelector('#csv-file').addEventListener('change', (e)=>{
    const file=e.target.files[0]; if(!file) return;
    fileBase=file.name.replace(/\.csv$/i,'');
    const reader=new FileReader();
    reader.onload=()=>{
      const rows=parseCSV(reader.result);
      if(rows.length<2){ toast('File CSV không có dữ liệu'); return; }
      const header=rows[0].map(h=>h.trim().toLowerCase());
      const idx={
        notebook: header.indexOf('notebook'),
        english: header.indexOf('english'),
        vietnamese: header.indexOf('vietnamese'),
        pos: header.indexOf('partofspeech'),
        example: header.indexOf('example'),
        pronunciation: header.indexOf('pronunciation'),
        synonyms: header.indexOf('synonyms'),
        note: header.indexOf('note')
      };
      if(idx.english<0 || idx.vietnamese<0){ toast('File CSV cần có cột English và Vietnamese'); return; }
      parsedRows=rows.slice(1).filter(r=>r[idx.english] && r[idx.english].trim());
      headerIdx=idx;
      box.querySelector('#csv-preview').textContent = `Tìm thấy ${parsedRows.length} từ hợp lệ trong file.`;
      box.querySelector('#csv-import-btn').disabled=false;
    };
    reader.readAsText(file, 'UTF-8');
  });
  box.querySelector('#csv-import-btn').addEventListener('click', ()=>{
    if(!parsedRows) return;
    const targetSel = box.querySelector('#csv-target-nb').value;
    let added=0;
    const nameToNbId = {};
    state.notebooks.forEach(n=>{ nameToNbId[n.name.toLowerCase()]=n.id; });
    parsedRows.forEach(r=>{
      let nbId;
      const rowNbName = headerIdx.notebook>=0 ? (r[headerIdx.notebook]||'').trim() : '';
      if(rowNbName){
        nbId = nameToNbId[rowNbName.toLowerCase()];
        if(!nbId){ const nb=createNotebook({name:rowNbName, color:pick(NB_COLORS)}); nbId=nb.id; nameToNbId[rowNbName.toLowerCase()]=nb.id; }
      } else if(targetSel==='__new__'){
        if(!nameToNbId[fileBase.toLowerCase()]){ const nb=createNotebook({name:fileBase, color:pick(NB_COLORS)}); nameToNbId[fileBase.toLowerCase()]=nb.id; }
        nbId = nameToNbId[fileBase.toLowerCase()];
      } else {
        nbId = targetSel;
      }
      createWord(nbId, {
        english: r[headerIdx.english]||'',
        vietnamese: r[headerIdx.vietnamese]||'',
        pos: headerIdx.pos>=0 ? (r[headerIdx.pos]||'') : '',
        example: headerIdx.example>=0 ? (r[headerIdx.example]||'') : '',
        pronunciation: headerIdx.pronunciation>=0 ? (r[headerIdx.pronunciation]||'') : '',
        synonyms: headerIdx.synonyms>=0 ? (r[headerIdx.synonyms]||'') : '',
        note: headerIdx.note>=0 ? (r[headerIdx.note]||'') : ''
      });
      added++;
    });
    toast(`Đã nhập ${added} từ`);
    closeModal(); render();
  });
}

const PRACTICE_MODES = [
  {id:'vi2en', label:'Việt → Anh'},
  {id:'en2vi', label:'Anh → Việt'},
  {id:'mcq', label:'Trắc nghiệm'},

PAGES.practice = function(){
  const sess = state.ui.practiceSession;
  if(sess && sess.phase==='active') return renderPracticeSession();
  if(sess && sess.phase==='summary') return renderPracticeSummary();

function renderPracticeSetup(){
  const prefill = state.ui.practicePrefill;

  const html = `
    <div class="page-head"><div><h2>Kiểm tra từ vựng</h2><p>Chọn nguồn từ và dạng bài để bắt đầu luyện tập.</p></div></div>
    <div class="card" style="max-width:640px;">
      <div class="field"><label>Nguồn từ vựng</label>
        <select id="p-source">${sourceOptionsHtml(selectedSourceVal)}</select>
      </div>
      <div class="field-row">
        <div class="field"><label>Số lượng từ</label><input type="number" id="p-count" min="1" max="200" value="10"></div>
        <div class="field" style="display:flex;align-items:flex-end;padding-bottom:9px;">
          <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:13.5px;color:var(--ink);">
            <input type="checkbox" id="p-prioritize" checked style="width:auto;"> Ưu tiên từ sai / lâu chưa ôn
          </label>
        </div>
      </div>
      <div class="field"><label>Dạng luyện tập</label>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${PRACTICE_MODES.map(m=>`<label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:13.5px;"><input type="checkbox" class="p-mode" value="${m.id}" checked style="width:auto;"> ${m.label}</label>`).join('')}
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="p-start" style="margin-top:6px;">Bắt đầu luyện tập</button>
    </div>
  `;
  const mount=(root)=>{
    const startBtn=root.querySelector('#p-start');
    const doStart=()=>{
      const source = parseSourceValue(root.querySelector('#p-source').value);
      let pool = wordsFromSource(source);
      if(pool.length===0){ toast('Nguồn từ vựng này chưa có từ nào'); return; }
      const count = Math.max(1, Math.min(200, parseInt(root.querySelector('#p-count').value)||10));
      const prioritize = root.querySelector('#p-prioritize').checked;
      const modes = [...root.querySelectorAll('.p-mode:checked')].map(c=>c.value);
      if(modes.length===0){ toast('Chọn ít nhất 1 dạng luyện tập'); return; }
      const queueWords = buildQueue(pool, count, prioritize);
      const questions = queueWords.map(w=>buildQuestion(w, modes, pool));
      state.ui.practiceSession = { phase:'active', index:0, questions, answers:[], modes, source, answered:false };
      render();
    };
    startBtn.addEventListener('click', doStart);
    if(autoStart) doStart();
  };
  return {html, mount};
}

function buildQuestion(word, modes, pool){
  const mode = pick(modes);
  const q = { wordId: word.id, mode };
  if(mode==='mcq' || mode==='listen'){
    const direction = mode==='listen' ? 'en2vi' : (Math.random()<0.5?'en2vi':'vi2en');
    q.direction = direction;
    const correctVal = direction==='en2vi' ? word.vietnamese : word.english;
    const distractorPool = shuffleArray(pool.filter(w=>w.id!==word.id));
    const distractors = [];
    const seen = new Set([normalizeAnswer(correctVal)]);
    for(const candidate of distractorPool){
      const value = direction==='en2vi' ? candidate.vietnamese : candidate.english;
      const key = normalizeAnswer(value);
      if(!key || seen.has(key)) continue;
      seen.add(key);
      distractors.push(value);
      if(distractors.length>=3) break;
    }
    q.options = shuffleArray([correctVal, ...distractors]);
  }
  if(mode === 'fill'){
  const ex = word.example || '';

  const escapedWord = word.english.replace(
    /[.*+?^${}()|[\]\\]/g,
    '\\$&'
  );

  const re = new RegExp(
    `(^|\\s)${escapedWord}(?=\\s|[.,!?;:]|$)`,
    'i'
  );

  if(ex && re.test(ex)){
    q.sentence = ex.replace(re, '$1_____');
  } else {
    q.mode = 'vi2en';
  }
}
  return q;
}

function renderPracticeSession(){

  let bodyHtml='';
  if(q.mode==='vi2en'){

      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt">${escapeHtml(word.vietnamese)}</div>
      <div class="q-sub">${escapeHtml(word.pos||'')}</div>

    `;
  } else if(q.mode==='en2vi'){
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt">${escapeHtml(word.english)}</div>
      <div class="q-sub">${escapeHtml(word.pronunciation||'')}</div>
      <input type="text" class="q-input" id="q-answer" placeholder="Nhập nghĩa tiếng Việt..." autocomplete="off">
      <button class="btn btn-primary btn-block" id="q-submit" style="margin-top:16px;">Kiểm tra</button>
    `;
  } else if(q.mode==='write'){
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt">${escapeHtml(word.vietnamese)}</div>
      <div class="q-sub">${escapeHtml([word.pos, word.note].filter(Boolean).join(' · ')||'Viết từ tiếng Anh tương ứng')}</div>
      <input type="text" class="q-input" id="q-answer" placeholder="Viết từ tiếng Anh..." autocomplete="off">
      <button class="btn btn-primary btn-block" id="q-submit" style="margin-top:16px;">Kiểm tra</button>
    `;
  } else if(q.mode==='fill'){
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt" style="font-size:19px;">${escapeHtml(q.sentence)}</div>
      <div class="q-sub">Nghĩa: ${escapeHtml(word.vietnamese)}</div>
      <input type="text" class="q-input" id="q-answer" placeholder="Điền từ còn thiếu..." autocomplete="off">
      <button class="btn btn-primary btn-block" id="q-submit" style="margin-top:16px;">Kiểm tra</button>
    `;
  } else if(q.mode==='mcq'){
    const promptText = q.direction==='en2vi' ? word.english : word.vietnamese;
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt">${escapeHtml(promptText)}</div>
      <div class="q-sub">${q.direction==='en2vi'?'Chọn nghĩa tiếng Việt đúng':'Chọn từ tiếng Anh đúng'}</div>
      <div class="mcq-grid" id="q-mcq">
        ${q.options.map((o,i)=>`<button class="mcq-opt" data-val="${escapeHtml(o)}" data-i="${i}">${escapeHtml(o)}</button>`).join('')}
      </div>
    `;
  } else if(q.mode==='listen'){
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <button class="speak-btn" id="q-speak" title="Nghe">🔊</button>
      <div class="q-sub">Nghe và chọn nghĩa đúng</div>
      <div class="mcq-grid" id="q-mcq">
        ${q.options.map((o,i)=>`<button class="mcq-opt" data-val="${escapeHtml(o)}" data-i="${i}">${escapeHtml(o)}</button>`).join('')}
      </div>
    `;
  }

    <div class="practice-wrap">

      </div>

    root.querySelector('#q-quit').addEventListener('click', ()=>{

    });
    const speakBtn = root.querySelector('#q-speak');
    if(speakBtn){
      if(!isMobileDevice && state.settings.autoTTS) speak(word.english);
      speakBtn.addEventListener('click', ()=>speak(word.english));
    }

    const finishAnswer = (isCorrect, userVal)=>{
      updateSrs(word, isCorrect,q.mode);
      sess.answers.push({wordId:word.id, mode:q.mode, correct:isCorrect, userVal});
      persist();
      const explainParts = [];
      if(word.pos) explainParts.push(word.pos);
      if(word.example) explainParts.push('VD: '+word.example);
      if(word.note) explainParts.push(word.note);
      const fb = root.querySelector('#q-feedback');
      fb.innerHTML = `
        <div class="feedback-panel ${isCorrect?'ok':'no'}">

        <button class="btn btn-primary btn-block" id="q-next" style="margin-top:14px;">${sess.index+1>=sess.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>
      `;
      root.querySelectorAll('.mcq-opt').forEach(b=>b.setAttribute('disabled','true'));
      const input=root.querySelector('#q-answer'); if(input) input.setAttribute('disabled','true');
      const sub=root.querySelector('#q-submit'); if(sub) sub.remove();
      fb.querySelector('#q-next').addEventListener('click', ()=>{
        sess.index++;
        if(sess.index>=sess.questions.length){
          const total=sess.answers.length, correct=sess.answers.filter(a=>a.correct).length;
          state.practiceSessions.push({id:uid('ps'), date:new Date().toISOString(), modes:sess.modes, total, correct, answers:sess.answers});
          if(state.practiceSessions.length > 1000){
            state.practiceSessions =
              state.practiceSessions.slice(-1000);
          }
          persist();
          sess.phase='summary';
        }
        render();
      });
      fb.querySelector('#q-next').focus();
    };

    if(q.mode==='mcq' || q.mode==='listen'){
      const correctVal = q.direction==='en2vi' ? word.vietnamese : word.english;
      root.querySelectorAll('.mcq-opt').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const val=btn.getAttribute('data-val');
          const isCorrect = val===correctVal;
          root.querySelectorAll('.mcq-opt').forEach(b=>{
            if(b.getAttribute('data-val')===correctVal) b.classList.add('correct');
          });
          if(!isCorrect) btn.classList.add('wrong');
          finishAnswer(isCorrect, val);
        });
      });
    } else {
      const input = root.querySelector('#q-answer');
      const submit = root.querySelector('#q-submit');
      const checkAns = ()=>{
        const val = input.value;
        let isCorrect=false;
        if(q.mode==='en2vi'){
          isCorrect = answerMatches(val, word.vietnamese.split(/[\/,;]/), true);
        } else if(q.mode==='fill'){
          isCorrect = answerMatches(val, word.english.split('/'), false);
        } else {
          isCorrect = answerMatches(val, acceptedEnglishAnswers(word), false);
        }
        finishAnswer(isCorrect, val);
      };
      submit.addEventListener('click', checkAns);
      input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); checkAns(); } });
      input.focus();
    }
  };
  return {html, mount};
}

function renderPracticeSummary(){

  const wrongIds = [...new Set(sess.answers.filter(a=>!a.correct).map(a=>a.wordId))];

  const html = `

          ${wrongWords.map(w=>`<tr><td><b>${escapeHtml(w.english)}</b></td><td>${escapeHtml(w.vietnamese)}</td></tr>`).join('')}
        </tbody></table></div>
      </div>` : ''}
      <div class="session-actions">
        ${wrongWords.length? `<button class="btn btn-warm" id="retry-wrong">Luyện lại từ sai</button>` : ''}
        <button class="btn btn-primary" id="back-dash">Về Tổng quan</button>

      </div>

  const mount=(root)=>{

      state.ui.practiceSession = {phase:'active', index:0, questions, answers:[], modes, source:sess.source};
      render();
    });
    root.querySelector('#back-dash').addEventListener('click', ()=>{ state.ui.practiceSession=null; navigate('dashboard'); });
    root.querySelector('#new-session').addEventListener('click', ()=>{ state.ui.practiceSession=null; render(); });
  };
  return {html, mount};
}

PAGES.translate = function(){
  const t = state.ui.translateUi || (state.ui.translateUi = { source:'all', perSentence:2, current:null, aiOk:true, loading:false, showHint:true });

  const html = `
    <div class="page-head"><div><h2>Luyện dịch câu</h2><p>AI tạo câu tiếng Việt dựa trên từ vựng bạn đang học, bạn dịch sang tiếng Anh và được chấm chi tiết.</p></div></div>

    <div class="card" style="max-width:640px;margin-bottom:18px;">
      <div class="field-row">
        <div class="field"><label>Nguồn từ vựng</label><select id="t-source">${sourceOptionsHtml(t.source)}</select></div>
        <div class="field"><label>Số từ mỗi câu</label>
          <select id="t-count"><option value="1" ${t.perSentence===1?'selected':''}>1 từ</option><option value="2" ${t.perSentence===2?'selected':''}>2 từ</option><option value="3" ${t.perSentence===3?'selected':''}>3 từ</option></select>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="t-generate">✨ Tạo câu mới</button>
    </div>

    <div id="t-area"></div>
  `;

  const mount=(root)=>{
    root.querySelector('#t-source').addEventListener('change', e=>{ t.source=e.target.value; });
    root.querySelector('#t-count').addEventListener('change', e=>{ t.perSentence=parseInt(e.target.value); });
    root.querySelector('#t-generate').addEventListener('click', ()=>generateNewSentence(root));
    if(t.current) renderTranslateArea(root);
  };
  return {html, mount};
};

async function generateNewSentence(root){
  const t = state.ui.translateUi;
  const source = parseSourceValue(t.source);
  const pool = wordsFromSource(source);
  if(pool.length===0){ toast('Nguồn từ vựng này chưa có từ nào'); return; }
  const targetWords = buildQueue(pool, t.perSentence, true);
  const genBtn = root.querySelector('#t-generate');
  genBtn.disabled=true; genBtn.textContent='Đang tạo câu...';
  const recent = state.translationHistory.slice(-10).map(h=>h.vietnamese);
  let data, aiOk=true, aiError='';
  try{
    data = await AIModule.generateSentence(targetWords, recent);
  }catch(e){
    aiOk=false;
    aiError = e?.message || 'Lỗi không xác định khi gọi AI';
    console.error('Lỗi tạo câu bằng AI:', e);
    data = AIModule.fallbackSentence(targetWords);
  }
  t.current = { vietnamese:data.vietnamese, targetWords: targetWords.map(w=>w.english), hint:data.hint||'', result:null, aiError };
  t.aiOk = aiOk;
  genBtn.disabled=false; genBtn.textContent='✨ Tạo câu mới';
  renderTranslateArea(root);
}

function renderTranslateArea(root){
  const t = state.ui.translateUi;
  const area = root.querySelector('#t-area');
  if(!t.current){ area.innerHTML=''; return; }
  const c = t.current;
  if(!c.result){
    area.innerHTML = `
      ${!t.aiOk? `<div class="banner banner-warn">⚠️ Không thể kết nối AI để tạo câu — đang dùng câu mẫu cơ bản.<br><small style="opacity:.85">Chi tiết: ${escapeHtml(c.aiError || 'Không rõ nguyên nhân')}</small></div>` : ''}
      <div class="sentence-card">
        <div class="sentence-vi">"${escapeHtml(c.vietnamese)}"</div>
        
        <div style="margin-bottom: 16px;">
          <button type="button" class="btn btn-sm btn-ghost t-hint-btn" style="color:var(--ink-soft); font-weight:normal; padding: 4px 8px;">💡 Nhấn để xem từ gợi ý</button>
          <div class="target-chips t-hint-content hidden" style="margin-top:8px;">${c.targetWords.map(w=>`<span class="chip">${escapeHtml(w)}</span>`).join('')}</div>
        </div>

        <div class="field"><label>Bản dịch tiếng Anh của bạn</label><textarea id="t-answer" placeholder="Nhập câu tiếng Anh..." rows="3" spellcheck="false"></textarea></div>
        <button class="btn btn-primary" id="t-submit">Nộp bài</button>
      </div>
    `;
    root.querySelector('#t-submit').addEventListener('click', ()=>submitTranslation(root));
    const hintBtn = root.querySelector('.t-hint-btn');
    if(hintBtn) {
      hintBtn.addEventListener('click', (e)=>{
        e.target.classList.add('hidden');
        root.querySelector('.t-hint-content').classList.remove('hidden');
      });
    }
  } else {
    const r=c.result;
    const scoreColor = r.score>=80?'var(--good)':r.score>=50?'var(--amber)':'var(--bad)';
    const scoreTint = r.score>=80?'var(--good-tint)':r.score>=50?'var(--amber-tint)':'var(--bad-tint)';
    const issueBlock = (title, arr)=> arr && arr.length? `<div style="margin-bottom:10px;"><b style="font-size:12.5px;">${title}</b><ul class="issue-list">${arr.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>` : '';
    area.innerHTML = `
      ${!t.aiOk? `<div class="banner banner-warn">⚠️ Không thể kết nối AI để chấm bài — đây là điểm ước tính cơ bản.</div>` : ''}
      <div class="sentence-card">
        <div style="display:flex;gap:16px;align-items:flex-start;">
          <div class="score-badge" style="background:${scoreTint};color:${scoreColor};">${r.score}</div>
          <div style="flex:1;">
            <div class="sentence-vi" style="font-size:16px;">"${escapeHtml(c.vietnamese)}"</div>
            <p style="font-size:13px;color:var(--ink-soft);margin:0;">${escapeHtml(r.overallFeedback||'')}</p>
          </div>
        </div>
        <div class="result-grid">
          <div class="result-box"><h4>Câu của bạn</h4>${escapeHtml(c.userAnswer)}</div>
          <div class="result-box"><h4>Câu đề xuất</h4>${escapeHtml(r.suggested)}</div>
        </div>
        <div style="margin-top:16px;">
          ${issueBlock('Ngữ pháp', r.grammarIssues)}
          ${issueBlock('Từ vựng', r.vocabIssues)}
          ${issueBlock('Chính tả', r.spellingIssues)}
          ${issueBlock('Từ còn thiếu', r.missingWords)}
          ${issueBlock('Từ thừa', r.extraWords)}
        </div>
        <button class="btn btn-primary" id="t-next">Câu tiếp theo →</button>
      </div>
    `;
    root.querySelector('#t-next').addEventListener('click', ()=>{ t.current=null; generateNewSentence(root); });
  }
}

async function submitTranslation(root){
  const t = state.ui.translateUi;
  const c = t.current;
  const answer = root.querySelector('#t-answer').value.trim();
  if(!answer){ toast('Vui lòng nhập câu trả lời'); return; }
  const btn = root.querySelector('#t-submit');
  btn.disabled=true; btn.textContent='Đang chấm bài...';
  let result, aiOk=true;
  try{
    result = await AIModule.gradeTranslation(c.vietnamese, answer, c.targetWords);
  }catch(e){
    aiOk=false;
    result = AIModule.fallbackGrade(c.vietnamese, answer, c.targetWords);
  }
  c.userAnswer = answer; c.result = result;
  t.aiOk = aiOk;
  state.translationHistory.push({
    id: uid('th'), date:new Date().toISOString(), vietnamese:c.vietnamese, targetWords:c.targetWords,
    userAnswer:answer, score:result.score, suggested:result.suggested
  });
  if(state.translationHistory.length > 2000){
    state.translationHistory =
      state.translationHistory.slice(-2000);
  }
  c.targetWords.forEach(ew=>{
    const w = state.words.find(x=>x.english.toLowerCase()===ew.toLowerCase());
    if(w){
      updateSrs(w, containsWholeWord(answer, ew) && result.score >= 50, 'translate');
    }
  });
  persist();
  renderTranslateArea(root);
}

PAGES.chat = function(){
  const sess = state.ui.chatSession;
  if(sess && sess.phase==='active') return renderChatSession();

};

    <div class="card chat-wrap">
      <div class="field">

          <select id="c-count"><option value="0">0 từ (chỉ dùng từ tự nhập)</option><option value="3">3 từ</option><option value="5" selected>5 từ</option><option value="8">8 từ</option></select>
        </div>
      </div>
      <div class="field"><label>Chọn tình huống</label>

    </div>

    root.querySelector('#c-start').addEventListener('click', ()=>{

      const customLower = new Set(customWords.map(w=>w.toLowerCase()));

function renderChatSession(){
  const sess = state.ui.chatSession;
  const html = `
    <div class="chat-wrap">
      <div class="page-head" style="margin-bottom:12px;">
        <div><h2>${escapeHtml(sess.scenarioLabel)}</h2><p>Nói hoặc gõ chữ để trò chuyện với AI.</p></div>
      </div>
      ${sess.targetWords.length? `<div class="target-chips">${sess.targetWords.map(w=>`<span class="chip">${escapeHtml(w)}</span>`).join('')}</div>` : ''}
      ${!sess.aiOk? `<div class="banner banner-warn">⚠️ Không thể kết nối AI lúc trả lời gần nhất — đang dùng câu trả lời mẫu cơ bản.</div>` : ''}
      <div class="card">
        <div class="chat-log" id="c-log">
          ${sess.transcript.map(m=>`<div class="chat-bubble ${m.role}">${escapeHtml(m.text)}</div>`).join('')}
        </div>
        <div class="chat-input-row">
          ${isSpeechRecognitionSupported()? `<button class="mic-btn" id="c-mic" title="Nhấn để nói">🎤</button>` : ''}
          <textarea id="c-input" rows="1" placeholder="Gõ câu trả lời bằng tiếng Anh, hoặc nhấn micro để nói..."></textarea>
          <button class="btn btn-primary" id="c-send">Gửi</button>
        </div>
      </div>
      <div class="session-actions">
        <button class="btn btn-warm" id="c-end">Kết thúc &amp; Chấm điểm</button>
        <button class="btn btn-ghost" id="c-quit">Thoát (không lưu)</button>
      </div>
    </div>
  `;
  const mount=(root)=>{
    const log = root.querySelector('#c-log');
    log.scrollTop = log.scrollHeight;

    const lastMsg = sess.transcript[sess.transcript.length-1];
    if(!isMobileDevice && lastMsg && lastMsg.role==='ai' && state.settings.autoTTS){
      speak(lastMsg.text);
    }

    const input = root.querySelector('#c-input');
    const sendBtn = root.querySelector('#c-send');
    let sending = false;

    const sendMessage = async (text)=>{
      const msg = (text||'').trim();
      if(!msg || sending) return;
      sending = true;
      sendBtn.disabled = true;
      sess.transcript.push({role:'user', text:msg});
      persist();
      render();
      const rootAfter = document.getElementById('main');
      try{
        const wordObjs = sess.targetWords.map(w=>({english:w, vietnamese:''}));
        wordObjs.forEach(o=>{ const w = state.words.find(x=>x.english.toLowerCase()===o.english.toLowerCase()); if(w) o.vietnamese = w.vietnamese; });
        let reply, aiOk = true;
        try{
          reply = await AIModule.chatReply(sess.scenarioLabel, wordObjs, sess.transcript, msg);
        }catch(e){
          aiOk = false;
          reply = AIModule.fallbackChatReply();
        }
        sess.transcript.push({role:'ai', text:reply});
        sess.aiOk = aiOk;
        persist();
      }finally{
        sending = false;
        render();
      }
    };

    sendBtn.addEventListener('click', ()=>{ const v=input.value; input.value=''; sendMessage(v); });
    input.addEventListener('keydown', e=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); const v=input.value; input.value=''; sendMessage(v); }
    });
    input.focus();

    const micBtn = root.querySelector('#c-mic');
    if(micBtn){
      let recognizer = null;
      micBtn.addEventListener('click', ()=>{
        if(micBtn.classList.contains('listening')){
          recognizer?.stop();
          return;
        }
        recognizer = createSpeechRecognizer({
          onResult:(text)=>{ if(text) sendMessage(text); },
          onError:()=>{ toast('Không nhận diện được giọng nói, thử lại nhé'); },
          onEnd:()=>{ micBtn.classList.remove('listening'); }
        });
        if(!recognizer){ toast('Trình duyệt không hỗ trợ nhận diện giọng nói'); return; }
        micBtn.classList.add('listening');
        recognizer.start();
      });
    }

    root.querySelector('#c-quit').addEventListener('click', ()=>{
      if(confirm('Thoát mà không lưu lại buổi trò chuyện này?')){ state.ui.chatSession=null; render(); }
    });

    root.querySelector('#c-end').addEventListener('click', async ()=>{
      const endBtn = root.querySelector('#c-end');
      endBtn.disabled = true; endBtn.textContent = 'Đang chấm điểm...';
      let result, aiOk = true;
      try{
        result = await AIModule.gradeConversation(sess.scenarioLabel, sess.targetWords, sess.transcript);
      }catch(e){
        aiOk = false;
        result = AIModule.fallbackGradeConversation(sess.targetWords, sess.transcript);
      }
      state.conversationHistory.push({
        id: uid('ch'), date:new Date().toISOString(), scenario:sess.scenarioLabel, targetWords:sess.targetWords,
        transcript: sess.transcript, score:result.score, overallFeedback:result.overallFeedback,
        strengths:result.strengths, improvements:result.improvements, wordsUsed:result.wordsUsed
      });
      if(state.conversationHistory.length > 500){
        state.conversationHistory = state.conversationHistory.slice(-500);
      }
      sess.targetWords.forEach(ew=>{
        const w = state.words.find(x=>x.english.toLowerCase()===ew.toLowerCase());
        if(w){
          const userText = sess.transcript.filter(m=>m.role==='user').map(m=>m.text).join(' ');
          updateSrs(w, containsWholeWord(userText, ew), 'chat');
        }
      });
      sess.phase = 'summary';
      sess.result = result;
      sess.aiOk = aiOk;
      persist();
      render();
    });
  };
  return {html, mount};
}

  return {html, mount};

PAGES.worksheet = function(){
  const sess = state.ui.worksheetSession;
  const activeOk = sess && sess.phase==='active' && Array.isArray(sess.words) && Array.isArray(sess.sentences);
  const resultOk = sess && sess.phase==='result' && sess.results && Array.isArray(sess.results.wordResults) && Array.isArray(sess.results.sentenceResults);
  if(activeOk) return renderWorksheetActive();
  if(resultOk) return renderWorksheetResult();
  if(sess){
    state.ui.worksheetSession = null;
    persist();
  }
  return renderWorksheetSetup();
};

function renderWorksheetSetup(){
  const html = `
    <div class="page-head"><div><h2>Dò bài tổng hợp</h2><p>Tạo một bài kiểm tra bao gồm nhiều từ vựng và câu dịch trên cùng một trang.</p></div></div>
    <div class="card" style="max-width:640px;">
      <div class="field"><label>Nguồn từ vựng</label>
        <select id="ws-source">${sourceOptionsHtml('all')}</select>
      </div>
      <div class="field"><label>Số lượng từ vựng cần dò</label>
        <input type="number" id="ws-count" min="3">
        <div class="hint">Mặc định lấy tất cả từ trong nhóm (Tối đa 50 từ để đảm bảo tốc độ AI)</div>
      </div>
      <button class="btn btn-primary btn-block" id="ws-start" style="margin-top:6px;">Tạo bài kiểm tra</button>
    </div>
  `;
  const mount = (root) => {
    const sourceSelect = root.querySelector('#ws-source');
    const countInput = root.querySelector('#ws-count');

    const updateCount = () => {
      const pool = wordsFromSource(parseSourceValue(sourceSelect.value));
      const suggestedMax = Math.min(Math.max(pool.length, 3), 50); 
      countInput.max = pool.length > 50 ? 50 : pool.length;
      countInput.value = suggestedMax;
    };

    sourceSelect.addEventListener('change', updateCount);
    updateCount();

    root.querySelector('#ws-start').addEventListener('click', async () => {
      const source = parseSourceValue(sourceSelect.value);
      const pool = wordsFromSource(source);
      if(pool.length < 3){ toast('Nguồn này cần ít nhất 3 từ để tạo đề'); return; }
      
      const count = Math.max(3, Math.min(50, parseInt(countInput.value)||10));
      const testWords = shuffleArray(buildQueue(pool, count, true));
      const btn = root.querySelector('#ws-start');
      btn.disabled = true; btn.textContent = 'Đang nhờ AI tạo đề (có thể mất vài giây)...';

      const numSentences = Math.max(2, Math.ceil(count * 0.5));
      let sentData, aiOk = true;
      try{
        sentData = await AIModule.generateWorksheetSentences(testWords, numSentences, state.translationHistory.slice(-10).map(h=>h.vietnamese));
      }catch(e){
        aiOk = false;
        sentData = AIModule.fallbackWorksheetSentences(testWords, numSentences);
      }

      state.ui.worksheetSession = {
        phase: 'active',
        words: testWords.map(w => ({ id: w.id, direction: Math.random() > 0.5 ? 'en2vi' : 'vi2en', english: w.english, vietnamese: w.vietnamese, pos: w.pos, synonyms: w.synonyms })),
        sentences: sentData,
        aiOk: aiOk,
        results: null
      };
      render();
    });
  };
  return {html, mount};
}

    inputs.forEach((input, index) => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'Enter') {
          e.preventDefault();
          if (index + 1 < inputs.length) inputs[index + 1].focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (index - 1 >= 0) inputs[index - 1].focus();
        }
      });
      input.addEventListener('focus', () => {
        const val = input.value;
        if (input.setSelectionRange && typeof val === 'string') {
          try { input.setSelectionRange(val.length, val.length); } catch(e){}
        }
      });
    });
    if (inputs[0]) inputs[0].focus();

    root.querySelectorAll('.ws-hint-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = btn.getAttribute('data-idx');
        root.querySelector(`#ws-hint-${idx}`).classList.remove('hidden');
        btn.classList.add('hidden');
      });
    });

    root.querySelector('#ws-quit').addEventListener('click', () => {
      if(confirm('Bạn có chắc muốn thoát? Kết quả chưa nộp sẽ bị mất.')){ state.ui.worksheetSession = null; render(); }
    });
    
    root.querySelector('#ws-submit').addEventListener('click', async () => {
      const btn = root.querySelector('#ws-submit');
      btn.disabled = true; btn.textContent = 'Đang chấm điểm...';

      let correctWords = 0;
      const wordResults = sess.words.map(w => {
        const input = root.querySelector(`.ws-word-input[data-id="${w.id}"]`).value.trim();
        let isCorrect = false;
        if(w.direction === 'en2vi'){
          isCorrect = answerMatches(input, w.vietnamese.split(/[\/,;]/), true);
        } else {
          isCorrect = answerMatches(input, acceptedEnglishAnswers(w), false);
        }
        if(isCorrect) correctWords++;
        const actualWord = getWord(w.id);
        if(actualWord) updateSrs(actualWord, isCorrect,'worksheet');
        return { ...w, userAnswer: input, isCorrect };
      });

      const sentencesDataToGrade = sess.sentences.map((s, i) => {
        return {
           vietnamese: s.vietnamese,
           userAnswer: root.querySelector(`.ws-sent-input[data-idx="${i}"]`).value.trim(),
           targetWords: s.targetWords
        };
      });

      let batchResults = [];
      try {
        batchResults = await AIModule.gradeMultipleTranslations(sentencesDataToGrade);
      } catch(e) {
        console.warn("Lỗi chấm AI hàng loạt, chuyển sang chấm cơ bản:", e);
        batchResults = sentencesDataToGrade.map(req => AIModule.fallbackGrade(req.vietnamese, req.userAnswer, req.targetWords));
      }

      const sentenceResults = [];
      let totalSentScore = 0;

      for (let i = 0; i < sess.sentences.length; i++) {
        const s = sess.sentences[i];
        const sentAns = sentencesDataToGrade[i].userAnswer;
        const sRes = batchResults[i] || AIModule.fallbackGrade(s.vietnamese, sentAns, s.targetWords);

        totalSentScore += sRes.score;
        state.translationHistory.push({
          id: uid('th'), date:new Date().toISOString(), vietnamese:s.vietnamese, targetWords:s.targetWords, userAnswer:sentAns, score:sRes.score, suggested:sRes.suggested
        });
        s.targetWords.forEach(ew=>{
          const word = state.words.find(x=>x.english.toLowerCase()===String(ew).toLowerCase());
          if(word) updateSrs(word, containsWholeWord(sentAns, ew) && sRes.score >= 50, 'worksheet-translate');
        });
        if(state.translationHistory.length > 2000){
          state.translationHistory =
            state.translationHistory.slice(-2000);
        }
        sentenceResults.push({ original: s, ans: sentAns, result: sRes });
      }

      const avgSentScore = sess.sentences.length ? Math.round(totalSentScore / sess.sentences.length) : 0;
      sess.results = { wordResults, correctWords, totalWords: sess.words.length, sentenceResults, avgSentScore };
      sess.phase = 'result';
      persist();
      render();
    });
  };
  return {html, mount};
}

function renderWorksheetResult(){
  const sess = state.ui.worksheetSession;
  const r = sess.results;
  const issueBlock = (title, arr)=> arr && arr.length? `<div style="margin-bottom:6px;"><b style="font-size:12.5px;">${title}</b><ul class="issue-list" style="margin-top:2px;">${arr.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>` : '';

  const wordScore = r.totalWords ? Math.round((r.correctWords / r.totalWords) * 100) : 0;
  const finalScore = Math.round((wordScore + r.avgSentScore) / 2);
  
  let feedbackMsg = "";
  if (finalScore >= 85) feedbackMsg = "🎉 Xuất sắc! Bạn nắm từ vựng và cấu trúc ngữ pháp rất vững. Cứ giữ vững phong độ này nhé!";
  else if (finalScore >= 70) feedbackMsg = "👍 Rất tốt! Bạn đã hiểu bài, chỉ cần chú ý vài chi tiết nhỏ để dịch mượt mà hơn.";
  else if (finalScore >= 50) feedbackMsg = "💪 Khá ổn! Bạn thuộc từ nhưng cần luyện thêm cách sắp xếp câu và ngữ pháp phức tạp.";
  else feedbackMsg = "📚 Bạn cần cố gắng hơn. Đừng nản, hãy ôn lại Flashcard và xem kỹ phần sửa lỗi bên dưới nhé!";

  let html = `<div class="page-head"><div><h2>Kết quả Dò bài</h2></div></div>`;
  html += `<div class="card" style="max-width:760px; margin: 0 auto;">`;
  
  html += `
    <div style="text-align:center; padding: 24px 20px; background: #FCFCFA; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 24px;">
      <div class="score-badge" style="margin:0 auto 12px; width: 72px; height: 72px; font-size: 24px; background: ${finalScore >= 80 ? 'var(--good-tint)' : finalScore >= 50 ? 'var(--amber-tint)' : 'var(--bad-tint)'}; color: ${finalScore >= 80 ? 'var(--good)' : finalScore >= 50 ? 'var(--amber)' : 'var(--bad)'};">${finalScore}</div>
      <h3 style="margin-bottom:8px; font-size:18px;">Nhận xét tổng quan</h3>
      <p style="color:var(--ink-soft); font-size:14.5px; margin:0; line-height: 1.6;">${feedbackMsg}</p>
    </div>
  `;

  html += `<h3 style="margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:8px;">I. Từ vựng (Đúng ${r.correctWords}/${r.totalWords} - ${wordScore} điểm)</h3>`;
  r.wordResults.forEach((w, i) => {
    const promptText = w.direction === 'en2vi' ? w.english : w.vietnamese;
    const correctAns = w.direction === 'en2vi' ? w.vietnamese : w.english;
    html += `
      <div style="margin-bottom:12px; padding:10px; border-radius:var(--radius-sm); background:${w.isCorrect ? 'var(--good-tint)' : 'var(--bad-tint)'}; border:1px solid ${w.isCorrect ? 'var(--good)' : 'var(--bad)'}">
        <div style="font-weight:600; margin-bottom:4px;">${i+1}. ${escapeHtml(promptText.normalize('NFC'))}</div>
        <div style="font-size:13.5px;">
          <span style="color:var(--ink-soft)">Bạn điền:</span> <b>${escapeHtml(w.userAnswer || '(trống)')}</b>
          ${!w.isCorrect ? `<br><span style="color:var(--bad)">Đáp án đúng:</span> <b>${escapeHtml(correctAns)}</b>` : ''}
        </div>
      </div>
    `;
  });

  html += `<h3 style="margin-top:30px; margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:8px;">II. Dịch câu (Điểm trung bình: ${r.avgSentScore}/100)</h3>`;
  
  r.sentenceResults.forEach((sr, idx) => {
    const sRes = sr.result;
    const scoreColor = sRes.score >= 80 ? 'var(--good)' : sRes.score >= 50 ? 'var(--amber)' : 'var(--bad)';
    const scoreTint = sRes.score >= 80 ? 'var(--good-tint)' : sRes.score >= 50 ? 'var(--amber-tint)' : 'var(--bad-tint)';
    
    html += `
      <div style="margin-bottom: 24px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: #FCFCFA;">
        <div style="display:flex; gap:16px; align-items:flex-start; margin-bottom:16px;">
          <div class="score-badge" style="background:${scoreTint}; color:${scoreColor};">${sRes.score}</div>
          <div style="flex:1;">
            <div class="sentence-vi" style="font-size:16px; margin-bottom:8px;">${idx+1}. "${escapeHtml(sr.original.vietnamese)}"</div>
            <p style="font-size:13.5px; color:var(--ink); margin:0;">${escapeHtml(sRes.overallFeedback || '')}</p>
          </div>
        </div>
        <div class="result-grid">
          <div class="result-box"><h4>Câu của bạn</h4>${escapeHtml(sr.ans || '(trống)')}</div>
          <div class="result-box"><h4>Câu đề xuất</h4>${escapeHtml(sRes.suggested)}</div>
        </div>
        <div style="margin-top:16px;">
          ${issueBlock('Ngữ pháp', sRes.grammarIssues)}
          ${issueBlock('Từ vựng', sRes.vocabIssues)}

        </div>

    `;
  });

  html += `<div style="display:flex; gap:10px; justify-content:center; margin-top:30px;">
    <button class="btn btn-primary" id="ws-finish">Về trang chính</button>
    <button class="btn" id="ws-retry">Tạo bài mới</button>
  </div>`;
  html += `</div>`;

  const mount = (root) => {
    root.querySelector('#ws-finish').addEventListener('click', () => { state.ui.worksheetSession = null; navigate('dashboard'); });
    root.querySelector('#ws-retry').addEventListener('click', () => { state.ui.worksheetSession = null; render(); });
  };
  return {html, mount};
}

/* =========================================================================

   ========================================================================= */
PAGES.flashcard = function(){
  const sess = state.ui.flashSession;
  if(sess) return renderFlashSession();
  return renderFlashSetup();
};

function renderFlashSetup(){
  const html = `
    <div class="page-head"><div><h2>Flashcard</h2><p>Lật thẻ để ôn nhanh nghĩa của từ.</p></div></div>
    <div class="card" style="max-width:520px;">
      <div class="field"><label>Nguồn từ vựng</label><select id="f-source">${sourceOptionsHtml('all')}</select></div>
      <div class="field"><label>Số lượng thẻ</label><input type="number" id="f-count" min="1" max="100" value="15"></div>
      <div class="field"><label>Mặt trước thẻ</label>
        <select id="f-side"><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
      </div>
      <button class="btn btn-primary btn-block" id="f-start">Bắt đầu</button>
    </div>
  `;
  const mount=(root)=>{
    root.querySelector('#f-start').addEventListener('click', ()=>{
      const source = parseSourceValue(root.querySelector('#f-source').value);
      const pool = wordsFromSource(source);
      if(pool.length===0){ toast('Nguồn từ vựng này chưa có từ nào'); return; }
      const count = Math.max(1, Math.min(100, parseInt(root.querySelector('#f-count').value)||15));
      const side = root.querySelector('#f-side').value;
      const cards = buildQueue(pool, count, true);
      state.ui.flashSession = { cards, index:0, flipped:false, side, done:0, remembered:0 };
      render();
    });
  };
  return {html, mount};
}

function renderFlashSession(){
  const sess = state.ui.flashSession;
  const word = getWord(sess.cards[sess.index]?.id ? sess.cards[sess.index].id : sess.cards[sess.index]);
  if(!word || sess.index>=sess.cards.length){
    const html = `
      <div class="flash-wrap">
        <div class="card" style="text-align:center;padding:30px;">
          <h2>Đã ôn xong ${sess.cards.length} thẻ</h2>
          <p style="color:var(--ink-soft);">Đã nhớ ${sess.remembered}/${sess.cards.length} từ</p>
          <button class="btn btn-primary" id="f-done" style="margin-top:14px;">Về Tổng quan</button>
        </div>
      </div>`;
    return {html, mount:(root)=>root.querySelector('#f-done').addEventListener('click', ()=>{ state.ui.flashSession=null; navigate('dashboard'); })};
  }
  const front = sess.side==='en' ? word.english : word.vietnamese;
  const html = `
    <div class="flash-wrap">
      <div class="hint" style="text-align:center;margin-bottom:10px;">Thẻ ${sess.index+1}/${sess.cards.length}</div>
      <div class="flash-scene">
        <div class="flash-card ${sess.flipped?'is-flipped':''}" id="f-card">
          <div class="flash-face flash-front">
            <span class="side-lbl">Mặt trước</span>
            <div class="q-prompt">${escapeHtml(front)}</div>
            ${sess.side==='en'&&word.pronunciation?`<div class="q-sub">${escapeHtml(word.pronunciation)}</div>`:''}
          </div>
          <div class="flash-face flash-back">
            <span class="side-lbl">Mặt sau</span>
            <div class="fb-word">${escapeHtml(word.english)}${word.pronunciation?' · '+escapeHtml(word.pronunciation):''}</div>
            <div class="fb-vi">${escapeHtml(word.vietnamese)} ${word.pos?`<span class="hint">(${escapeHtml(word.pos)})</span>`:''}</div>
            ${word.synonyms?`<div class="hint" style="margin-bottom:6px;">≈ ${escapeHtml(word.synonyms)}</div>`:''}
            ${word.example?`<div class="fb-ex">"${escapeHtml(word.example)}"</div>`:''}
          </div>
        </div>
      </div>
      <p class="hint" style="text-align:center;margin-top:8px;">Nhấn vào thẻ để lật</p>
      <div class="mark-row">
        <button class="btn btn-danger" id="f-no">✗ Chưa nhớ</button>
        <button class="btn" id="f-speak">🔊 Nghe</button>
        <button class="btn" style="background:var(--good-tint);color:var(--good);border-color:var(--good-tint)" id="f-yes">✓ Đã nhớ</button>
      </div>
    </div>
  `;
  const mount=(root)=>{
    const cardEl = root.querySelector('#f-card');
    cardEl.addEventListener('click', ()=>{
      sess.flipped = !sess.flipped;
      cardEl.classList.toggle('is-flipped', sess.flipped);
    });
    root.querySelector('#f-speak').addEventListener('click', (e)=>{ e.stopPropagation(); speak(word.english); });
    const advance=(remembered)=>{
      updateSrs(word, remembered,'flashcard');
      sess.done++; if(remembered) sess.remembered++;
      sess.index++; sess.flipped=false;
      persist(); render();
    };
    root.querySelector('#f-no').addEventListener('click', (e)=>{ e.stopPropagation(); advance(false); });
    root.querySelector('#f-yes').addEventListener('click', (e)=>{ e.stopPropagation(); advance(true); });
  };
  return {html, mount};
}

PAGES.history = function(){
  const tab = state.ui.historyTab || 'practice';
  const html = `
    <div class="page-head"><div><h2>Lịch sử học tập</h2><p>Xem lại các phiên luyện tập, câu dịch, hội thoại và tiến độ từng từ.</p></div></div>
    <div class="tab-row">
      <button class="tab-btn ${tab==='practice'?'active':''}" data-tab="practice">Luyện từ vựng</button>
      <button class="tab-btn ${tab==='translate'?'active':''}" data-tab="translate">Dịch câu</button>
      <button class="tab-btn ${tab==='chat'?'active':''}" data-tab="chat">Trò chuyện AI</button>
      <button class="tab-btn ${tab==='words'?'active':''}" data-tab="words">Theo từ</button>
    </div>
    <div id="hist-body"></div>
  `;
  const mount=(root)=>{
    const body = root.querySelector('#hist-body');
    function draw(){
      if(tab==='practice') body.innerHTML = historyPracticeHtml();
      else if(tab==='translate') body.innerHTML = historyTranslateHtml();
      else if(tab==='chat') body.innerHTML = historyChatHtml();
      else body.innerHTML = historyWordsHtml();
      if(tab==='translate') bindHistoryTranslate(body);
      if(tab==='chat') bindHistoryChat(body);
      if(tab==='words') bindHistoryWords(body);

    root.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{
      state.ui.historyTab=b.getAttribute('data-tab'); render();
    }));
    draw();
  };
  return {html, mount};
};

  const sessions = [...state.practiceSessions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!sessions.length) return `<div class="empty-state card"><h3>Chưa có phiên luyện tập nào</h3></div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Dạng bài</th><th>Tổng câu</th><th>Đúng</th><th>Tỷ lệ</th></tr></thead><tbody>
    ${sessions.map(s=>`<tr><td>${fmtDate(s.date)}</td><td>${escapeHtml((s.modes||[]).map(m=>PRACTICE_MODES.find(x=>x.id===m)?.label||m).join(', '))}</td><td>${s.total}</td><td>${s.correct}</td><td>${s.total?Math.round(s.correct/s.total*100):0}%</td></tr>`).join('')}
  </tbody></table></div>`;
}
function historyTranslateHtml(){
  const items = [...state.translationHistory].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!items.length) return `<div class="empty-state card"><h3>Chưa có câu dịch nào</h3></div>`;

      `);
      document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));

}
function historyChatHtml(){
  const items = [...(state.conversationHistory||[])].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!items.length) return `<div class="empty-state card"><h3>Chưa có buổi trò chuyện nào</h3></div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Tình huống</th><th>Điểm</th><th></th></tr></thead><tbody>
    ${items.map(c=>`<tr data-ch="${c.id}"><td style="white-space:nowrap;">${fmtDate(c.date)}</td><td>${escapeHtml(c.scenario)}</td><td>${c.score}</td><td><button class="btn btn-sm btn-ghost" data-act="view-ch">Xem</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
function bindHistoryChat(body){
  body.querySelectorAll('[data-ch]').forEach(row=>{
    row.querySelector('[data-act="view-ch"]').addEventListener('click', ()=>{
      const c = (state.conversationHistory||[]).find(x=>x.id===row.getAttribute('data-ch'));
      if(!c) return;
      openModal(`
        <div class="modal-head"><h3>${escapeHtml(c.scenario)}</h3><button class="modal-close" data-close>&times;</button></div>
        <p><b>Điểm:</b> ${c.score}</p>
        <p>${escapeHtml(c.overallFeedback||'')}</p>
        <div class="chat-log" style="max-height:40vh;">
          ${(c.transcript||[]).map(m=>`<div class="chat-bubble ${m.role}">${escapeHtml(m.text)}</div>`).join('')}
        </div>
        <div class="modal-actions"><button class="btn" data-close>Đóng</button></div>
      `, true);
      document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
    });
  });
}
function historyWordsHtml(){
  const sortKey = state.ui.wordsSortKey || 'wrong';
  let words = [...state.words];
  words.sort((a,b)=>{
    const sa=ensureSrs(a), sb=ensureSrs(b);
    if(sortKey==='wrong') return sb.wrong - sa.wrong;
    if(sortKey==='accuracy'){
      const ra = (sa.correct+sa.wrong)? sa.correct/(sa.correct+sa.wrong):0;
      const rb = (sb.correct+sb.wrong)? sb.correct/(sb.correct+sb.wrong):0;
      return ra-rb;
    }
    if(sortKey==='next') return new Date(sa.nextReview)-new Date(sb.nextReview);
    return 0;
  });
  if(!words.length) return `<div class="empty-state card"><h3>Chưa có từ nào</h3></div>`;
  return `
    <div class="toolbar"><select id="words-sort">
      <option value="wrong" ${sortKey==='wrong'?'selected':''}>Sắp xếp: Số lần sai nhiều nhất</option>
      <option value="accuracy" ${sortKey==='accuracy'?'selected':''}>Sắp xếp: Tỷ lệ đúng thấp nhất</option>
      <option value="next" ${sortKey==='next'?'selected':''}>Sắp xếp: Ngày ôn tiếp theo</option>
    </select></div>
    <div class="table-wrap"><table><thead><tr><th>English</th><th>Nghĩa</th><th>Đúng</th><th>Sai</th><th>Tỷ lệ</th><th>Ôn gần nhất</th><th>Ôn tiếp theo</th></tr></thead><tbody>
    ${words.map(w=>{
      const s=ensureSrs(w); const total=s.correct+s.wrong;
      const rate = total? Math.round(s.correct/total*100) : 0;
      return `<tr><td><b>${escapeHtml(w.english)}</b></td><td>${escapeHtml(w.vietnamese)}</td><td>${s.correct}</td><td>${s.wrong}</td><td>${rate}%</td><td>${s.lastReviewed?fmtDateShort(s.lastReviewed):'—'}</td><td>${fmtDateShort(s.nextReview)}</td></tr>`;
    }).join('')}
    </tbody></table></div>
  `;
}
function bindHistoryWords(body){
  const sel = body.querySelector('#words-sort');
  if(sel) sel.addEventListener('change', ()=>{ state.ui.wordsSortKey = sel.value; render(); });
}

/* =========================================================================
   PAGE: SETTINGS
   ========================================================================= */
PAGES.settings = function(){
  const html = `
    <div class="page-head"><div><h2>Cài đặt</h2><p>Tuỳ chỉnh mục tiêu học tập và quản lý dữ liệu.</p></div></div>

    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <h3 style="font-size:15px;margin-bottom:14px;">Mục tiêu học tập</h3>
        <div class="field"><label>Số từ luyện mỗi ngày</label><input type="number" id="s-goal" min="1" max="500" value="${state.settings.dailyGoal}"></div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:10px;">
          <input type="checkbox" id="s-tts" ${state.settings.autoTTS?'checked':''} style="width:auto;"> Tự động phát âm khi luyện "Nghe → đoán nghĩa"
        </label>
        <button class="btn btn-primary" id="s-save">Lưu cài đặt</button>
      </div>

      <div class="card">
        <h3 style="font-size:15px;margin-bottom:14px;">Dữ liệu</h3>
        <p class="hint" style="margin-top:0;">Dữ liệu được lưu tự động trên trình duyệt của bạn.</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button class="btn" id="s-export-csv">Xuất toàn bộ từ vựng (CSV)</button>
          <button class="btn" id="s-import-csv">Nhập từ vựng (CSV)</button>
          <button class="btn" id="s-backup">Sao lưu toàn bộ dữ liệu (.json)</button>
          <label class="btn" style="text-align:center;">Khôi phục từ file sao lưu<input type="file" id="s-restore" accept=".json" style="display:none;"></label>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3 style="font-size:15px;margin-bottom:4px;">Module AI — Tự động chuyển đổi Model</h3>
      <p class="hint" style="margin-top:0;">Hệ thống sẽ dùng Model bạn chọn dưới đây. Nếu model đó bị cạn hạn mức (Quota limit), hệ thống sẽ TỰ ĐỘNG mượn các model khác để bạn tiếp tục học không bị gián đoạn.</p>
      <div class="field-row">
        <div class="field"><label>Google API Key</label><input type="password" id="s-gkey" value="${escapeHtml(state.settings.googleApiKey||'')}" placeholder="Dán API Key từ Google AI Studio"></div>
        <div class="field"><label>Model Ưu tiên</label>
          <select id="s-gmodel">
            <option value="gemini-3.5-flash-lite" ${state.settings.googleModel==='gemini-3.5-flash-lite'?'selected':''}>Gemini 3.5 Flash Lite (500 lượt/ngày - Khuyên dùng)</option>
            <option value="gemini-3.1-flash-lite" ${state.settings.googleModel==='gemini-3.1-flash-lite'?'selected':''}>Gemini 3.1 Flash Lite (Dự phòng)</option>
            <option value="gemini-1.5-flash-8b" ${state.settings.googleModel==='gemini-1.5-flash-8b'?'selected':''}>Gemini 1.5 Flash-8B (Tốc độ cao)</option>
            <option value="gemini-1.5-flash" ${state.settings.googleModel==='gemini-1.5-flash'?'selected':''}>Gemini 1.5 Flash (Dễ bị khoá hạn mức)</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-primary" id="s-gsave">Lưu cấu hình AI</button>
        <button class="btn" id="s-gtest">Kiểm tra kết nối</button>
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" class="hint">Lấy API Key miễn phí tại Google AI Studio ↗</a>
      </div>
      <div id="s-gtest-result" class="hint" style="margin-top:8px;"></div>
    </div>

    <div class="card" style="margin-top:16px;border-color:var(--bad);">
      <h3 style="font-size:15px;margin-bottom:8px;color:var(--bad);">Vùng nguy hiểm</h3>
      <p class="hint" style="margin-top:0;">Xoá toàn bộ notebook, từ vựng và lịch sử học tập. Hành động này không thể hoàn tác.</p>
      <button class="btn btn-danger" id="s-reset">Xoá toàn bộ dữ liệu</button>
    </div>
  `;
  const mount=(root)=>{
    root.querySelector('#s-save').addEventListener('click', ()=>{
      state.settings.dailyGoal = Math.max(1, parseInt(root.querySelector('#s-goal').value)||20);
      state.settings.autoTTS = root.querySelector('#s-tts').checked;
      persist(); toast('Đã lưu cài đặt');
    });
    root.querySelector('#s-gsave').addEventListener('click', ()=>{
      AIModule.setApiKey(root.querySelector('#s-gkey').value.trim());
      state.settings.googleModel = root.querySelector('#s-gmodel').value;
      persist(); toast('Đã lưu cấu hình AI');
    });
    root.querySelector('#s-gtest').addEventListener('click', async ()=>{
      const resEl = root.querySelector('#s-gtest-result');
      AIModule.setApiKey(root.querySelector('#s-gkey').value.trim());
      state.settings.googleModel = root.querySelector('#s-gmodel').value;
      resEl.textContent='Đang kiểm tra...'; resEl.style.color='var(--ink-soft)';
      try{
        await AIModule.testConnection();
        resEl.textContent='✓ Kết nối thành công! Đang dùng Model: ' + state.settings.googleModel; resEl.style.color='var(--good)';
        persist();
      }catch(e){
        resEl.textContent='✗ Kết nối thất bại: '+e.message; resEl.style.color='var(--bad)';
      }
    });
    root.querySelector('#s-export-csv').addEventListener('click', ()=>exportWordsCSV(allWords(), 'tat-ca-tu-vung'));
    root.querySelector('#s-import-csv').addEventListener('click', openImportForm);
    root.querySelector('#s-backup').addEventListener('click', ()=>{
      const backup = JSON.parse(JSON.stringify(state));
      if(backup.settings) backup.settings.googleApiKey = '';
      backup.ui = { page:'dashboard' };
      downloadTextFile(`so-tu-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(backup, null, 2), 'application/json');
      toast('Đã tải file sao lưu (không chứa API Key)');
    });
    root.querySelector('#s-restore').addEventListener('change', (e)=>{
      const file=e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload=()=>{
        try{
          const data = JSON.parse(reader.result);
           if(!validateStateShape(data)) throw new Error('invalid');
           const mode = confirm('Nhấn OK để GHI ĐÈ toàn bộ dữ liệu hiện tại bằng file sao lưu.\nNhấn Huỷ để GỘP THÊM dữ liệu từ file vào dữ liệu hiện tại.') ? 'replace' : 'merge';
           if(mode==='replace'){
             state = migrateState(data);
             state.ui.practiceSession = null;
             state.ui.worksheetSession = null;
             state.ui.flashSession = null;
             state.ui.chatSession = null;
           } else {
            data.notebooks.forEach(nb=>{ if(!getNotebook(nb.id)) state.notebooks.push(nb); });
            data.words.forEach(w=>{ if(!getWord(w.id)) state.words.push(w); });
            (data.mergedSets||[]).forEach(m=>{ if(!state.mergedSets.find(x=>x.id===m.id)) state.mergedSets.push(m); });
            (data.translationHistory||[]).forEach(t=>state.translationHistory.push(t));
            (data.practiceSessions||[]).forEach(p=>state.practiceSessions.push(p));
            (data.conversationHistory||[]).forEach(c=>state.conversationHistory.push(c));
            state.translationHistory = state.translationHistory.slice(-2000);
            state.practiceSessions = state.practiceSessions.slice(-1000);
            state.conversationHistory = state.conversationHistory.slice(-500);
          }
          state.words.forEach(w=>ensureSrs(w));
          persist(); toast('Đã khôi phục dữ liệu'); render();
        }catch(err){ toast('File sao lưu không hợp lệ'); }
      };
      reader.readAsText(file, 'UTF-8');
    });
    root.querySelector('#s-reset').addEventListener('click', ()=>{
      if(confirm('Bạn có chắc muốn xoá TOÀN BỘ dữ liệu? Hành động này không thể hoàn tác.')){
        if(confirm('Xác nhận lần cuối: xoá hết notebook, từ vựng và lịch sử?')){
          state = { version:2, notebooks:[], words:[], mergedSets:[], translationHistory:[], practiceSessions:[], conversationHistory:[], settings:{dailyGoal:20, autoTTS:true, googleApiKey:'', googleModel:'gemini-3.5-flash-lite'}, ui:{page:'notebooks', worksheetSession:null, practiceSession:null, flashSession:null, chatSession:null} };
          persist(); toast('Đã xoá toàn bộ dữ liệu'); render();
        }
      }
    });
  };
  return {html, mount};
};

/* =========================================================================
   INIT
   ========================================================================= */
(function main(){
  showLoading();
  initAuthScreen();
  initApiKeyScreen();

  fbAuth.onAuthStateChanged(async (user)=>{
    if(user){
      currentUser = user;

      await initState();
      if(state.settings.googleApiKey){
        showAppScreen();
        render();
      } else {
        showApiKeyScreen();
      }

      const cloudState = await cloudLoad(user.uid);
      if(cloudState){
        applyingRemoteUpdate = true;
        state = migrateState(cloudState);
        await storageSet(state);
        applyingRemoteUpdate = false;
        if(state.settings.googleApiKey){
          showAppScreen();
          render();
        } else {
          showApiKeyScreen();
        }
      } else {
        await cloudSave(user.uid, state);
      }

      subscribeCloud(user.uid);
    } else {
      currentUser = null;
      if(cloudUnsub){ cloudUnsub(); cloudUnsub = null; }
      document.getElementById('auth-email').value = '';
      document.getElementById('auth-password').value = '';
      document.getElementById('apikey-input').value = '';
      authErr(null);
      apikeyErr(null);
      showAuthScreen();
    }
  });
})();

</script>
</body>
</html>
