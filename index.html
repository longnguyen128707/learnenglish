  `;
  const mount=(root)=>{
    root.querySelector('#c-back').addEventListener('click', ()=>{ state.ui.chatSession=null; navigate('dashboard'); });
    root.querySelector('#c-again').addEventListener('click', ()=>{ state.ui.chatSession=null; render(); });
  };
  return {html, mount};
}

/* =========================================================================
   PAGE: WORKSHEET (Dò bài tổng hợp)
   ========================================================================= */
PAGES.worksheet = function(){
  const sess = state.ui.worksheetSession;
  const activeOk = sess && sess.phase==='active' && Array.isArray(sess.words) && Array.isArray(sess.sentences);
  const resultOk = sess && sess.phase==='result' && sess.results && Array.isArray(sess.results.wordResults) && Array.isArray(sess.results.sentenceResults);
  if(activeOk) return renderWorksheetActive();
  if(resultOk) return renderWorksheetResult();
  if(sess){
    state.ui.worksheetSession = null;
    persist();
  }
  return renderWorksheetSetup();
};

function renderWorksheetSetup(){
  const html = `
    <div class="page-head"><div><h2>Dò bài tổng hợp</h2><p>Tạo một bài kiểm tra bao gồm nhiều từ vựng và câu dịch trên cùng một trang.</p></div></div>
    <div class="card" style="max-width:640px;">
      <div class="field"><label>Nguồn từ vựng</label>
        <select id="ws-source">${sourceOptionsHtml('all')}</select>
      </div>
      <div class="field"><label>Số lượng từ vựng cần dò</label>
        <input type="number" id="ws-count" min="3">
        <div class="hint">Mặc định lấy tất cả từ trong nhóm (Tối đa 50 từ để đảm bảo tốc độ AI)</div>
      </div>
      <button class="btn btn-primary btn-block" id="ws-start" style="margin-top:6px;">Tạo bài kiểm tra</button>
    </div>
  `;
  const mount = (root) => {
    const sourceSelect = root.querySelector('#ws-source');
    const countInput = root.querySelector('#ws-count');

    const updateCount = () => {
      const pool = wordsFromSource(parseSourceValue(sourceSelect.value));
      const suggestedMax = Math.min(Math.max(pool.length, 3), 50); 
      countInput.max = pool.length > 50 ? 50 : pool.length;
      countInput.value = suggestedMax;
    };

    sourceSelect.addEventListener('change', updateCount);
    updateCount();

    root.querySelector('#ws-start').addEventListener('click', async () => {
      const source = parseSourceValue(sourceSelect.value);
      const pool = wordsFromSource(source);
      if(pool.length < 3){ toast('Nguồn này cần ít nhất 3 từ để tạo đề'); return; }
      
      const count = Math.max(3, Math.min(50, parseInt(countInput.value)||10));
      const recentTargets=state.translationHistory.slice(-20).flatMap(h=>Array.isArray(h.targetWords)?h.targetWords:[]);
      const testWords = shuffleArray(buildDiverseQueue(pool, count, recentTargets, true));
      const btn = root.querySelector('#ws-start');
      btn.disabled = true; btn.textContent = 'Đang nhờ AI tạo đề (có thể mất vài giây)...';

      const numSentences = Math.max(2, Math.ceil(count * 0.5));
      let sentData, aiOk = true;
      try{
        sentData = await AIModule.generateWorksheetSentences(testWords, numSentences, state.translationHistory.slice(-10).map(h=>h.vietnamese));
      }catch(e){
        aiOk = false;
        sentData = AIModule.fallbackWorksheetSentences(testWords, numSentences);
      }

      state.ui.worksheetSession = {
        phase: 'active',
        words: testWords.map(w => ({ id: w.id, direction: Math.random() > 0.5 ? 'en2vi' : 'vi2en', english: w.english, vietnamese: w.vietnamese, pos: w.pos, synonyms: w.synonyms })),
        sentences: sentData,
        aiOk: aiOk,
        results: null
      };
      render();
    });
  };
  return {html, mount};
}
function renderWorksheetActive(){
  const sess = state.ui.worksheetSession;
  let html = `<div class="page-head"><div><h2>Bài kiểm tra</h2><p>Điền đáp án (Dùng phím Mũi tên hoặc Enter để nhảy ô) và nộp bài.</p></div></div>`;
  html += `<div class="card" style="max-width:760px; margin: 0 auto;">`;
  
  html += `<h3 style="margin-bottom:8px; border-bottom:1px solid var(--line); padding-bottom:8px;">I. Từ vựng (${sess.words.length} từ)</h3>
  <div class="hint" style="margin-bottom:16px;">Mỗi dòng sẽ ngẫu nhiên hỏi Anh → Việt hoặc Việt → Anh.</div>`;
  sess.words.forEach((w, i) => {
    const promptText = w.direction === 'en2vi' ? w.english : w.vietnamese;
    const placeholder = w.direction === 'en2vi' ? 'Nhập nghĩa tiếng Việt...' : 'Nhập từ tiếng Anh...';
    html += `
      <div class="field-row" style="align-items:center; margin-bottom:14px; gap:20px;">
        <div style="flex: 0 0 45%; font-weight:600; font-size:15px;">${i+1}. ${escapeHtml(promptText.normalize('NFC'))} ${w.pos?`<span style="font-weight:400; color:var(--ink-faint); font-size:12px;">(${escapeHtml(w.pos)})</span>`:''}</div>
        <div style="flex: 1;"><input type="text" class="ws-word-input" data-id="${w.id}" placeholder="${placeholder}" style="margin:0;" spellcheck="false"></div>
      </div>
    `;
  });

  html += `<h3 style="margin-top:30px; margin-bottom:16px; border-bottom:1px solid var(--line); padding-bottom:8px;">II. Dịch câu (${sess.sentences.length} câu)</h3>`;
  if(!sess.aiOk) html += `<div class="banner banner-warn" style="margin-bottom:10px;">⚠️ Không thể kết nối AI, hệ thống sẽ sử dụng câu mẫu cơ bản.</div>`;
  
  sess.sentences.forEach((s, idx) => {
    html += `
      <div style="margin-bottom: 24px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: #FCFCFA;">
        <div style="font-family:var(--font-serif); font-size:18px; margin-bottom:8px;">${idx+1}. "${escapeHtml(s.vietnamese)}"</div>
        
        <div style="margin-bottom: 12px;">
          <button type="button" class="btn btn-sm btn-ghost ws-hint-btn" data-idx="${idx}" style="color:var(--ink-soft); font-weight:normal; padding: 4px 8px;">💡 Nhấn để xem từ gợi ý</button>
          <div class="target-chips ws-hint-content hidden" id="ws-hint-${idx}" style="margin-top:8px;">${s.targetWords.map(w=>`<span class="chip">${escapeHtml(w)}</span>`).join('')}</div>
        </div>

        <textarea class="ws-sent-input" data-idx="${idx}" rows="2" placeholder="Viết bản dịch tiếng Anh..." spellcheck="false"></textarea>
      </div>
    `;
  });
  
  html += `<button class="btn btn-primary btn-block" id="ws-submit" style="margin-top:24px; padding:12px; font-size:15px;">Nộp bài</button>`;
  html += `<div style="text-align:center; margin-top:10px;"><button class="btn btn-ghost btn-sm" id="ws-quit">Thoát</button></div>`;
  html += `</div>`;

  const mount = (root) => {
    const inputs = Array.from(root.querySelectorAll('.ws-word-input, .ws-sent-input'));
    inputs.forEach((input, index) => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'Enter') {
          e.preventDefault();
          if (index + 1 < inputs.length) inputs[index + 1].focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (index - 1 >= 0) inputs[index - 1].focus();
        }
      });
      input.addEventListener('focus', () => {
        const val = input.value;
        if (input.setSelectionRange && typeof val === 'string') {
          try { input.setSelectionRange(val.length, val.length); } catch(e){}
        }
      });
    });
    if (inputs[0]) inputs[0].focus();

    root.querySelectorAll('.ws-hint-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = btn.getAttribute('data-idx');
        root.querySelector(`#ws-hint-${idx}`).classList.remove('hidden');
        btn.classList.add('hidden');
      });
    });

    root.querySelector('#ws-quit').addEventListener('click', () => {
      if(confirm('Bạn có chắc muốn thoát? Kết quả chưa nộp sẽ bị mất.')){ state.ui.worksheetSession = null; render(); }
    });
    
    root.querySelector('#ws-submit').addEventListener('click', async () => {
      const btn = root.querySelector('#ws-submit');
      btn.disabled = true; btn.textContent = 'Đang chấm điểm...';

      let correctWords = 0;
      const wordResults = sess.words.map(w => {
        const input = root.querySelector(`.ws-word-input[data-id="${w.id}"]`).value.trim();
        let isCorrect = false;
        if(w.direction === 'en2vi'){
          isCorrect = answerMatches(input, w.vietnamese.split(/[\/,;]/), true);
        } else {
          isCorrect = answerMatches(input, acceptedEnglishAnswers(w), false);
        }
        if(isCorrect) correctWords++;
        const actualWord = getWord(w.id);
        if(actualWord) updateSrs(actualWord, isCorrect,'worksheet');
        return { ...w, userAnswer: input, isCorrect };
      });

      const sentencesDataToGrade = sess.sentences.map((s, i) => {
        return {
           vietnamese: s.vietnamese,
           userAnswer: root.querySelector(`.ws-sent-input[data-idx="${i}"]`).value.trim(),
           targetWords: s.targetWords
        };
      });

      let batchResults = [];
      try {
        batchResults = await AIModule.gradeMultipleTranslations(sentencesDataToGrade);
      } catch(e) {
        console.warn("Lỗi chấm AI hàng loạt, chuyển sang chấm cơ bản:", e);
        batchResults = sentencesDataToGrade.map(req => AIModule.fallbackGrade(req.vietnamese, req.userAnswer, req.targetWords));
      }

      const sentenceResults = [];
      let totalSentScore = 0;

      for (let i = 0; i < sess.sentences.length; i++) {
        const s = sess.sentences[i];
        const sentAns = sentencesDataToGrade[i].userAnswer;
        const sRes = batchResults[i] || AIModule.fallbackGrade(s.vietnamese, sentAns, s.targetWords);

        totalSentScore += sRes.score;
        state.translationHistory.push({
          id: uid('th'), date:new Date().toISOString(), vietnamese:s.vietnamese, targetWords:s.targetWords, userAnswer:sentAns, score:sRes.score, suggested:sRes.suggested
        });
        s.targetWords.forEach(ew=>{
          const word = state.words.find(x=>x.english.toLowerCase()===String(ew).toLowerCase());
          if(word) updateSrs(word, containsWholeWord(sentAns, ew) && sRes.score >= 50, 'worksheet-translate');
        });
        if(state.translationHistory.length > 2000){
          state.translationHistory =
            state.translationHistory.slice(-2000);
        }
        sentenceResults.push({ original: s, ans: sentAns, result: sRes });
      }

      const avgSentScore = sess.sentences.length ? Math.round(totalSentScore / sess.sentences.length) : 0;
      sess.results = { wordResults, correctWords, totalWords: sess.words.length, sentenceResults, avgSentScore };
      sess.phase = 'result';
      persist();
      render();
    });
  };
  return {html, mount};
}

function renderWorksheetResult(){
  const sess = state.ui.worksheetSession;
  const r = sess.results;
  const issueBlock = (title, arr)=> arr && arr.length? `<div style="margin-bottom:6px;"><b style="font-size:12.5px;">${title}</b><ul class="issue-list" style="margin-top:2px;">${arr.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>` : '';

  const wordScore = r.totalWords ? Math.round((r.correctWords / r.totalWords) * 100) : 0;
  const finalScore = Math.round((wordScore + r.avgSentScore) / 2);
  
  let feedbackMsg = "";
  if (finalScore >= 85) feedbackMsg = "🎉 Xuất sắc! Bạn nắm từ vựng và cấu trúc ngữ pháp rất vững. Cứ giữ vững phong độ này nhé!";
  else if (finalScore >= 70) feedbackMsg = "👍 Rất tốt! Bạn đã hiểu bài, chỉ cần chú ý vài chi tiết nhỏ để dịch mượt mà hơn.";
  else if (finalScore >= 50) feedbackMsg = "💪 Khá ổn! Bạn thuộc từ nhưng cần luyện thêm cách sắp xếp câu và ngữ pháp phức tạp.";
  else feedbackMsg = "📚 Bạn cần cố gắng hơn. Đừng nản, hãy ôn lại Flashcard và xem kỹ phần sửa lỗi bên dưới nhé!";

  let html = `<div class="page-head"><div><h2>Kết quả Dò bài</h2></div></div>`;
  html += `<div class="card" style="max-width:760px; margin: 0 auto;">`;
  
  html += `
    <div style="text-align:center; padding: 24px 20px; background: #FCFCFA; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 24px;">
      <div class="score-badge" style="margin:0 auto 12px; width: 72px; height: 72px; font-size: 24px; background: ${finalScore >= 80 ? 'var(--good-tint)' : finalScore >= 50 ? 'var(--amber-tint)' : 'var(--bad-tint)'}; color: ${finalScore >= 80 ? 'var(--good)' : finalScore >= 50 ? 'var(--amber)' : 'var(--bad)'};">${finalScore}</div>
      <h3 style="margin-bottom:8px; font-size:18px;">Nhận xét tổng quan</h3>
      <p style="color:var(--ink-soft); font-size:14.5px; margin:0; line-height: 1.6;">${feedbackMsg}</p>
    </div>
  `;

  html += `<h3 style="margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:8px;">I. Từ vựng (Đúng ${r.correctWords}/${r.totalWords} - ${wordScore} điểm)</h3>`;
  r.wordResults.forEach((w, i) => {
    const promptText = w.direction === 'en2vi' ? w.english : w.vietnamese;
    const correctAns = w.direction === 'en2vi' ? w.vietnamese : w.english;
    html += `
      <div style="margin-bottom:12px; padding:10px; border-radius:var(--radius-sm); background:${w.isCorrect ? 'var(--good-tint)' : 'var(--bad-tint)'}; border:1px solid ${w.isCorrect ? 'var(--good)' : 'var(--bad)'}">
        <div style="font-weight:600; margin-bottom:4px;">${i+1}. ${escapeHtml(promptText.normalize('NFC'))}</div>
        <div style="font-size:13.5px;">
          <span style="color:var(--ink-soft)">Bạn điền:</span> <b>${escapeHtml(w.userAnswer || '(trống)')}</b>
          ${!w.isCorrect ? `<br><span style="color:var(--bad)">Đáp án đúng:</span> <b>${escapeHtml(correctAns)}</b>` : ''}
        </div>
      </div>
    `;
  });

  html += `<h3 style="margin-top:30px; margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:8px;">II. Dịch câu (Điểm trung bình: ${r.avgSentScore}/100)</h3>`;
  
  r.sentenceResults.forEach((sr, idx) => {
    const sRes = sr.result;
    const scoreColor = sRes.score >= 80 ? 'var(--good)' : sRes.score >= 50 ? 'var(--amber)' : 'var(--bad)';
    const scoreTint = sRes.score >= 80 ? 'var(--good-tint)' : sRes.score >= 50 ? 'var(--amber-tint)' : 'var(--bad-tint)';
    
    html += `
      <div style="margin-bottom: 24px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: #FCFCFA;">
        <div style="display:flex; gap:16px; align-items:flex-start; margin-bottom:16px;">
          <div class="score-badge" style="background:${scoreTint}; color:${scoreColor};">${sRes.score}</div>
          <div style="flex:1;">
            <div class="sentence-vi" style="font-size:16px; margin-bottom:8px;">${idx+1}. "${escapeHtml(sr.original.vietnamese)}"</div>
            <p style="font-size:13.5px; color:var(--ink); margin:0;">${escapeHtml(sRes.overallFeedback || '')}</p>
          </div>
        </div>
        <div class="result-grid">
          <div class="result-box"><h4>Câu của bạn</h4>${escapeHtml(sr.ans || '(trống)')}</div>
          <div class="result-box"><h4>Câu đề xuất</h4>${escapeHtml(sRes.suggested)}</div>
        </div>
        <div style="margin-top:16px;">
          ${issueBlock('Ngữ pháp', sRes.grammarIssues)}
          ${issueBlock('Từ vựng', sRes.vocabIssues)}
          ${issueBlock('Chính tả', sRes.spellingIssues)}
          ${issueBlock('Từ còn thiếu', sRes.missingWords)}
          ${issueBlock('Từ thừa', sRes.extraWords)}
        </div>
      </div>
    `;
  });

  html += `<div style="display:flex; gap:10px; justify-content:center; margin-top:30px;">
    <button class="btn btn-primary" id="ws-finish">Về trang chính</button>
    <button class="btn" id="ws-retry">Tạo bài mới</button>
  </div>`;
  html += `</div>`;

  const mount = (root) => {
    root.querySelector('#ws-finish').addEventListener('click', () => { state.ui.worksheetSession = null; navigate('dashboard'); });
    root.querySelector('#ws-retry').addEventListener('click', () => { state.ui.worksheetSession = null; render(); });
  };
  return {html, mount};
}

/* =========================================================================
   PAGE: FLASHCARD
   ========================================================================= */
PAGES.flashcard = function(){
  const sess = state.ui.flashSession;
  if(sess) return renderFlashSession();
  return renderFlashSetup();
};

function renderFlashSetup(){
  const html = `
    <div class="page-head"><div><h2>Flashcard</h2><p>Lật thẻ để ôn nhanh nghĩa của từ.</p></div></div>
    <div class="card" style="max-width:520px;">
      <div class="field"><label>Nguồn từ vựng</label><select id="f-source">${sourceOptionsHtml('all')}</select></div>
      <div class="field"><label>Số lượng thẻ</label><input type="number" id="f-count" min="1" max="100" value="15"></div>
      <div class="field"><label>Mặt trước thẻ</label>
        <select id="f-side"><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
      </div>
      <button class="btn btn-primary btn-block" id="f-start">Bắt đầu</button>
    </div>
  `;
  const mount=(root)=>{
    root.querySelector('#f-start').addEventListener('click', ()=>{
      const source = parseSourceValue(root.querySelector('#f-source').value);
      const pool = wordsFromSource(source);
      if(pool.length===0){ toast('Nguồn từ vựng này chưa có từ nào'); return; }
      const count = Math.max(1, Math.min(100, parseInt(root.querySelector('#f-count').value)||15));
      const side = root.querySelector('#f-side').value;
      const cards = buildQueue(pool, count, true);
      state.ui.flashSession = { cards, index:0, flipped:false, side, done:0, remembered:0 };
      render();
    });
  };
  return {html, mount};
}

function renderFlashSession(){
  const sess = state.ui.flashSession;
  const word = getWord(sess.cards[sess.index]?.id ? sess.cards[sess.index].id : sess.cards[sess.index]);
  if(!word || sess.index>=sess.cards.length){
    const html = `
      <div class="flash-wrap">
        <div class="card" style="text-align:center;padding:30px;">
          <h2>Đã ôn xong ${sess.cards.length} thẻ</h2>
          <p style="color:var(--ink-soft);">Đã nhớ ${sess.remembered}/${sess.cards.length} từ</p>
          <button class="btn btn-primary" id="f-done" style="margin-top:14px;">Về Tổng quan</button>
        </div>
      </div>`;
    return {html, mount:(root)=>root.querySelector('#f-done').addEventListener('click', ()=>{ state.ui.flashSession=null; navigate('dashboard'); })};
  }
  const front = sess.side==='en' ? word.english : word.vietnamese;
  const html = `
    <div class="flash-wrap">
      <div class="hint" style="text-align:center;margin-bottom:10px;">Thẻ ${sess.index+1}/${sess.cards.length}</div>
      <div class="flash-scene">
        <div class="flash-card ${sess.flipped?'is-flipped':''}" id="f-card">
          <div class="flash-face flash-front">
            <span class="side-lbl">Mặt trước</span>
            <div class="q-prompt">${escapeHtml(front)}</div>
            ${sess.side==='en'&&word.pronunciation?`<div class="q-sub">${escapeHtml(word.pronunciation)}</div>`:''}
          </div>
          <div class="flash-face flash-back">
            <span class="side-lbl">Mặt sau</span>
            <div class="fb-word">${escapeHtml(word.english)}${word.pronunciation?' · '+escapeHtml(word.pronunciation):''}</div>
            <div class="fb-vi">${escapeHtml(word.vietnamese)} ${word.pos?`<span class="hint">(${escapeHtml(word.pos)})</span>`:''}</div>
            ${word.synonyms?`<div class="hint" style="margin-bottom:6px;">≈ ${escapeHtml(word.synonyms)}</div>`:''}
            ${word.collocations?`<div class="hint" style="margin-bottom:6px;">Collocation: ${escapeHtml(word.collocations)}</div>`:''}
            ${word.wordFamily?`<div class="hint" style="margin-bottom:6px;">Word family: ${escapeHtml(word.wordFamily)}</div>`:''}
            ${word.confusable?`<div class="hint" style="margin-bottom:6px;">Dễ nhầm: ${escapeHtml(word.confusable)}</div>`:''}
            ${word.example?`<div class="fb-ex">"${escapeHtml(word.example)}"</div>`:''}
          </div>
        </div>
      </div>
      <p class="hint" style="text-align:center;margin-top:8px;">Nhấn vào thẻ để lật</p>
      <div class="mark-row">
        <button class="btn btn-danger" data-frating="again">Quên</button>
        <button class="btn" data-frating="hard">Khó</button>
        <button class="btn" id="f-speak">🔊 Nghe</button>
        <button class="btn btn-primary" data-frating="good">Nhớ</button>
        <button class="btn" data-frating="easy" style="background:var(--good-tint);color:var(--good);border-color:var(--good-tint)">Rất dễ</button>
      </div>
    </div>
  `;
  const mount=(root)=>{
    const cardEl = root.querySelector('#f-card');
    cardEl.addEventListener('click', ()=>{
      sess.flipped = !sess.flipped;
      cardEl.classList.toggle('is-flipped', sess.flipped);
      playUiSound('flip');
    });
    root.querySelector('#f-speak').addEventListener('click', (e)=>{ e.stopPropagation(); speakWord(word); });
    const advance=(rating)=>{
      updateSrs(word,rating,'flashcard');
      sess.done++; if(rating!=='again') sess.remembered++;
      sess.index++; sess.flipped=false;
      persist(); render();
    };
    root.querySelectorAll('[data-frating]').forEach(b=>b.addEventListener('click',(e)=>{e.stopPropagation();advance(b.getAttribute('data-frating'));}));
  };
  return {html, mount};
}

/* =========================================================================
   PAGE: HISTORY (Lịch sử)
   ========================================================================= */
PAGES.history = function(){
  const tab = state.ui.historyTab || 'practice';
  const html = `
    <div class="page-head"><div><h2>Lịch sử học tập</h2><p>Xem lại các phiên luyện tập, câu dịch, hội thoại và tiến độ từng từ.</p></div></div>
    <div class="tab-row">
      <button class="tab-btn ${tab==='practice'?'active':''}" data-tab="practice">Luyện từ vựng</button>
      <button class="tab-btn ${tab==='translate'?'active':''}" data-tab="translate">Dịch câu</button>
      <button class="tab-btn ${tab==='chat'?'active':''}" data-tab="chat">Trò chuyện AI</button>
      <button class="tab-btn ${tab==='words'?'active':''}" data-tab="words">Theo từ</button>
    </div>
    <div id="hist-body"></div>
  `;
  const mount=(root)=>{
    const body = root.querySelector('#hist-body');
    function draw(){
      if(tab==='practice') body.innerHTML = historyPracticeHtml();
      else if(tab==='translate') body.innerHTML = historyTranslateHtml();
      else if(tab==='chat') body.innerHTML = historyChatHtml();
      else body.innerHTML = historyWordsHtml();
      if(tab==='translate') bindHistoryTranslate(body);
      if(tab==='chat') bindHistoryChat(body);
      if(tab==='words') bindHistoryWords(body);
    }
    root.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{
      state.ui.historyTab=b.getAttribute('data-tab'); render();
    }));
    draw();
  };
  return {html, mount};
};

function historyPracticeHtml(){
  const sessions = [...state.practiceSessions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!sessions.length) return `<div class="empty-state card"><h3>Chưa có phiên luyện tập nào</h3></div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Dạng bài</th><th>Tổng câu</th><th>Đúng</th><th>Tỷ lệ</th></tr></thead><tbody>
    ${sessions.map(s=>`<tr><td>${fmtDate(s.date)}</td><td>${escapeHtml((s.modes||[]).map(m=>PRACTICE_MODES.find(x=>x.id===m)?.label||m).join(', '))}</td><td>${s.total}</td><td>${s.correct}</td><td>${s.total?Math.round(s.correct/s.total*100):0}%</td></tr>`).join('')}
  </tbody></table></div>`;
}
function historyTranslateHtml(){
  const items = [...state.translationHistory].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!items.length) return `<div class="empty-state card"><h3>Chưa có câu dịch nào</h3></div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Câu tiếng Việt</th><th>Điểm</th><th></th></tr></thead><tbody>
    ${items.map(t=>`<tr data-th="${t.id}"><td style="white-space:nowrap;">${fmtDate(t.date)}</td><td>${escapeHtml(t.vietnamese)}</td><td>${t.score}</td><td><button class="btn btn-sm btn-ghost" data-act="view-th">Xem</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
function bindHistoryTranslate(body){
  body.querySelectorAll('[data-th]').forEach(row=>{
    row.querySelector('[data-act="view-th"]').addEventListener('click', ()=>{
      const t = state.translationHistory.find(x=>x.id===row.getAttribute('data-th'));
      openModal(`
        <div class="modal-head"><h3>Chi tiết câu dịch</h3><button class="modal-close" data-close>&times;</button></div>
        <p><b>Câu gốc:</b> ${escapeHtml(t.vietnamese)}</p>
        <p><b>Bạn đã dịch:</b> ${escapeHtml(t.userAnswer)}</p>
        <p><b>Câu đề xuất:</b> ${escapeHtml(t.suggested||'—')}</p>
        <p><b>Điểm:</b> ${t.score}</p>
        <div class="modal-actions"><button class="btn" data-close>Đóng</button></div>
      `);
      document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
    });
  });
}
function historyChatHtml(){
  const items = [...(state.conversationHistory||[])].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!items.length) return `<div class="empty-state card"><h3>Chưa có buổi trò chuyện nào</h3></div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Tình huống</th><th>Điểm</th><th></th></tr></thead><tbody>
    ${items.map(c=>`<tr data-ch="${c.id}"><td style="white-space:nowrap;">${fmtDate(c.date)}</td><td>${escapeHtml(c.scenario)}</td><td>${c.score}</td><td><button class="btn btn-sm btn-ghost" data-act="view-ch">Xem</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
function bindHistoryChat(body){
  body.querySelectorAll('[data-ch]').forEach(row=>{
    row.querySelector('[data-act="view-ch"]').addEventListener('click', ()=>{
      const c = (state.conversationHistory||[]).find(x=>x.id===row.getAttribute('data-ch'));
      if(!c) return;
      openModal(`
        <div class="modal-head"><h3>${escapeHtml(c.scenario)}</h3><button class="modal-close" data-close>&times;</button></div>
        <p><b>Điểm:</b> ${c.score}</p>
        <p>${escapeHtml(c.overallFeedback||'')}</p>
        <div class="chat-log" style="max-height:40vh;">
          ${(c.transcript||[]).map(m=>`<div class="chat-bubble ${m.role}">${escapeHtml(m.text)}</div>`).join('')}
        </div>
        <div class="modal-actions"><button class="btn" data-close>Đóng</button></div>
      `, true);
      document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
    });
  });
}
function historyWordsHtml(){
  const sortKey = state.ui.wordsSortKey || 'wrong';
  let words = [...state.words];
  words.sort((a,b)=>{
    const sa=ensureSrs(a), sb=ensureSrs(b);
    if(sortKey==='wrong') return sb.wrong - sa.wrong;
    if(sortKey==='accuracy'){
      const ra = (sa.correct+sa.wrong)? sa.correct/(sa.correct+sa.wrong):0;
      const rb = (sb.correct+sb.wrong)? sb.correct/(sb.correct+sb.wrong):0;
      return ra-rb;
    }
    if(sortKey==='next') return new Date(sa.nextReview)-new Date(sb.nextReview);
    return 0;
  });
  if(!words.length) return `<div class="empty-state card"><h3>Chưa có từ nào</h3></div>`;
  return `
    <div class="toolbar"><select id="words-sort">
      <option value="wrong" ${sortKey==='wrong'?'selected':''}>Sắp xếp: Số lần sai nhiều nhất</option>
      <option value="accuracy" ${sortKey==='accuracy'?'selected':''}>Sắp xếp: Tỷ lệ đúng thấp nhất</option>
      <option value="next" ${sortKey==='next'?'selected':''}>Sắp xếp: Ngày ôn tiếp theo</option>
    </select></div>
    <div class="table-wrap"><table><thead><tr><th>English</th><th>Nghĩa</th><th>Đúng</th><th>Sai</th><th>Tỷ lệ</th><th>Kỹ năng yếu</th><th>Ôn gần nhất</th><th>Ôn tiếp theo</th></tr></thead><tbody>
    ${words.map(w=>{
      const s=ensureSrs(w); const total=s.correct+s.wrong;
      const rate = total? Math.round(s.correct/total*100) : 0;
      const skillLabels={recognition:'nhận biết',recall:'gợi nhớ',listening:'nghe/nói',production:'vận dụng'};
      const weakest=Object.entries(s.skills||{}).map(([k,v])=>{const n=v.correct+v.wrong;return {k,score:n?v.correct/n:1,n};}).filter(x=>x.n).sort((a,b)=>a.score-b.score)[0];
      return `<tr><td><b>${escapeHtml(w.english)}</b></td><td>${escapeHtml(w.vietnamese)}</td><td>${s.correct}</td><td>${s.wrong}</td><td>${rate}%</td><td>${weakest?skillLabels[weakest.k]:'—'}</td><td>${s.lastReviewed?fmtDateShort(s.lastReviewed):'—'}</td><td>${fmtDateShort(s.nextReview)}</td></tr>`;
    }).join('')}
    </tbody></table></div>
  `;
}
function bindHistoryWords(body){
  const sel = body.querySelector('#words-sort');
  if(sel) sel.addEventListener('change', ()=>{ state.ui.wordsSortKey = sel.value; render(); });
}

          <select id="s-gmodel">
            <option value="gemini-3.5-flash-lite" ${state.settings.googleModel==='gemini-3.5-flash-lite'?'selected':''}>Gemini 3.5 Flash Lite (Khuyên dùng — rẻ, nhanh)</option>
            <option value="gemini-3.1-flash-lite" ${state.settings.googleModel==='gemini-3.1-flash-lite'?'selected':''}>Gemini 3.1 Flash Lite (Dự phòng)</option>
            <option value="gemini-3.6-flash" ${state.settings.googleModel==='gemini-3.6-flash'?'selected':''}>Gemini 3.6 Flash (Chất lượng cao hơn)</option>
            <option value="gemini-2.5-flash-lite" ${state.settings.googleModel==='gemini-2.5-flash-lite'?'selected':''}>Gemini 2.5 Flash Lite (Dự phòng cũ hơn)</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-primary" id="s-gsave">Lưu cấu hình AI</button>
        <button class="btn" id="s-gtest">Kiểm tra kết nối</button>
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" class="hint">Lấy API Key miễn phí tại Google AI Studio ↗</a>
      </div>
      <div id="s-gtest-result" class="hint" style="margin-top:8px;"></div>
    </div>

    <div class="card" style="margin-top:16px;border-color:var(--bad);">
      <h3 style="font-size:15px;margin-bottom:8px;color:var(--bad);">Vùng nguy hiểm</h3>
      <p class="hint" style="margin-top:0;">Xoá toàn bộ notebook, từ vựng và lịch sử học tập. Hành động này không thể hoàn tác.</p>
      <button class="btn btn-danger" id="s-reset">Xoá toàn bộ dữ liệu</button>
    </div>
  `;
  const mount=(root)=>{
    root.querySelector('#s-save').addEventListener('click', ()=>{
      state.settings.dailyGoal = Math.max(1, parseInt(root.querySelector('#s-goal').value)||20);
      state.settings.autoTTS = root.querySelector('#s-tts').checked;
      state.settings.dictAIFallback = root.querySelector('#s-dict-ai').checked;
      persist(); toast('Đã lưu cài đặt');
    });
    root.querySelector('#s-gsave').addEventListener('click', ()=>{
      AIModule.setApiKey(root.querySelector('#s-gkey').value.trim());
      state.settings.googleModel = root.querySelector('#s-gmodel').value;
      persist(); toast('Đã lưu cấu hình AI');
    });
    root.querySelector('#s-gtest').addEventListener('click', async ()=>{
      const resEl = root.querySelector('#s-gtest-result');
      AIModule.setApiKey(root.querySelector('#s-gkey').value.trim());
      state.settings.googleModel = root.querySelector('#s-gmodel').value;
      resEl.textContent='Đang kiểm tra...'; resEl.style.color='var(--ink-soft)';
      try{
        await AIModule.testConnection();
        resEl.textContent='✓ Kết nối thành công! Đang dùng Model: ' + state.settings.googleModel; resEl.style.color='var(--good)';
        persist();
      }catch(e){
        resEl.textContent='✗ Kết nối thất bại: '+e.message; resEl.style.color='var(--bad)';
      }
    });
    root.querySelector('#s-export-csv').addEventListener('click', ()=>exportWordsCSV(allWords(), 'tat-ca-tu-vung'));
    root.querySelector('#s-import-csv').addEventListener('click', openImportForm);
    root.querySelector('#s-backup').addEventListener('click', ()=>{
      const backup = JSON.parse(JSON.stringify(state));
      if(backup.settings) backup.settings.googleApiKey = '';
      backup.ui = { page:'dashboard' };
      downloadTextFile(`so-tu-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(backup, null, 2), 'application/json');
      toast('Đã tải file sao lưu (không chứa API Key)');
    });
    root.querySelector('#s-restore').addEventListener('change', (e)=>{
      const file=e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload=()=>{
        try{
          const data = JSON.parse(reader.result);
           if(!validateStateShape(data)) throw new Error('invalid');
           const mode = confirm('Nhấn OK để GHI ĐÈ toàn bộ dữ liệu hiện tại bằng file sao lưu.\nNhấn Huỷ để GỘP THÊM dữ liệu từ file vào dữ liệu hiện tại.') ? 'replace' : 'merge';
           if(mode==='replace'){
             state = migrateState(data);
             state.ui.practiceSession = null;
             state.ui.worksheetSession = null;
             state.ui.flashSession = null;
             state.ui.chatSession = null;
           } else {
            data.notebooks.forEach(nb=>{ if(!getNotebook(nb.id)) state.notebooks.push(nb); });
            data.words.forEach(w=>{ if(!getWord(w.id)) state.words.push(w); });
            (data.mergedSets||[]).forEach(m=>{ if(!state.mergedSets.find(x=>x.id===m.id)) state.mergedSets.push(m); });
            (data.translationHistory||[]).forEach(t=>state.translationHistory.push(t));
            (data.practiceSessions||[]).forEach(p=>state.practiceSessions.push(p));
            (data.conversationHistory||[]).forEach(c=>state.conversationHistory.push(c));
            state.translationHistory = state.translationHistory.slice(-2000);
            state.practiceSessions = state.practiceSessions.slice(-1000);
            state.conversationHistory = state.conversationHistory.slice(-500);
          }
          state.words.forEach(w=>ensureSrs(w));
          persist(); toast('Đã khôi phục dữ liệu'); render();
        }catch(err){ toast('File sao lưu không hợp lệ'); }
      };
      reader.readAsText(file, 'UTF-8');
    });
    root.querySelector('#s-reset').addEventListener('click', ()=>{
      if(confirm('Bạn có chắc muốn xoá TOÀN BỘ dữ liệu? Hành động này không thể hoàn tác.')){
        if(confirm('Xác nhận lần cuối: xoá hết notebook, từ vựng và lịch sử?')){
          state = { version:3, notebooks:[], words:[], mergedSets:[], translationHistory:[], practiceSessions:[], conversationHistory:[], settings:{dailyGoal:20, autoTTS:true, dictAIFallback:true, googleApiKey:'', googleModel:'gemini-3.5-flash-lite'}, ui:{page:'notebooks', worksheetSession:null, practiceSession:null, flashSession:null, chatSession:null} };
          persist(); toast('Đã xoá toàn bộ dữ liệu'); render();
        }
      }
    });
  };
  return {html, mount};
};

/* =========================================================================
   INIT
   ========================================================================= */
(function main(){
  document.addEventListener('click',(e)=>{
    const el=e.target.closest?.('.nav-item,.tab-btn');
    if(el) playUiSound('tap');
  },{passive:true});
  showLoading();
  initAuthScreen();
  initApiKeyScreen();

  fbAuth.onAuthStateChanged(async (user)=>{
    if(user){
      currentUser = user;

      await initState();
      if(state.settings.googleApiKey){
        showAppScreen();
        render();
      } else {
        showApiKeyScreen();
      }

      const cloudState = await cloudLoad(user.uid);
      if(cloudState){
        const localApiKey = state?.settings?.googleApiKey || '';
        applyingRemoteUpdate = true;
        state = migrateState(cloudState);
        state.settings.googleApiKey = localApiKey;
        await storageSet(state);
        applyingRemoteUpdate = false;
        // Xoá API key từng bị lưu trên cloud ở các phiên bản cũ bằng cách ghi lại bản đã lọc.
        await cloudSave(user.uid, state);
        if(state.settings.googleApiKey){
          showAppScreen();
          render();
        } else {
          showApiKeyScreen();
        }
      } else {
        await cloudSave(user.uid, state);
      }

      subscribeCloud(user.uid);
    } else {
      currentUser = null;
      if(cloudUnsub){ cloudUnsub(); cloudUnsub = null; }
      document.getElementById('auth-email').value = '';
      document.getElementById('auth-password').value = '';
      document.getElementById('apikey-input').value = '';
      authErr(null);
      apikeyErr(null);
      showAuthScreen();
    }
  });
})();

</script>
</body>
</html>
