<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Sổ Từ — Học từ vựng &amp; Luyện dịch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2ED;
  --paper:#FFFFFF;
  --ink:#20263B;
  --ink-soft:#5B6178;
  --ink-faint:#8A8FA0;
  --line:#E3E0D4;
  --accent:#2F5D62;
  --accent-dark:#22454A;
  --accent-tint:#E4EEEC;
  --warm:#C97B4A;
  --warm-tint:#F7E9DF;
  --good:#3E8E5A;
  --good-tint:#E4F3E8;
  --bad:#C5533F;
  --bad-tint:#FBEAE6;
  --amber:#B98A22;
  --amber-tint:#F6EEDC;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(32,38,59,.06), 0 1px 1px rgba(32,38,59,.04);
  --font-serif: 'Lora', 'Noto Serif', Georgia, 'Times New Roman', serif;
  --font-sans: 'Inter', 'Noto Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  font-variant-ligatures:none;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit; font-size:14px;}
h1,h2,h3,h4{font-family:var(--font-serif); font-weight:600; margin:0 0 4px;}
a{color:var(--accent);}
.hidden{display:none !important;}
::selection{background:var(--warm-tint);}

/* ---------- Layout shell ---------- */
#shell{display:flex; min-height:100vh; min-height:100dvh;}
#sidebar{
  width:236px; flex:0 0 236px; background:var(--paper);
  border-right:1px solid var(--line); padding:20px 14px;
  display:flex; flex-direction:column; gap:2px;
  position:sticky; top:0; height:100vh; height:100dvh; overflow-y:auto;
}
.brand{
  display:flex; align-items:center; gap:10px; padding:2px 10px 20px;
}
.brand-mark{
  width:34px; height:34px; border-radius:8px; background:var(--accent);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-serif); font-weight:700; font-size:17px; flex:0 0 auto;
}
.brand-text h1{font-size:17px; margin:0; color:var(--ink);}
.brand-text span{font-size:11.5px; color:var(--ink-faint);}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:var(--radius-sm);
  color:var(--ink-soft); cursor:pointer; font-size:14px; border:1px solid transparent;
  user-select:none;
}
.nav-item svg{flex:0 0 auto; opacity:.85;}
.nav-item:hover{background:var(--accent-tint); color:var(--accent-dark);}
.nav-item.active{background:var(--accent); color:#fff;}
.nav-item.active svg{opacity:1;}
.nav-spacer{flex:1;}
.nav-foot{padding:10px 11px; font-size:11.5px; color:var(--ink-faint); border-top:1px solid var(--line); margin-top:8px;}

#main{flex:1; min-width:0; padding:26px 30px 60px; max-width:1180px;}
.page-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.page-head h2{font-size:23px;}
.page-head p{color:var(--ink-soft); margin:2px 0 0; font-size:13.5px;}

/* Mobile top bar */
#mobile-bar{display:none; align-items:center; gap:10px; padding:12px 16px; background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
#mobile-bar .brand{padding:0;}
#mobile-menu-btn{margin-left:auto; background:none; border:1px solid var(--line); border-radius:var(--radius-sm); padding:7px 9px; cursor:pointer;}

/* ---------- Generic components ---------- */
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.btn{
  display:inline-flex; align-items:center; gap:7px; justify-content:center;
  padding:9px 16px; border-radius:var(--radius-sm); border:1px solid var(--line);
  background:var(--paper); color:var(--ink); font-size:13.5px; font-weight:500; cursor:pointer;
  transition:transform .05s ease;
}
.btn:active{transform:translateY(1px);}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-dark); border-color:var(--accent-dark);}
.btn-warm{background:var(--warm); border-color:var(--warm); color:#fff;}
.btn-danger{background:var(--paper); border-color:var(--bad); color:var(--bad);}
.btn-danger:hover{background:var(--bad-tint);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--accent-tint);}
.btn-sm{padding:5px 10px; font-size:12.5px;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}
.btn-block{width:100%;}

.field{margin-bottom:13px;}
.field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
.field input[type=text],.field input[type=number],.field input[type=search],.field select,.field textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius-sm);
  background:#FCFCFA; color:var(--ink);
}
.field textarea{resize:vertical; min-height:64px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-tint); border-color:var(--accent);}
.field-row{display:flex; gap:12px;}
.field-row .field{flex:1;}
.hint{font-size:12px; color:var(--ink-faint); margin-top:4px;}

.ws-sent-input, #t-answer {
  width: 100%;
  min-height: 84px;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: #FCFCFA;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  resize: vertical;
  box-sizing: border-box;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.ws-sent-input:focus, #t-answer:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-tint);
  background: var(--paper);
}

.badge{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:99px; font-size:11.5px; font-weight:600;}
.badge-new{background:var(--amber-tint); color:var(--amber);}
.badge-learning{background:var(--accent-tint); color:var(--accent-dark);}
.badge-due{background:var(--bad-tint); color:var(--bad);}
.badge-mastered{background:var(--good-tint); color:var(--good);}

.grid{display:grid; gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}

/* ---------- Auth screen ---------- */
#loading-screen{display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; color:var(--ink-faint); font-size:13.5px;}
#auth-screen{min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;}
.auth-box{width:100%; max-width:360px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 26px;}
.auth-box .brand{padding:0 0 18px; justify-content:center;}
.auth-box h2{font-size:19px; text-align:center; margin-bottom:4px;}
.auth-box p.hint{text-align:center; margin:0 0 18px;}
.auth-tabs{display:flex; gap:4px; background:var(--bg); border-radius:var(--radius-sm); padding:3px; margin-bottom:18px;}
.auth-tab{flex:1; text-align:center; padding:7px; border-radius:6px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; user-select:none;}
.auth-tab.active{background:var(--paper); color:var(--accent-dark); box-shadow:var(--shadow);}
.auth-error{background:var(--bad-tint); color:var(--bad); font-size:12.5px; padding:8px 10px; border-radius:var(--radius-sm); margin-bottom:12px;}
.auth-divider{display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--ink-faint); font-size:12px;}
.auth-divider::before,.auth-divider::after{content:''; flex:1; height:1px; background:var(--line);}
.btn-google{display:flex; align-items:center; justify-content:center; gap:9px; width:100%;}
.auth-link{background:none; border:none; color:var(--accent); font-size:12.5px; cursor:pointer; padding:0; text-decoration:underline;}
.user-chip{display:flex; align-items:center; gap:8px; padding:9px 11px; font-size:12.5px; color:var(--ink-soft); border-top:1px solid var(--line); margin-top:6px;}
.user-chip .avatar{width:24px; height:24px; border-radius:99px; background:var(--accent-tint); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; flex:0 0 auto;}
.user-chip .email{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.user-chip button{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:11.5px; text-decoration:underline; flex:0 0 auto;}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

.stat-tile{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
.stat-tile .num{font-family:var(--font-serif); font-size:28px; font-weight:700; line-height:1;}
.stat-tile .lbl{font-size:12.5px; color:var(--ink-soft); margin-top:6px;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11.5px; color:var(--ink-faint); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--line); cursor:default; white-space:nowrap;}
th.sortable{cursor:pointer;}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--paper);}
.table-wrap table{min-width:600px;}

.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px;}
.toolbar .spacer{flex:1;}
.search-box{position:relative; min-width:220px;}
.search-box input{padding-left:30px;}
.search-box svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.5;}

.tab-row{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px;}
.tab-btn{padding:9px 14px; border:none; background:none; cursor:pointer; font-size:13.5px; color:var(--ink-soft); border-bottom:2px solid transparent; margin-bottom:-1px;}
.tab-btn.active{color:var(--accent-dark); border-color:var(--accent); font-weight:600;}

.empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty-state h3{color:var(--ink); margin-bottom:6px;}

/* Notebook cards */
.nb-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; cursor:pointer;}
.nb-card:hover{border-color:var(--accent);}
.nb-tab{height:6px;}
.nb-body{padding:15px 16px; flex:1;}
.nb-body h3{font-size:16px; margin-bottom:3px;}
.nb-body p{font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; min-height:16px;}
.nb-meta{display:flex; gap:14px; font-size:12px; color:var(--ink-faint);}
.nb-foot{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line); background:#FBFAF7;}

/* Modal */
#modal-root{position:fixed; inset:0; z-index:100; display:none; align-items:flex-start; justify-content:center; padding:5vh 16px; background:rgba(32,38,59,.42); overflow-y:auto;}
#modal-root.open{display:flex;}
.modal-box{background:var(--paper); border-radius:var(--radius); max-width:520px; width:100%; padding:22px 24px; box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal-box.wide{max-width:680px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-close{background:none; border:none; cursor:pointer; font-size:20px; color:var(--ink-faint); line-height:1;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px; padding-top:14px; border-top:1px solid var(--line);}

/* Toast */
#toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:var(--radius-sm); font-size:13.5px; z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; box-shadow:0 8px 20px rgba(0,0,0,.25);}
#toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

/* Practice */
.practice-wrap{max-width:640px; margin:0 auto;}
.progress-bar{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:22px;}
.progress-bar > div{height:100%; background:var(--accent); transition:width .25s ease;}
.q-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:32px 28px; text-align:center; box-shadow:var(--shadow);}
.q-kicker{font-size:12px; color:var(--ink-faint); margin-bottom:14px; letter-spacing:.02em;}
.q-prompt{font-family:var(--font-serif); font-size:27px; margin-bottom:6px; word-break:break-word;}
.q-sub{color:var(--ink-soft); font-size:14px; margin-bottom:22px;}
.q-input{width:100%; text-align:center; font-size:17px; padding:12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#FCFCFA;}
.mcq-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
@media(max-width:520px){.mcq-grid{grid-template-columns:1fr;}}
.mcq-opt{padding:13px 14px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#FCFCFA; cursor:pointer; font-size:14.5px; text-align:left;}
.mcq-opt:hover{border-color:var(--accent);}
.mcq-opt.correct{background:var(--good-tint); border-color:var(--good); color:var(--good);}
.mcq-opt.wrong{background:var(--bad-tint); border-color:var(--bad); color:var(--bad);}
.mcq-opt[disabled]{cursor:default;}
.speak-btn{background:var(--accent-tint); border:1px solid var(--accent-tint); color:var(--accent-dark); border-radius:99px; width:52px; height:52px; font-size:20px; cursor:pointer; margin:0 auto 14px;}
.speak-btn:hover{background:var(--accent); color:#fff;}
.feedback-panel{margin-top:18px; border-radius:var(--radius); padding:16px 18px; text-align:left;}
.feedback-panel.ok{background:var(--good-tint); border:1px solid #bfe0cb;}
.feedback-panel.no{background:var(--bad-tint); border:1px solid #f0c7bd;}
.feedback-panel .fb-title{font-weight:700; margin-bottom:6px;}
.feedback-panel.ok .fb-title{color:var(--good);}
.feedback-panel.no .fb-title{color:var(--bad);}
.feedback-panel .fb-body{font-size:13.5px; color:var(--ink);}
.feedback-panel .fb-body b{font-family:var(--font-serif);}
.session-actions{display:flex; gap:10px; justify-content:center; margin-top:20px;}

/* Flashcard */
.flash-wrap{max-width:480px; margin:0 auto;}
.flash-card{background:var(--paper); border:1px solid var(--line); border-radius:16px; min-height:280px; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px; cursor:pointer; box-shadow:var(--shadow); position:relative;}
.flash-card .side-lbl{position:absolute; top:14px; left:16px; font-size:11px; color:var(--ink-faint);}
.flash-front .q-prompt{font-size:30px;}
.flash-back .fb-word{font-family:var(--font-serif); font-size:20px; color:var(--accent-dark); margin-bottom:4px;}
.flash-back .fb-vi{font-size:24px; margin-bottom:10px;}
.flash-back .fb-ex{font-size:13.5px; color:var(--ink-soft); font-style:italic;}
.flash-nav{display:flex; justify-content:space-between; align-items:center; margin-top:18px;}
.mark-row{display:flex; gap:10px; margin-top:18px; justify-content:center;}
.mark-row .btn{flex:1; max-width:200px; padding:12px;}

/* Translate */
.sentence-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:26px 26px 20px; box-shadow:var(--shadow);}
.sentence-vi{font-family:var(--font-serif); font-size:21px; line-height:1.5; margin-bottom:14px;}
.target-chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
.chip{background:var(--accent-tint); color:var(--accent-dark); padding:3px 10px; border-radius:99px; font-size:12px; font-weight:600;}
.result-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px;}
@media(max-width:640px){.result-grid{grid-template-columns:1fr;}}
.result-box{border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px 15px; background:#FCFCFA;}
.result-box h4{font-size:12px; color:var(--ink-faint); margin-bottom:6px; font-family:var(--font-sans);}
.score-badge{width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column; font-family:var(--font-serif); font-weight:700; font-size:20px; flex:0 0 auto;}
.issue-list{margin:0; padding-left:18px; font-size:13px;}
.issue-list li{margin-bottom:3px;}
.banner{padding:10px 14px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:16px;}
.banner-warn{background:var(--amber-tint); color:#8a6a19; border:1px solid #ecd9a3;}

/* charts */
.chart-bars{display:flex; align-items:flex-end; gap:6px; height:120px; padding-top:10px;}
.chart-bars .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.chart-bars .bar{width:100%; max-width:22px; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px;}
.chart-bars .bar-lbl{font-size:9.5px; color:var(--ink-faint); margin-top:4px; white-space:nowrap;}
.stack-bar{display:flex; height:26px; border-radius:99px; overflow:hidden; margin:10px 0;}
.stack-legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft);}
.stack-legend span{display:inline-flex; align-items:center; gap:6px;}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block;}

@media(max-width:860px){
  #sidebar{display:none;}
  #sidebar.open{display:flex; position:fixed; z-index:50; height:100vh; height:100dvh; box-shadow:0 0 0 100vw rgba(0,0,0,.3);}
  #mobile-bar{display:flex;}
  #main{padding:18px 14px 50px;}
  .grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div id="loading-screen"><span>Đang tải…</span></div>

<div id="auth-screen" class="hidden">
  <div class="auth-box">
    <div class="brand"><div class="brand-mark">S</div><div class="brand-text"><h1>Sổ Từ</h1></div></div>
    <div class="auth-tabs">
      <div class="auth-tab active" data-authtab="login">Đăng nhập</div>
      <div class="auth-tab" data-authtab="register">Đăng ký</div>
    </div>
    <div id="auth-error" class="auth-error hidden"></div>
    <form id="auth-form">
      <div class="field"><label>Email</label><input type="text" id="auth-email" autocomplete="email" required></div>
      <div class="field"><label>Mật khẩu</label><input type="password" id="auth-password" autocomplete="current-password" required minlength="6"></div>
      <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Đăng nhập</button>
    </form>
    <div style="text-align:right;margin-top:8px;"><button class="auth-link" id="auth-forgot">Quên mật khẩu?</button></div>
    <div class="auth-divider">hoặc</div>
    <button class="btn btn-block btn-google" id="auth-google">
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.5 29.4 35.5 24 35.5c-6.9 0-12.5-5.6-12.5-12.5S17.1 10.5 24 10.5c3.2 0 6.1 1.2 8.3 3.2l5.7-5.7C34.5 4.9 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.2 0 6.1 1.2 8.3 3.2l5.7-5.7C34.5 6.9 29.5 5 24 5c-7.7 0-14.4 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 43c5.3 0 10.2-2 13.9-5.4l-6.4-5.4C29.4 33.7 26.8 34.5 24 34.5c-5.3 0-9.8-3.5-11.4-8.3l-6.6 5.1C9.5 38.5 16.2 43 24 43z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 3.7-3.4 6.6-6.8 8.2l6.4 5.4C39.6 38 44 32.2 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>

/* Đang trong 1 phiên tương tác dở dang (đang luyện tập / dò bài / dịch câu / flashcard)?
   Nếu đúng, dữ liệu đồng bộ từ đám mây vẫn được lưu vào state, nhưng KHÔNG được phép
   vẽ lại giao diện (render), vì render() sẽ xoá mất phần "đã trả lời" đang hiển thị
   trên màn hình (nó không có cách nào khôi phục lại đúng UI đó từ state thuần tuý). */
function hasActiveSession(){
  const ui = state && state.ui;
  if(!ui) return false;
  if(ui.practiceSession && ui.practiceSession.phase === 'active') return true;
  if(ui.worksheetSession && ui.worksheetSession.phase === 'active') return true;
  if(ui.flashSession) return true;
  if(ui.translateUi && ui.translateUi.current) return true;
  return false;
}

function subscribeCloud(uid){
  if(cloudUnsub) cloudUnsub();
  cloudUnsub = userDocRef(uid).onSnapshot(snap => {
    if(snap.metadata.hasPendingWrites) return; // bỏ qua tiếng vọng của chính thao tác ghi local
    if(!snap.exists) return;
    const data = snap.data();
    if(!data || !data.state) return;

    const localUi = state ? state.ui : null;
    const midSession = hasActiveSession();

    applyingRemoteUpdate = true;
    state = migrateState(data.state);
    if(midSession && localUi){
      // Giữ nguyên giao diện/phiên đang làm dở của người dùng, chỉ nhận dữ liệu ngầm.
      state.ui = localUi;
    }
    storageSet(state);
    if(!midSession){
      render();
    }
    applyingRemoteUpdate = false;
  }, err => console.error('Lỗi lắng nghe đồng bộ:', err));
}

/* ---------------------------- Utils ---------------------------- */
function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function sample(arr,n){ return shuffleArray([...arr]).slice(0,n); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function fmtDate(iso){
  if(!iso) return '—';
  const d=new Date(iso);
  return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateShort(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});
}
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); d.setHours(0,0,0,0); return d; }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function normalizeLoose(s){
  return String(s||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[.,!?;:"']/g,'');
}
function clampScore(value, fallback=50){ const n=Number(value); return Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):fallback; }
function normalizeWordText(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function normalizeAnswer(s){
  return normalizeWordText(s).normalize('NFC')
    .replace(/[.,!?;:"'“”‘’()\[\]{}]/g,'')
    .replace(/[-–—]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function escapeRegExp(s){ return String(s||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function containsWholeWord(text, term){
  const t=normalizeAnswer(text), q=normalizeAnswer(term);
  if(!t || !q) return false;
  return new RegExp(`(?:^|\\s)${escapeRegExp(q)}(?:$|\\s)`,'i').test(t);
}
function answerMatches(userAnswer, acceptedAnswers, allowPhraseContainment=false){
  const user=normalizeAnswer(userAnswer);
  if(!user) return false;
  const answers=(Array.isArray(acceptedAnswers)?acceptedAnswers:[acceptedAnswers])
    .flatMap(x=>String(x||'').split('/')).map(normalizeAnswer).filter(Boolean);
  return answers.some(a => user===a || (allowPhraseContainment && user.length>1 && (user.includes(a) || a.includes(user))));
}

/* ---------------------------- CSV helpers ---------------------------- */
function csvEscape(v){
  v = v==null ? '' : String(v);
  if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function parseCSV(text){
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; }
      } else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1 || (r.length===1 && r[0]!==''));
}
function downloadTextFile(filename, content, mime){
  const blob=new Blob([content], {type:mime||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
}

/* ---------------------------- Persistent storage ---------------------------- */
const DB_NAME = 'SoTuDB';
const DB_VERSION = 1;
const DB_STORE = 'app';
const STORAGE_KEY = 'app-state-v1';

function canUseIndexedDB(){
  // Chrome có thể hạn chế IndexedDB đối với file://.
  // Khi mở HTML trực tiếp từ máy, dùng localStorage để app vẫn chạy.
  return location.protocol !== 'file:' && typeof indexedDB !== 'undefined';
}

function openDatabase(){
  return new Promise((resolve, reject) => {
    try{
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = () => {
        const db = request.result;
        if(!db.objectStoreNames.contains(DB_STORE)){
          db.createObjectStore(DB_STORE);
        }
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Không mở được IndexedDB'));
      request.onblocked = () => reject(new Error('IndexedDB đang bị chặn'));
    }catch(e){
      reject(e);
    }
  });
}

async function storageGet(){
  // Khi chạy trực tiếp file HTML, ưu tiên localStorage.
  if(!canUseIndexedDB()){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){
      console.error('Lỗi đọc localStorage:', e);
      return null;
    }
  }

  try{
    const db = await openDatabase();

    return await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const store = tx.objectStore(DB_STORE);
      const request = store.get('state');

      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
      tx.oncomplete = () => db.close();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){
    console.warn('IndexedDB không khả dụng, chuyển sang localStorage:', e);

    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(storageErr){
      console.error('Lỗi đọc fallback localStorage:', storageErr);
      return null;
    }
  }
}

async function storageSet(obj){
  // Khi mở file://, lưu localStorage để tương thích với mở file trực tiếp.
  if(!canUseIndexedDB()){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
      return true;
    }catch(e){
      console.error('Lỗi lưu localStorage:', e);
      return false;
    }
  }

  try{
    const db = await openDatabase();

    return await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      const store = tx.objectStore(DB_STORE);
      const request = store.put(obj, 'state');

      request.onerror = () => reject(request.error);
      tx.oncomplete = () => {
        db.close();
        resolve(true);
      };
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){
    console.warn('IndexedDB không khả dụng, lưu vào localStorage:', e);

    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
      return true;
    }catch(storageErr){
      console.error('Lỗi lưu fallback localStorage:', storageErr);
      return false;
    }
  }
}

async function migrateLocalStorageToIndexedDB(){
  // Đang mở file HTML trực tiếp thì không cần migration sang IndexedDB.
  if(!canUseIndexedDB()){
    return await storageGet();
  }

  try{
    const existing = await storageGet();

    if(existing){
      return existing;
    }

    const oldData = localStorage.getItem(STORAGE_KEY);

    if(!oldData){
      return null;
    }

    const parsed = JSON.parse(oldData);
    const ok = await storageSet(parsed);

    if(ok){
      console.log('✓ Đã chuyển dữ liệu từ localStorage sang IndexedDB');
      // Không xóa localStorage ngay để tránh mất dữ liệu nếu có sự cố.
    }

    return parsed;
  }catch(e){
    console.error('Lỗi chuyển dữ liệu localStorage → IndexedDB:', e);
    return null;
  }
}

let saveTimer = null;
let saveInProgress = false;
let savePending = false;

function persist(){
  clearTimeout(saveTimer);

  saveTimer = setTimeout(async () => {
    savePending = true;

    if(saveInProgress){
      return;
    }

    saveInProgress = true;

    try{
      while(savePending){
        savePending = false;

        const ok = await storageSet(state);

        if(!ok){
          toast('⚠️ Không thể lưu dữ liệu');
          break;
        }

        // Đẩy lên Firestore để đồng bộ giữa các thiết bị cùng tài khoản.
        // Bỏ qua nếu thay đổi này đến từ chính việc nhận dữ liệu đồng bộ (tránh vòng lặp).
        if(currentUser && !applyingRemoteUpdate){
          cloudSave(currentUser.uid, state);
        }
      }
    }catch(e){
      console.error('Lỗi persist:', e);
      toast('⚠️ Không thể lưu dữ liệu');
    }finally{
      saveInProgress = false;
    }
  }, 300);
}

/* ---------------------------- SRS logic ---------------------------- */
const SRS_LEVELS_DAYS=[0,1,2,4,7,14,30,60,120,240];
function newSrs(){
  return { level:0, correct:0, wrong:0, lastReviewed:null, nextReview:new Date().toISOString(), history:[] };
}
function ensureSrs(word){ if(!word.srs) word.srs=newSrs(); return word.srs; }
function updateSrs(word, isCorrect, mode='unknown'){
  const s = ensureSrs(word);
  const now = new Date();

  if(isCorrect){
    s.correct++;
    s.level = Math.min(
      SRS_LEVELS_DAYS.length - 1,
      s.level + 1
    );
  } else {
    s.wrong++;
    s.level = Math.max(0, s.level - 1);
  }

  s.lastReviewed = now.toISOString();

  const days = SRS_LEVELS_DAYS[s.level];

  s.nextReview = new Date(
    now.getTime() + days * 86400000
  ).toISOString();

  s.history.push({
    date: now.toISOString(),
    correct: isCorrect,
    mode
  });

  // Chỉ giữ lại 30 lần ôn gần nhất của mỗi từ
  if(s.history.length > 30){
    s.history = s.history.slice(-30);
  }
}
function isDue(word){
  const s = ensureSrs(word);

  if (s.correct + s.wrong === 0) {
    return false;
  }

  return new Date(s.nextReview).getTime() <= Date.now();
}
function statusOf(word){
  const s=ensureSrs(word);
  const total=s.correct+s.wrong;
  if(total===0) return 'new';
  if(isDue(word)) return 'due';
  if(s.level>=5) return 'mastered';
  return 'learning';
}
function priorityScore(word){
  const s=ensureSrs(word);
  const now=Date.now();
  const overdueDays = Math.max(
  0,
  (now - new Date(s.nextReview).getTime()) / 86400000
);
  const total=s.correct+s.wrong;
  const errorRate= total? s.wrong/total : 0.5;
  let score=overdueDays*3 + errorRate*40;
  if(total===0) score+=55;
  return score;
}
function buildQueue(wordPool, count, prioritize){
  let pool = wordPool.filter(Boolean);

  if (prioritize) {
    pool.sort((a,b) => priorityScore(b) - priorityScore(a));

    const urgent = pool.slice(0, Math.ceil(count * 0.7));
    const exploration = sample(
      pool.slice(Math.ceil(count * 0.7)),
      count - urgent.length
    );

    return [...urgent, ...exploration];
  }

  return sample(pool, count);
}

/* ---------------------------- AI module (tách riêng, dễ thay thế) ----------------------------
   Dùng Google Gemini API (generativelanguage.googleapis.com). Cần người dùng nhập Google API Key
   trong trang Cài đặt — key được lưu cùng dữ liệu ứng dụng (chỉ trên máy/tài khoản của người dùng). */
const AIModule = (function(){
  // Danh sách các model tự động chuyển đổi (từ ưu tiên cao nhất xuống thấp nhất)
  const FALLBACK_MODELS = [
    'gemini-3.5-flash-lite',
    'gemini-3.1-flash-lite',
    'gemini-1.5-flash-8b',
    'gemini-1.5-flash'
  ];
  const reqCache = new Map();
  let activeRequest = null;

  function getApiKey(){ return (state && state.settings && state.settings.googleApiKey) || ''; }
  function setApiKey(k){ if(state && state.settings) state.settings.googleApiKey = k || ''; }
  function getModel(){ return (state && state.settings && state.settings.googleModel) || FALLBACK_MODELS[0]; }

  async function callGemini(prompt, config = {}, retries = 1) {
    if (activeRequest) activeRequest.abort();
    const key = getApiKey();
    if (!key) throw new Error('Chưa cấu hình Google API Key (vào Cài đặt để thêm)');

    // Lấy model hiện tại đang lưu
    const preferredModel = getModel();
    // Tạo mảng thử nghiệm: đưa model ưu tiên lên đầu, sau đó là các model dự phòng
    const modelsToTry = [preferredModel, ...FALLBACK_MODELS.filter(m => m !== preferredModel)];

    let lastError = null;

    // Vòng lặp thử từng model trong danh sách (Hết con này tới con kia)
    for (const currentModel of modelsToTry) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(currentModel)}:generateContent`;
      
      for (let i = 0; i <= retries; i++) {
        const controller = new AbortController();
        activeRequest = controller;
        const timeout = setTimeout(() => controller.abort(), 15000); // 15s timeout

        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
            body: JSON.stringify({
              contents: [{ role: 'user', parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: 'application/json', ...config }
            }),
            signal: controller.signal
          });

          if (!res.ok) {
            const errText = await res.text().catch(() => '');
            if (res.status === 401 || res.status === 403) throw new Error('Sai API Key hoặc bị khoá hoàn toàn');
            if (res.status === 429) {
              // Lỗi cạn hạn mức (Quota) -> Lập tức bỏ qua vòng retry, CHUYỂN SANG MODEL TIẾP THEO
              if (errText.includes('quota')) {
                console.warn(`[AI Fallback] ${currentModel} cạn hạn mức. Đang chuyển model...`);
                lastError = new Error(`Model ${currentModel} hết hạn mức`);
                break; 
              }
              // Lỗi spam nhanh (Rate Limit) -> Đợi 2s rồi thử lại chính model này
              if (i < retries) {
                await new Promise(r => setTimeout(r, 2000));
                continue;
              }
              break;
            }
            if (res.status >= 500 && i < retries) {
              await new Promise(r => setTimeout(r, 2000));
              continue;
            }
            throw new Error(`Lỗi ${res.status}: ${errText.slice(0, 100)}`);
          }

          const data = await res.json();
          const text = data?.candidates?.[0]?.content?.parts?.find(part => typeof part?.text === 'string')?.text;
          if (!text) throw new Error('Phản hồi rỗng');
          
          // NẾU model dự phòng chạy thành công -> Lưu nó làm mặc định luôn để lần sau không bị vấp lại
          if (currentModel !== preferredModel && state && state.settings) {
            state.settings.googleModel = currentModel;
            console.log(`[AI Auto-Fix] Đã tự động chốt model đang sống: ${currentModel}`);
            persist();
          }
          
          return text;
        } catch (e) {
          lastError = e;
          if (e.message.includes('Sai API Key')) throw e; // Nếu sai key thì đừng thử model khác làm gì cho mất công
        } finally {
          clearTimeout(timeout);
          if (activeRequest === controller) activeRequest = null;
        }
      }
    }
    
    // Nếu chạy hết tất cả các con AI trong danh sách mà vẫn xịt
    throw lastError || new Error('Tất cả các Model AI đều đã cạn hạn mức. Vui lòng tạo Key mới hoặc thử lại vào ngày mai.');
  }

  function extractJson(text){
    try {
      const t = String(text || '').replace(/```json/gi, '').replace(/```/g, '').trim();
      const start = t.search(/[{[]/);
      const end = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
      return JSON.parse(t.substring(start, end + 1));
    } catch (e) {
      return null;
    }
  }

  async function testConnection(){
    const text = await callGemini('{"ok": true}', { temperature: 0.1 });
    const json = extractJson(text);
    if(!json) throw new Error('Phản hồi không hợp lệ');
    return true;
  }

  function normalizeTargetWords(targetWords, allowedWords){
    const lookup = new Map(allowedWords.map(w => [w.english.trim().toLowerCase(), w.english]));
    return targetWords.map(word => lookup.get(String(word).trim().toLowerCase())).filter(Boolean);
  }

  async function generateSentence(words, recentSentences){
    const recent = (recentSentences||[]).slice(-5);
    const cacheKey = `${words.map(w => w.id).join('_')}__${recent.map(x=>normalizeWordText(x)).join('|')}`;
    if (reqCache.has(cacheKey)) return reqCache.get(cacheKey);
    const wordList = words.map(w=>`${w.english} (${w.vietnamese})`).join(', ');
    const recentText = recent.join(' | ') || '';
    const prompt = `Soạn 1 câu tiếng Việt (8-18 từ) tự nhiên để học sinh luyện dịch sang tiếng Anh. Câu phải dùng đúng ngữ nghĩa của tất cả các từ sau: ${wordList}. Không được lặp lại hoặc chỉ biến thể nhẹ từ các câu trước: ${recentText}. Trả về JSON: {"vietnamese":"câu","targetWords":["từ 1","từ 2"],"hint":"gợi ý ngắn"}`;
    const text = await callGemini(prompt, { temperature: 0.8 });
    const json = extractJson(text);
    if(!json || typeof json.vietnamese !== 'string' || !json.vietnamese.trim()) throw new Error('Phản hồi AI không hợp lệ');
    json.vietnamese = String(json.vietnamese).normalize('NFC');
    json.targetWords = words.map(w=>w.english);
    reqCache.set(cacheKey, json);
    return json;
  }

  function fallbackSentence(words){
    const safeWords = (words || []).filter(Boolean);
    if(!safeWords.length) throw new Error('Không có từ để tạo câu mẫu');
    const targetWords = safeWords.map(w=>w.english);
    const meanings = safeWords.map(w=>w.vietnamese);
    const templates = [
      () => `Hôm nay tôi muốn nói chuyện về ${meanings.join(' và ')}.`,
      () => `Tôi nghĩ ${meanings.join(' và ')} đóng vai trò quan trọng trong cuộc sống.`,
      () => `Cô giáo yêu cầu chúng tôi viết về ${meanings.join(' và ')}.`,
      () => `Nhiều người trẻ hiện nay quan tâm đến ${meanings.join(' và ')}.`,
      () => `Chúng tôi đã thảo luận khá lâu về ${meanings.join(' và ')} trong lớp.`,
      () => `Bạn có thể giải thích rõ hơn về ${meanings.join(' và ')} không?`
    ];
    return { vietnamese: pick(templates)(), targetWords, hint:'' };
  }

  async function generateWorksheetSentences(words, numSentences, recentSentences) {
    const MAX_REQUESTS = 2;
    const numReqs = Math.min(numSentences, MAX_REQUESTS);
    const recent = (recentSentences || []).slice(-5).join(' | ') || '';
    const sentsPerReq = Math.floor(numSentences / numReqs);
    let extraSents = numSentences % numReqs;
    const wordsPerReq = Math.ceil(words.length / numReqs);
    let wordIdx = 0;
    let allSentences = [];

    for (let i = 0; i < numReqs; i++) {
      const takeSents = sentsPerReq + (extraSents > 0 ? 1 : 0);
      extraSents--;
      let wChunk = words.slice(wordIdx, wordIdx + wordsPerReq);
      wordIdx += wordsPerReq;
      if (wChunk.length === 0) wChunk = words.slice(0, 3);
      const wordList = wChunk.map(w => `${w.english} (${w.vietnamese})`).join(', ');
      
      const prompt = `Bạn là giáo viên tiếng Anh chuyên môn cao. Soạn ${takeSents} câu tiếng Việt khác nhau để học sinh THPT dịch sang tiếng Anh.
YÊU CẦU BẮT BUỘC:
1. Mỗi câu dùng đúng ngữ nghĩa của 1-3 từ trong danh sách: ${wordList}.
2. CẤU TRÚC ĐA DẠNG: Đan xen câu đơn, câu ghép, câu phức (mệnh đề quan hệ, điều kiện, bị động, v.v.). Không viết câu quá trẻ con.
3. Trong ${takeSents} câu này, BẮT BUỘC phải có ít nhất 1 câu hỏi (nghi vấn) để đủ tỷ lệ 20%.
4. Không lặp lại các câu sau: ${recent}.
TRẢ VỀ ĐÚNG MỘT MẢNG JSON HỢP LỆ, KHÔNG CÓ TEXT BÊN NGOÀI: [{"vietnamese":"câu 1","targetWords":["từ 1","từ 2"]}]`;

      try {
        const text = await callGemini(prompt, { temperature: 0.8 });
        let json = extractJson(text);
        if (json) {
          if (!Array.isArray(json)) {
            const arrKey = Object.keys(json).find(k => Array.isArray(json[k]));
            json = arrKey ? json[arrKey] : [json];
          }
          if (Array.isArray(json)) allSentences.push(...json);
        }
        if (i < numReqs - 1) await new Promise(r => setTimeout(r, 1500));
      } catch (e) {
        console.warn(e);
      }
    }

    const validResults = allSentences
      .filter(item => item && typeof item.vietnamese === 'string' && item.vietnamese.trim() && Array.isArray(item.targetWords))
      .map(item => ({ vietnamese: String(item.vietnamese).normalize('NFC'), targetWords: normalizeTargetWords(item.targetWords, words) }))
      .filter(item => item.targetWords.length >= 1 && item.targetWords.length <= 3);

    if (validResults.length === 0) throw new Error('AI không tạo được câu hợp lệ nào.');
    return validResults.slice(0, numSentences);
  }

  function fallbackWorksheetSentences(words, numSentences){
    const res = [];
    const pool = [...words];
    for(let i=0; i<numSentences; i++){
      const w = pool.length ? pool.shift() : words[0];
      res.push(fallbackSentence([w]));
    }
    return res;
  }

  async function gradeTranslation(vnSentence, userAnswer, targetWords){
    const prompt = `Chấm điểm dịch Việt-Anh. VN: "${vnSentence}". Bắt buộc dùng: ${targetWords.join(', ')}. Học sinh dịch: "${userAnswer}". Trả JSON: {"score":85,"suggested":"câu chuẩn","grammarIssues":[""],"vocabIssues":[""],"spellingIssues":[""],"missingWords":[""],"extraWords":[""],"overallFeedback":"nhận xét"}`;
    const text = await callGemini(prompt, { temperature: 0.2 });
    const json = extractJson(text);
    if(!json) throw new Error('Phản hồi AI không hợp lệ');
    json.score = clampScore(json.score, 50);
    json.suggested = json.suggested || '';
    json.grammarIssues = Array.isArray(json.grammarIssues) ? json.grammarIssues : [];
    json.vocabIssues = Array.isArray(json.vocabIssues) ? json.vocabIssues : [];
    json.spellingIssues = Array.isArray(json.spellingIssues) ? json.spellingIssues : [];
    json.missingWords = Array.isArray(json.missingWords) ? json.missingWords : [];
    json.extraWords = Array.isArray(json.extraWords) ? json.extraWords : [];
    json.overallFeedback = json.overallFeedback || '';
    return json;
  }

  function fallbackGrade(vnSentence, userAnswer, targetWords){
    const missing = targetWords.filter(w=>!containsWholeWord(userAnswer, w));
    const wordCount = userAnswer.trim().split(/\s+/).filter(Boolean).length;
    let score=100;
    score -= missing.length*25;
    if(wordCount<4) score-=20;
    if(!/[.!?]$/.test(userAnswer.trim())) score-=5;
    score=Math.max(0, Math.min(100, score));
    return {
      score, suggested:'', grammarIssues:[], vocabIssues: missing.length? [`Thiếu từ: ${missing.join(', ')}`] : [], spellingIssues:[], missingWords: missing, extraWords:[], overallFeedback:'Điểm ước tính.'
    };
  }

  async function gradeMultipleTranslations(sentencesData){
    if(!sentencesData || sentencesData.length === 0) return [];
    const CHUNK_SIZE = 5;
    const results = [];

    for (let i = 0; i < sentencesData.length; i += CHUNK_SIZE) {
      const chunk = sentencesData.slice(i, i + CHUNK_SIZE);
      const promptData = chunk.map((item, idx) => `Câu ${idx}:\nVN:"${item.vietnamese}"\nEN:"${item.userAnswer}"\nTừ bắt buộc:${item.targetWords.join(', ')}`).join('\n\n');
      const prompt = `Chấm điểm dịch. Trả MẢNG JSON theo thứ tự: [{"score":85,"suggested":"câu chuẩn","grammarIssues":[],"vocabIssues":[],"spellingIssues":[],"missingWords":[],"extraWords":[],"overallFeedback":"nhận xét"}].\n\n${promptData}`;
      
      const text = await callGemini(prompt, { temperature: 0.2 });
      let json = extractJson(text);
      if(!json) throw new Error('Phản hồi AI không parse được');
      if (!Array.isArray(json)) {
        const arrayKey = Object.keys(json).find(k => Array.isArray(json[k]));
        if (arrayKey) json = json[arrayKey];
        else json = [json];
      }
      results.push(...json);
    }

    return results.slice(0, sentencesData.length).map((r) => {
      return {
        score: clampScore(r?.score, 50), suggested: r?.suggested || '', grammarIssues: Array.isArray(r?.grammarIssues) ? r.grammarIssues : [], vocabIssues: Array.isArray(r?.vocabIssues) ? r.vocabIssues : [], spellingIssues: Array.isArray(r?.spellingIssues) ? r.spellingIssues : [], missingWords: Array.isArray(r?.missingWords) ? r.missingWords : [], extraWords: Array.isArray(r?.extraWords) ? r.extraWords : [], overallFeedback: r?.overallFeedback || ''
      };
    });
  }

  return { generateSentence, fallbackSentence, gradeTranslation, gradeMultipleTranslations, fallbackGrade, testConnection, getApiKey, setApiKey, getModel, generateWorksheetSentences, fallbackWorksheetSentences };
})();
/* ---------------------------- Text to speech ---------------------------- */
function speak(text) {
  try {
    if (!text) return false;
    const url = `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=en-GB&q=${encodeURIComponent(text)}`;
    const audio = new Audio(url);
    
    audio.play().catch(() => {
      fallbackSpeak(text);
    });
    return true;
  } catch (e) {
    fallbackSpeak(text);
    return false;
  }
}

function fallbackSpeak(text) {
  if (!('speechSynthesis' in window)) {
    toast('Trình duyệt không hỗ trợ phát âm');
    return false;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB';
  u.rate = 0.9;
  
  const voices = window.speechSynthesis.getVoices();
  const bestVoice = voices.find(v => v.name.includes('Google UK English')) || 
                    voices.find(v => v.name.includes('Google') && v.lang.includes('en')) || 
                    voices.find(v => v.name.includes('Natural') && v.lang.includes('en'));
                    
  if (bestVoice) u.voice = bestVoice;
  window.speechSynthesis.speak(u);
}

function migrateState(state) {
  // =========================
  // State version
  // =========================
  if (state.version == null) {
    state.version = 1;
  }

  // =========================
  // Các mảng chính
  // =========================
  if (!Array.isArray(state.notebooks)) {
    state.notebooks = [];
  }

  if (!Array.isArray(state.words)) {
    state.words = [];
  }

  if (!Array.isArray(state.mergedSets)) {
    state.mergedSets = [];
  }

  if (!Array.isArray(state.translationHistory)) {
    state.translationHistory = [];
  }

  if (!Array.isArray(state.practiceSessions)) {
    state.practiceSessions = [];
  }

  // =========================
  // Settings
  // =========================
  state.settings ||= {};

  state.settings.dailyGoal ??= 20;
  state.settings.autoTTS ??= true;
  state.settings.googleApiKey ??= '';
  state.settings.googleModel ??= 'gemini-flash-latest';

  // =========================
  // UI
  // =========================
  state.ui ||= {};

  state.ui.page ||= 'dashboard';
  state.ui.worksheetSession ??= null;
  state.ui.practiceSession ??= null;
  state.ui.flashSession ??= null;

  state.ui.notebooksUi ||= {};
  state.ui.notebooksUi.selected ??= null;
  state.ui.notebooksUi.search ??= '';
  state.ui.notebooksUi.statusFilter ??= 'all';
  state.ui.notebooksUi.posFilter ??= 'all';

  // =========================
  // Words / SRS
  // =========================
  state.words.forEach(word => {
    if (word.english == null) word.english = '';
    if (word.vietnamese == null) word.vietnamese = '';
    if (word.pos == null) word.pos = '';
    if (word.example == null) word.example = '';
    if (word.pronunciation == null) word.pronunciation = '';
    if (word.note == null) word.note = '';

    ensureSrs(word);
    word.srs.level = Number.isFinite(Number(word.srs.level)) ? Math.max(0, Math.min(SRS_LEVELS_DAYS.length-1, Number(word.srs.level))) : 0;
    word.srs.correct = Number.isFinite(Number(word.srs.correct)) ? Math.max(0, Number(word.srs.correct)) : 0;
    word.srs.wrong = Number.isFinite(Number(word.srs.wrong)) ? Math.max(0, Number(word.srs.wrong)) : 0;

    // Migration cho SRS history cũ
    if (!Array.isArray(word.srs.history)) {
      word.srs.history = [];
    }

    if (word.srs.history.length > 30) {
      word.srs.history = word.srs.history.slice(-30);
    }

    // Đảm bảo các trường SRS cơ bản tồn tại
    word.srs.level ??= 0;
    word.srs.correct ??= 0;
    word.srs.wrong ??= 0;
    word.srs.lastReviewed ??= null;
    word.srs.nextReview ??= new Date().toISOString();
  });

  // =========================
  // Giới hạn lịch sử cấp ứng dụng
  // =========================
  const MAX_TRANSLATION_HISTORY = 2000;
  const MAX_PRACTICE_SESSIONS = 1000;

  if (state.translationHistory.length > MAX_TRANSLATION_HISTORY) {
    state.translationHistory =
      state.translationHistory.slice(-MAX_TRANSLATION_HISTORY);
  }

  if (state.practiceSessions.length > MAX_PRACTICE_SESSIONS) {
    state.practiceSessions =
      state.practiceSessions.slice(-MAX_PRACTICE_SESSIONS);
  }

  // Version hiện tại của schema
  state.version = Math.max(state.version, 2);

  return state;
}

async function initState(){
  let loaded = await migrateLocalStorageToIndexedDB();

  if(loaded && Array.isArray(loaded.notebooks)){
    state = migrateState(loaded);

    // Lưu lại dữ liệu sau khi migration để lần sau không phải migrate lại.
    await storageSet(state);
  } else {
    state = seedState();
    await storageSet(state);
  }
}

/* ---------------------------- Data helpers ---------------------------- */
function getNotebook(id){ return state.notebooks.find(n=>n.id===id); }
function getWord(id){ return state.words.find(w=>w.id===id); }
function wordsOfNotebook(nbId){ return state.words.filter(w=>w.notebookId===nbId); }
function wordsOfMergedSet(setId){
  const set = state.mergedSets.find(m=>m.id===setId);
  if(!set) return [];
  return state.words.filter(w=>set.notebookIds.includes(w.notebookId));
}
function allWords(){ return state.words; }

function wordsFromSource(source){
  if(!source || source.type==='all') return allWords();
  if(source.type==='notebook') return wordsOfNotebook(source.id);
  if(source.type==='merged') return wordsOfMergedSet(source.id);
  return [];
}
function sourceLabel(source){
  if(!source || source.type==='all') return 'Tất cả các từ';
  if(source.type==='notebook'){ const nb=getNotebook(source.id); return nb? 'Notebook: '+nb.name : '(đã xoá)'; }
  if(source.type==='merged'){ const m=state.mergedSets.find(x=>x.id===source.id); return m? 'Bộ gộp: '+m.name : '(đã xoá)'; }
  return '';
}
function sourceOptionsHtml(selectedVal){
  let html = `<option value="all"${selectedVal==='all'?' selected':''}>Tất cả các từ (${allWords().length})</option>`;
  if(state.notebooks.length){
    html += `<optgroup label="Notebook">`;
    state.notebooks.forEach(nb=>{
      const v='notebook:'+nb.id;
      html += `<option value="${v}"${selectedVal===v?' selected':''}>${escapeHtml(nb.name)} (${wordsOfNotebook(nb.id).length})</option>`;
    });
    html += `</optgroup>`;
  }
  if(state.mergedSets.length){
    html += `<optgroup label="Bộ học gộp">`;
    state.mergedSets.forEach(m=>{
      const v='merged:'+m.id;
      html += `<option value="${v}"${selectedVal===v?' selected':''}>${escapeHtml(m.name)} (${wordsOfMergedSet(m.id).length})</option>`;
    });
    html += `</optgroup>`;
  }
  return html;
}
function parseSourceValue(val){
  if(!val || val==='all') return {type:'all'};
  const [type,id]=val.split(':');
  return {type, id};
}

/* ---------------------------- CRUD: Notebooks ---------------------------- */
function createNotebook(data){
  const nb = { id:uid('nb'), name:data.name.trim(), color:data.color||'#2F5D62', description:(data.description||'').trim(), createdAt:new Date().toISOString() };
  state.notebooks.push(nb);
  persist();
  return nb;
}
function updateNotebook(id, data){
  const nb=getNotebook(id); if(!nb) return;
  nb.name=data.name.trim(); nb.color=data.color||nb.color; nb.description=(data.description||'').trim();
  persist();
}
function deleteNotebook(id){
  state.words = state.words.filter(w=>w.notebookId!==id);
  state.notebooks = state.notebooks.filter(n=>n.id!==id);
  state.mergedSets.forEach(m=>{ m.notebookIds = m.notebookIds.filter(x=>x!==id); });
  state.mergedSets = state.mergedSets.filter(m=>m.notebookIds.length>0);
  persist();
}

/* ---------------------------- CRUD: Words ---------------------------- */
function createWord(notebookId, data){
  const w = {
    id: uid('w'), notebookId,
    english:data.english.trim(), vietnamese:data.vietnamese.trim(),
    pos:data.pos||'', example:(data.example||'').trim(),
    pronunciation:(data.pronunciation||'').trim(), note:(data.note||'').trim(),
    createdAt:new Date().toISOString(), srs:newSrs()
  };
  state.words.push(w);
  persist();
  return w;
}
function updateWord(id, data){
  const w=getWord(id); if(!w) return;
  w.english=data.english.trim(); w.vietnamese=data.vietnamese.trim();
  w.pos=data.pos||''; w.example=(data.example||'').trim();
  w.pronunciation=(data.pronunciation||'').trim(); w.note=(data.note||'').trim();
  if(data.notebookId) w.notebookId=data.notebookId;
  persist();
}
function deleteWord(id){
  state.words = state.words.filter(w=>w.id!==id);
  persist();
}

/* ---------------------------- CRUD: Merged sets ---------------------------- */
function createMergedSet(name, notebookIds){
  const m = { id:uid('ms'), name:name.trim(), notebookIds:[...notebookIds], createdAt:new Date().toISOString() };
  state.mergedSets.push(m);
  persist();
  return m;
}
function deleteMergedSet(id){
  state.mergedSets = state.mergedSets.filter(m=>m.id!==id);
  persist();
}

/* ---------------------------- Stats helpers ---------------------------- */
function wordCounts(words){
  const c={new:0, learning:0, due:0, mastered:0};
  words.forEach(w=>{ c[statusOf(w)]++; });
  return c;
}
function overallAccuracy(words){
  let correct=0, wrong=0;
  words.forEach(w=>{ const s=ensureSrs(w); correct+=s.correct; wrong+=s.wrong; });
  const total=correct+wrong;
  return total? Math.round(correct/total*100) : 0;
}
function activityLast14Days(){
  const days=[];
  for(let i=13;i>=0;i--){
    const d=daysAgo(i);
    const key=d.toDateString();
    let count=0;
    state.words.forEach(w=>{
      (ensureSrs(w).history||[]).forEach(h=>{ if(new Date(h.date).toDateString()===key) count++; });
    });
    state.translationHistory.forEach(t=>{ if(new Date(t.date).toDateString()===key) count++; });
    days.push({date:d, count});
  }
  return days;
}

      <div class="stat-tile"><div class="num" style="color:var(--bad)">${dueCount}</div><div class="lbl">Từ cần ôn hôm nay</div></div>
      <div class="stat-tile"><div class="num">${state.translationHistory.length}</div><div class="lbl">Câu đã luyện dịch</div></div>
    </div>

    <div class="grid grid-2" style="align-items:start;">

        <div class="chart-bars">

        </div>
      </div>

      <div class="card">
        <h3 style="font-size:15px;">Phân bổ trạng thái từ</h3>
        <div class="stack-bar">
          ${stackSegs.map(s=>`<div style="width:${s.val/total*100}%;background:${s.color}" title="${s.label}: ${s.val}"></div>`).join('')}
        </div>
        <div class="stack-legend">

function renderNotebookDetail(nbId){
  const nb = getNotebook(nbId);
  if(!nb){ state.ui.notebooksUi.selected=null; return renderNotebookList(); }
  const ui = state.ui.notebooksUi;
  let words = wordsOfNotebook(nbId);

  if(ui.search){
    const q = normalizeLoose(ui.search);
    words = words.filter(w=> normalizeLoose(w.english).includes(q) || normalizeLoose(w.vietnamese).includes(q));
  }
  if(ui.statusFilter && ui.statusFilter!=='all'){
    words = words.filter(w=>statusOf(w)===ui.statusFilter);
  }
  if(ui.posFilter && ui.posFilter!=='all'){
    words = words.filter(w=>w.pos===ui.posFilter);
  }
  const posSet = [...new Set(wordsOfNotebook(nbId).map(w=>w.pos).filter(Boolean))];

  const statusBadge = (w)=>{
    const s=statusOf(w);
    const map={new:['Mới','badge-new'],learning:['Đang học','badge-learning'],due:['Cần ôn','badge-due'],mastered:['Thành thạo','badge-mastered']};
    return `<span class="badge ${map[s][1]}">${map[s][0]}</span>`;

  const html = `
    <div class="page-head">
      <div>
        <button class="btn btn-ghost btn-sm" data-act="back" style="margin-bottom:8px;padding-left:0;">← Tất cả Notebook</button>

        <p>${escapeHtml(nb.description||'')} · ${wordsOfNotebook(nbId).length} từ</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn" data-act="export-nb">Xuất CSV</button>
        <button class="btn" data-act="learn-nb">Học nhóm này</button>
        <button class="btn btn-primary" data-act="new-word">+ Từ mới</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="nb-search" placeholder="Tìm từ tiếng Anh hoặc tiếng Việt..." value="${escapeHtml(ui.search)}">
      </div>
      <select id="nb-status-filter">
        <option value="all">Tất cả trạng thái</option>
        <option value="new" ${ui.statusFilter==='new'?'selected':''}>Mới</option>
        <option value="learning" ${ui.statusFilter==='learning'?'selected':''}>Đang học</option>
        <option value="due" ${ui.statusFilter==='due'?'selected':''}>Cần ôn</option>
        <option value="mastered" ${ui.statusFilter==='mastered'?'selected':''}>Thành thạo</option>
      </select>
      ${posSet.length? `<select id="nb-pos-filter">
        <option value="all">Tất cả từ loại</option>
        ${posSet.map(p=>`<option value="${escapeHtml(p)}" ${ui.posFilter===p?'selected':''}>${escapeHtml(p)}</option>`).join('')}
      </select>` : ''}
      <div class="spacer"></div>
      <span class="hint">${words.length} kết quả</span>
    </div>

    ${words.length===0? `<div class="empty-state card"><h3>Không có từ nào</h3><p>Thử thay đổi bộ lọc hoặc thêm từ mới.</p></div>` : `
    <div class="table-wrap">
      <table>
        <thead><tr><th>English</th><th>Từ loại</th><th>Nghĩa</th><th>Ví dụ</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody>
          ${words.map(w=>`
            <tr data-word="${w.id}">
              <td><b>${escapeHtml(w.english)}</b>${w.pronunciation?`<br><span class="hint">${escapeHtml(w.pronunciation)}</span>`:''}</td>
              <td>${escapeHtml(w.pos||'—')}</td>

              </td>

    root.querySelector('[data-act="export-nb"]').addEventListener('click', ()=>exportWordsCSV(wordsOfNotebook(nbId), nb.name.replace(/\s+/g,'-')));

    const sf=root.querySelector('#nb-status-filter');

    const pf=root.querySelector('#nb-pos-filter');

      row.querySelector('[data-act="speak"]').addEventListener('click', ()=>speak(getWord(id).english));

        if(confirm(`Xoá từ "${w.english}"?`)){ deleteWord(id); toast('Đã xoá từ'); render(); }
      });

  return {html, mount};
}

function exportWordsCSV(words, filenameBase){
  const header=['Notebook','English','Vietnamese','PartOfSpeech','Example','Pronunciation','Note'];
  const lines=[header.map(csvEscape).join(',')];
  words.forEach(w=>{
    const nb=getNotebook(w.notebookId);
    lines.push([nb?nb.name:'', w.english, w.vietnamese, w.pos, w.example, w.pronunciation, w.note].map(csvEscape).join(','));
  });
  downloadTextFile(`${filenameBase||'tu-vung'}-${new Date().toISOString().slice(0,10)}.csv`, '\uFEFF'+lines.join('\n'), 'text/csv;charset=utf-8');
  toast('Đã xuất file CSV');
}

function openImportForm(){
  openModal(`
    <div class="modal-head"><h3>Nhập từ vựng từ CSV</h3><button class="modal-close" data-close>&times;</button></div>
    <p class="hint">File CSV cần có các cột: <b>English, Vietnamese</b> (bắt buộc), và tuỳ chọn: Notebook, PartOfSpeech, Example, Pronunciation, Note.</p>
    <div class="field"><label>Chọn file CSV *</label><input type="file" id="csv-file" accept=".csv,text/csv"></div>
    <div class="field"><label>Notebook đích (dùng khi dòng không có cột Notebook, hoặc notebook đó chưa tồn tại)</label>
      <select id="csv-target-nb">
        <option value="__new__">+ Tạo notebook mới từ tên file</option>
        ${state.notebooks.map(n=>`<option value="${n.id}">${escapeHtml(n.name)}</option>`).join('')}
      </select>
    </div>
    <div id="csv-preview" class="hint"></div>
    <div class="modal-actions">
      <button type="button" class="btn" data-close>Huỷ</button>
      <button type="button" class="btn btn-primary" id="csv-import-btn" disabled>Nhập dữ liệu</button>
    </div>
  `);
  const box=document.getElementById('modal-box');
  box.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
  let parsedRows=null, headerIdx=null, fileBase='nhap-tu';
  box.querySelector('#csv-file').addEventListener('change', (e)=>{
    const file=e.target.files[0]; if(!file) return;
    fileBase=file.name.replace(/\.csv$/i,'');
    const reader=new FileReader();
    reader.onload=()=>{
      const rows=parseCSV(reader.result);
      if(rows.length<2){ toast('File CSV không có dữ liệu'); return; }
      const header=rows[0].map(h=>h.trim().toLowerCase());
      const idx={
        notebook: header.indexOf('notebook'),
        english: header.indexOf('english'),
        vietnamese: header.indexOf('vietnamese'),
        pos: header.indexOf('partofspeech'),
        example: header.indexOf('example'),
        pronunciation: header.indexOf('pronunciation'),
        note: header.indexOf('note')
      };
      if(idx.english<0 || idx.vietnamese<0){ toast('File CSV cần có cột English và Vietnamese'); return; }
      parsedRows=rows.slice(1).filter(r=>r[idx.english] && r[idx.english].trim());
      headerIdx=idx;
      box.querySelector('#csv-preview').textContent = `Tìm thấy ${parsedRows.length} từ hợp lệ trong file.`;
      box.querySelector('#csv-import-btn').disabled=false;
    };
    reader.readAsText(file, 'UTF-8');
  });
  box.querySelector('#csv-import-btn').addEventListener('click', ()=>{
    if(!parsedRows) return;
    const targetSel = box.querySelector('#csv-target-nb').value;
    let added=0;
    const nameToNbId = {};
    state.notebooks.forEach(n=>{ nameToNbId[n.name.toLowerCase()]=n.id; });
    parsedRows.forEach(r=>{
      let nbId;
      const rowNbName = headerIdx.notebook>=0 ? (r[headerIdx.notebook]||'').trim() : '';
      if(rowNbName){
        nbId = nameToNbId[rowNbName.toLowerCase()];
        if(!nbId){ const nb=createNotebook({name:rowNbName, color:pick(NB_COLORS)}); nbId=nb.id; nameToNbId[rowNbName.toLowerCase()]=nb.id; }
      } else if(targetSel==='__new__'){
        if(!nameToNbId[fileBase.toLowerCase()]){ const nb=createNotebook({name:fileBase, color:pick(NB_COLORS)}); nameToNbId[fileBase.toLowerCase()]=nb.id; }
        nbId = nameToNbId[fileBase.toLowerCase()];
      } else {
        nbId = targetSel;
      }
      createWord(nbId, {
        english: r[headerIdx.english]||'',
        vietnamese: r[headerIdx.vietnamese]||'',
        pos: headerIdx.pos>=0 ? (r[headerIdx.pos]||'') : '',
        example: headerIdx.example>=0 ? (r[headerIdx.example]||'') : '',
        pronunciation: headerIdx.pronunciation>=0 ? (r[headerIdx.pronunciation]||'') : '',
        note: headerIdx.note>=0 ? (r[headerIdx.note]||'') : ''
      });
      added++;
    });
    toast(`Đã nhập ${added} từ`);
    closeModal(); render();
  });
}

   PAGE: PRACTICE (Kiểm tra từ)

const PRACTICE_MODES = [
  {id:'vi2en', label:'Việt → Anh'},
  {id:'en2vi', label:'Anh → Việt'},
  {id:'mcq', label:'Trắc nghiệm'},
  {id:'fill', label:'Điền từ vào câu'},
  {id:'listen', label:'Nghe → đoán nghĩa'},
  {id:'write', label:'Nghĩa → viết từ'}
];

PAGES.practice = function(){
  const sess = state.ui.practiceSession;
  if(sess && sess.phase==='active') return renderPracticeSession();
  if(sess && sess.phase==='summary') return renderPracticeSummary();
  return renderPracticeSetup();
};

function renderPracticeSetup(){
  const prefill = state.ui.practicePrefill;
  const selectedSourceVal = prefill ? (prefill.type==='all'?'all':prefill.type+':'+prefill.id) : 'all';
  const autoStart = state.ui.practiceAutoStart;
  state.ui.practicePrefill=null; state.ui.practiceAutoStart=false;

  const html = `
    <div class="page-head"><div><h2>Kiểm tra từ vựng</h2><p>Chọn nguồn từ và dạng bài để bắt đầu luyện tập.</p></div></div>
    <div class="card" style="max-width:640px;">
      <div class="field"><label>Nguồn từ vựng</label>
        <select id="p-source">${sourceOptionsHtml(selectedSourceVal)}</select>
      </div>
      <div class="field-row">
        <div class="field"><label>Số lượng từ</label><input type="number" id="p-count" min="1" max="200" value="10"></div>
        <div class="field" style="display:flex;align-items:flex-end;padding-bottom:9px;">
          <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:13.5px;color:var(--ink);">
            <input type="checkbox" id="p-prioritize" checked style="width:auto;"> Ưu tiên từ sai / lâu chưa ôn
          </label>
        </div>
      </div>
      <div class="field"><label>Dạng luyện tập</label>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${PRACTICE_MODES.map(m=>`<label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:13.5px;"><input type="checkbox" class="p-mode" value="${m.id}" checked style="width:auto;"> ${m.label}</label>`).join('')}
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="p-start" style="margin-top:6px;">Bắt đầu luyện tập</button>
    </div>
  `;
  const mount=(root)=>{
    const startBtn=root.querySelector('#p-start');
    const doStart=()=>{
      const source = parseSourceValue(root.querySelector('#p-source').value);
      let pool = wordsFromSource(source);
      if(pool.length===0){ toast('Nguồn từ vựng này chưa có từ nào'); return; }
      const count = Math.max(1, Math.min(200, parseInt(root.querySelector('#p-count').value)||10));
      const prioritize = root.querySelector('#p-prioritize').checked;
      const modes = [...root.querySelectorAll('.p-mode:checked')].map(c=>c.value);
      if(modes.length===0){ toast('Chọn ít nhất 1 dạng luyện tập'); return; }
      const queueWords = buildQueue(pool, count, prioritize);
      const questions = queueWords.map(w=>buildQuestion(w, modes, pool));
      state.ui.practiceSession = { phase:'active', index:0, questions, answers:[], modes, source, answered:false };
      render();
    };
    startBtn.addEventListener('click', doStart);
    if(autoStart) doStart();
  };
  return {html, mount};
}

function buildQuestion(word, modes, pool){
  const mode = pick(modes);
  const q = { wordId: word.id, mode };
  if(mode==='mcq' || mode==='listen'){
    const direction = mode==='listen' ? 'en2vi' : (Math.random()<0.5?'en2vi':'vi2en');
    q.direction = direction;
    const correctVal = direction==='en2vi' ? word.vietnamese : word.english;
    const distractorPool = shuffleArray(pool.filter(w=>w.id!==word.id));
    const distractors = [];
    const seen = new Set([normalizeAnswer(correctVal)]);
    for(const candidate of distractorPool){
      const value = direction==='en2vi' ? candidate.vietnamese : candidate.english;
      const key = normalizeAnswer(value);
      if(!key || seen.has(key)) continue;
      seen.add(key);
      distractors.push(value);
      if(distractors.length>=3) break;
    }
    q.options = shuffleArray([correctVal, ...distractors]);
  }
  if(mode === 'fill'){
  const ex = word.example || '';

  const escapedWord = word.english.replace(
    /[.*+?^${}()|[\]\\]/g,
    '\\$&'
  );

  const re = new RegExp(
    `(^|\\s)${escapedWord}(?=\\s|[.,!?;:]|$)`,
    'i'
  );

  if(ex && re.test(ex)){
    q.sentence = ex.replace(re, '$1_____');
  } else {
    q.mode = 'vi2en';
  }
}
  return q;
}

  const pct = Math.round(sess.index/sess.questions.length*100);
  const modeLabel = PRACTICE_MODES.find(m=>m.id===q.mode)?.label || q.mode;

  let bodyHtml='';
  if(q.mode==='vi2en'){
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>

    `;

      <div class="q-prompt">${escapeHtml(word.english)}</div>
      <div class="q-sub">${escapeHtml(word.pronunciation||'')}</div>

      <button class="btn btn-primary btn-block" id="q-submit" style="margin-top:16px;">Kiểm tra</button>
    `;
  } else if(q.mode==='write'){

      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt">${escapeHtml(word.vietnamese)}</div>
      <div class="q-sub">${escapeHtml([word.pos, word.note].filter(Boolean).join(' · ')||'Viết từ tiếng Anh tương ứng')}</div>
      <input type="text" class="q-input" id="q-answer" placeholder="Viết từ tiếng Anh..." autocomplete="off">
      <button class="btn btn-primary btn-block" id="q-submit" style="margin-top:16px;">Kiểm tra</button>
    `;
  } else if(q.mode==='fill'){
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt" style="font-size:19px;">${escapeHtml(q.sentence)}</div>
      <div class="q-sub">Nghĩa: ${escapeHtml(word.vietnamese)}</div>
      <input type="text" class="q-input" id="q-answer" placeholder="Điền từ còn thiếu..." autocomplete="off">
      <button class="btn btn-primary btn-block" id="q-submit" style="margin-top:16px;">Kiểm tra</button>
    `;
  } else if(q.mode==='mcq'){
    const promptText = q.direction==='en2vi' ? word.english : word.vietnamese;
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <div class="q-prompt">${escapeHtml(promptText)}</div>
      <div class="q-sub">${q.direction==='en2vi'?'Chọn nghĩa tiếng Việt đúng':'Chọn từ tiếng Anh đúng'}</div>
      <div class="mcq-grid" id="q-mcq">
        ${q.options.map((o,i)=>`<button class="mcq-opt" data-val="${escapeHtml(o)}" data-i="${i}">${escapeHtml(o)}</button>`).join('')}
      </div>
    `;
  } else if(q.mode==='listen'){
    bodyHtml = `
      <div class="q-kicker">${modeLabel} · Câu ${sess.index+1}/${sess.questions.length}</div>
      <button class="speak-btn" id="q-speak" title="Nghe">🔊</button>
      <div class="q-sub">Nghe và chọn nghĩa đúng</div>
      <div class="mcq-grid" id="q-mcq">
        ${q.options.map((o,i)=>`<button class="mcq-opt" data-val="${escapeHtml(o)}" data-i="${i}">${escapeHtml(o)}</button>`).join('')}
      </div>
    `;
  }

  const html = `
    <div class="practice-wrap">
      <div class="progress-bar"><div style="width:${pct}%"></div></div>
      <div class="q-card">
        ${bodyHtml}
        <div id="q-feedback"></div>
      </div>
      <div class="session-actions">
        <button class="btn btn-ghost" id="q-quit">Thoát luyện tập</button>
      </div>
    </div>
  `;

  const mount=(root)=>{
    root.querySelector('#q-quit').addEventListener('click', ()=>{
      if(confirm('Thoát phiên luyện tập hiện tại?')){ state.ui.practiceSession=null; render(); }
    });
    const speakBtn = root.querySelector('#q-speak');
    if(speakBtn){
      if(state.settings.autoTTS) speak(word.english);
      speakBtn.addEventListener('click', ()=>speak(word.english));
    }

    const finishAnswer = (isCorrect, userVal)=>{
      updateSrs(word, isCorrect,q.mode);
      sess.answers.push({wordId:word.id, mode:q.mode, correct:isCorrect, userVal});
      persist();
      const explainParts = [];
      if(word.pos) explainParts.push(word.pos);
      if(word.example) explainParts.push('VD: '+word.example);
      if(word.note) explainParts.push(word.note);
      const fb = root.querySelector('#q-feedback');
      fb.innerHTML = `
        <div class="feedback-panel ${isCorrect?'ok':'no'}">
          <div class="fb-title">${isCorrect?'✓ Chính xác!':'✗ Chưa đúng'}</div>
          <div class="fb-body"><b>${escapeHtml(word.english)}</b> — ${escapeHtml(word.vietnamese)}${explainParts.length?'<br><span style="color:var(--ink-soft)">'+escapeHtml(explainParts.join(' · '))+'</span>':''}</div>
        </div>
        <button class="btn btn-primary btn-block" id="q-next" style="margin-top:14px;">${sess.index+1>=sess.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>
      `;
      root.querySelectorAll('.mcq-opt').forEach(b=>b.setAttribute('disabled','true'));
      const input=root.querySelector('#q-answer'); if(input) input.setAttribute('disabled','true');
      const sub=root.querySelector('#q-submit'); if(sub) sub.remove();
      fb.querySelector('#q-next').addEventListener('click', ()=>{
        sess.index++;
        if(sess.index>=sess.questions.length){
          const total=sess.answers.length, correct=sess.answers.filter(a=>a.correct).length;
          state.practiceSessions.push({id:uid('ps'), date:new Date().toISOString(), modes:sess.modes, total, correct, answers:sess.answers});
          if(state.practiceSessions.length > 1000){
            state.practiceSessions =
              state.practiceSessions.slice(-1000);
          }
          persist();
          sess.phase='summary';
        }
        render();
      });
      fb.querySelector('#q-next').focus();
    };

    if(q.mode==='mcq' || q.mode==='listen'){
      const correctVal = q.direction==='en2vi' ? word.vietnamese : word.english;
      root.querySelectorAll('.mcq-opt').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const val=btn.getAttribute('data-val');
          const isCorrect = val===correctVal;
          root.querySelectorAll('.mcq-opt').forEach(b=>{
            if(b.getAttribute('data-val')===correctVal) b.classList.add('correct');
          });
          if(!isCorrect) btn.classList.add('wrong');
          finishAnswer(isCorrect, val);
        });
      });
    } else {
      const input = root.querySelector('#q-answer');
      const submit = root.querySelector('#q-submit');
      const checkAns = ()=>{
        const val = input.value;
        let isCorrect=false;
        if(q.mode==='en2vi'){
          isCorrect = answerMatches(val, word.vietnamese.split(/[\/,;]/), true);
        } else {
          isCorrect = answerMatches(val, word.english.split('/'), false);
        }
        finishAnswer(isCorrect, val);
      };
      submit.addEventListener('click', checkAns);
      input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); checkAns(); } });
      input.focus();
    }
  };
  return {html, mount};
}

  const html = `

async function generateNewSentence(root){
  const t = state.ui.translateUi;
  const source = parseSourceValue(t.source);
  const pool = wordsFromSource(source);
  if(pool.length===0){ toast('Nguồn từ vựng này chưa có từ nào'); return; }
  const targetWords = buildQueue(pool, t.perSentence, true);
  const genBtn = root.querySelector('#t-generate');
  genBtn.disabled=true; genBtn.textContent='Đang tạo câu...';
  const recent = state.translationHistory.slice(-10).map(h=>h.vietnamese);
  let data, aiOk=true, aiError='';
  try{
    data = await AIModule.generateSentence(targetWords, recent);
  }catch(e){
    aiOk=false;
    aiError = e?.message || 'Lỗi không xác định khi gọi AI';
    console.error('Lỗi tạo câu bằng AI:', e);
    data = AIModule.fallbackSentence(targetWords);
  }
  t.current = { vietnamese:data.vietnamese, targetWords: targetWords.map(w=>w.english), hint:data.hint||'', result:null, aiError };
  t.aiOk = aiOk;
  genBtn.disabled=false; genBtn.textContent='✨ Tạo câu mới';
  renderTranslateArea(root);
}

function renderTranslateArea(root){
  const t = state.ui.translateUi;
  const area = root.querySelector('#t-area');
  if(!t.current){ area.innerHTML=''; return; }
  const c = t.current;
  if(!c.result){
    area.innerHTML = `
      ${!t.aiOk? `<div class="banner banner-warn">⚠️ Không thể kết nối AI để tạo câu — đang dùng câu mẫu cơ bản.<br><small style="opacity:.85">Chi tiết: ${escapeHtml(c.aiError || 'Không rõ nguyên nhân')}</small></div>` : ''}
      <div class="sentence-card">
        <div class="sentence-vi">"${escapeHtml(c.vietnamese)}"</div>
        
        <div style="margin-bottom: 16px;">
          <button type="button" class="btn btn-sm btn-ghost t-hint-btn" style="color:var(--ink-soft); font-weight:normal; padding: 4px 8px;">💡 Nhấn để xem từ gợi ý</button>
          <div class="target-chips t-hint-content hidden" style="margin-top:8px;">${c.targetWords.map(w=>`<span class="chip">${escapeHtml(w)}</span>`).join('')}</div>
        </div>

        <div class="field"><label>Bản dịch tiếng Anh của bạn</label><textarea id="t-answer" placeholder="Nhập câu tiếng Anh..." rows="3" spellcheck="false"></textarea></div>
        <button class="btn btn-primary" id="t-submit">Nộp bài</button>
      </div>
    `;
    root.querySelector('#t-submit').addEventListener('click', ()=>submitTranslation(root));
    const hintBtn = root.querySelector('.t-hint-btn');
    if(hintBtn) {
