function showAppScreen(){
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('apikey-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
}

function authErr(msg){
  const el = document.getElementById('auth-error');
  if(!msg){ el.classList.add('hidden'); el.textContent=''; return; }
  el.textContent = msg; el.classList.remove('hidden');
}
function friendlyAuthError(code){
  const map = {
    'auth/invalid-email':'Email không hợp lệ.',
    'auth/user-not-found':'Không tìm thấy tài khoản với email này.',
    'auth/wrong-password':'Sai mật khẩu.',
    'auth/invalid-credential':'Email hoặc mật khẩu không đúng.',
    'auth/email-already-in-use':'Email này đã được đăng ký.',
    'auth/weak-password':'Mật khẩu cần ít nhất 6 ký tự.',
    'auth/popup-closed-by-user':'Bạn đã đóng cửa sổ đăng nhập Google.',
    'auth/network-request-failed':'Lỗi mạng, vui lòng thử lại.'
  };
  return map[code] || ('Có lỗi xảy ra: ' + code);
}

let authMode = 'login';
function initAuthScreen(){
  const tabs = document.querySelectorAll('[data-authtab]');
  const submitBtn = document.getElementById('auth-submit');
  tabs.forEach(t=>t.addEventListener('click', ()=>{
    authMode = t.getAttribute('data-authtab');
    tabs.forEach(x=>x.classList.toggle('active', x===t));
    submitBtn.textContent = authMode==='login' ? 'Đăng nhập' : 'Tạo tài khoản';
    authErr(null);
  }));

  document.getElementById('auth-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    authErr(null);
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    submitBtn.disabled = true;
    try{
      if(authMode==='login'){
        await fbAuth.signInWithEmailAndPassword(email, password);
      } else {
        await fbAuth.createUserWithEmailAndPassword(email, password);
      }
    }catch(err){
      authErr(friendlyAuthError(err.code));
    }finally{
      submitBtn.disabled = false;
    }
  });

  document.getElementById('auth-google').addEventListener('click', async ()=>{
    authErr(null);
    try{
      await fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    }catch(err){
      authErr(friendlyAuthError(err.code));
    }
  });

  document.getElementById('auth-forgot').addEventListener('click', async ()=>{
    const email = document.getElementById('auth-email').value.trim();
    if(!email){ authErr('Nhập email ở trên rồi bấm "Quên mật khẩu?" để nhận link đặt lại.'); return; }
    try{
      await fbAuth.sendPasswordResetEmail(email);
      authErr(null);
      toast('Đã gửi email đặt lại mật khẩu');
    }catch(err){
      authErr(friendlyAuthError(err.code));
    }
  });
}

async function logout(){
  if(cloudUnsub){ cloudUnsub(); cloudUnsub = null; }
  await fbAuth.signOut();
}

function apikeyErr(msg){
  const el = document.getElementById('apikey-error');
  if(!msg){ el.classList.add('hidden'); el.textContent=''; return; }
  el.textContent = msg; el.classList.remove('hidden');
}
function initApiKeyScreen(){
  const form = document.getElementById('apikey-form');
  const input = document.getElementById('apikey-input');
  const submitBtn = document.getElementById('apikey-submit');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    apikeyErr(null);
    const key = input.value.trim();
    if(!key){ apikeyErr('Vui lòng nhập API Key.'); return; }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Đang kiểm tra...';
    const previousKey = AIModule.getApiKey();
    AIModule.setApiKey(key);
    try{
      await AIModule.testConnection();
      persist();
      input.value = '';
      showAppScreen();
      render();
    }catch(err){
      AIModule.setApiKey(previousKey);
      apikeyErr('Key không hợp lệ hoặc không kết nối được: ' + err.message);
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = 'Xác nhận & vào ứng dụng';
    }
  });
}

/* ---------------------------- Utils ---------------------------- */
function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function sample(arr,n){ return shuffleArray([...arr]).slice(0,n); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function fmtDate(iso){
  if(!iso) return '—';
  const d=new Date(iso);
  return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateShort(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});
}
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); d.setHours(0,0,0,0); return d; }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function normalizeLoose(s){
  return String(s||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[.,!?;:"']/g,'');
}
function clampScore(value, fallback=50){ const n=Number(value); return Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):fallback; }
function normalizeWordText(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function sanitizeGeneratedVietnamese(text, words){
  let out=String(text||'').normalize('NFC');
  for(const w of (words||[])){
    const en=String(w?.english||'').trim(), vi=String(w?.vietnamese||'').trim();
    if(!en || !vi) continue;
    out=out.replace(new RegExp(`\\b${escapeRegExp(en)}\\b`,'gi'), vi);
  }
  return out;
}
function normalizeAnswer(s){
  return normalizeWordText(s).normalize('NFC')
    .replace(/[.,!?;:"'“”‘’()\[\]{}]/g,'')
    .replace(/[-–—]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function escapeRegExp(s){ return String(s||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function containsWholeWord(text, term){
  const t=normalizeAnswer(text), q=normalizeAnswer(term);
  if(!t || !q) return false;
  return new RegExp(`(?:^|\\s)${escapeRegExp(q)}(?:$|\\s)`,'i').test(t);
}
function answerMatches(userAnswer, acceptedAnswers, allowPhraseContainment=false){
  const user=normalizeAnswer(userAnswer);
  if(!user) return false;
  const answers=(Array.isArray(acceptedAnswers)?acceptedAnswers:[acceptedAnswers])
    .flatMap(x=>String(x||'').split('/')).map(normalizeAnswer).filter(Boolean);
  return answers.some(a => user===a || (allowPhraseContainment && user.length>1 && (user.includes(a) || a.includes(user))));
}
function acceptedEnglishAnswers(word){
  const main = String(word && word.english || '').split('/');
  const syn = String(word && word.synonyms || '').split(/[,/]+/);
  return [...main, ...syn].map(s=>s.trim()).filter(Boolean);
}

function validateStateShape(data){ return !!data && typeof data==='object' && Array.isArray(data.notebooks) && Array.isArray(data.words) && Array.isArray(data.mergedSets) && Array.isArray(data.translationHistory) && Array.isArray(data.practiceSessions); }
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove('show'), 2200);
}
function debounce(fn,ms){
  let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); };
}

/* ---------------------------- CSV helpers ---------------------------- */
function csvEscape(v){
  v = v==null ? '' : String(v);
  if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function parseCSV(text){
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; }
      } else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1 || (r.length===1 && r[0]!==''));
}
function downloadTextFile(filename, content, mime){
  const blob=new Blob([content], {type:mime||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
}

/* ---------------------------- Persistent storage ---------------------------- */
const DB_NAME = 'SoTuDB';
const DB_VERSION = 1;
const DB_STORE = 'app';
const STORAGE_KEY = 'app-state-v1';

function canUseIndexedDB(){
  return location.protocol !== 'file:' && typeof indexedDB !== 'undefined';
}

function openDatabase(){
  return new Promise((resolve, reject) => {
    try{
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = () => {
        const db = request.result;
        if(!db.objectStoreNames.contains(DB_STORE)){
          db.createObjectStore(DB_STORE);
        }
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Không mở được IndexedDB'));
      request.onblocked = () => reject(new Error('IndexedDB đang bị chặn'));
    }catch(e){
      reject(e);
    }
  });
}

async function storageGet(){
  if(!canUseIndexedDB()){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){
      console.error('Lỗi đọc localStorage:', e);
      return null;
    }
  }

  try{
    const db = await openDatabase();

    return await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const store = tx.objectStore(DB_STORE);
      const request = store.get('state');

      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
      tx.oncomplete = () => db.close();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){
    console.warn('IndexedDB không khả dụng, chuyển sang localStorage:', e);

    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(storageErr){
      console.error('Lỗi đọc fallback localStorage:', storageErr);
      return null;
    }
  }
}

async function storageSet(obj){
  if(!canUseIndexedDB()){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
      return true;
    }catch(e){
      console.error('Lỗi lưu localStorage:', e);
      return false;
    }
  }

  try{
    const db = await openDatabase();

    return await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      const store = tx.objectStore(DB_STORE);
      const request = store.put(obj, 'state');

      request.onerror = () => reject(request.error);
      tx.oncomplete = () => {
        db.close();
        resolve(true);
      };
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){
    console.warn('IndexedDB không khả dụng, lưu vào localStorage:', e);

    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
      return true;
    }catch(storageErr){
      console.error('Lỗi lưu fallback localStorage:', storageErr);
      return false;
    }
  }
}

async function migrateLocalStorageToIndexedDB(){
  if(!canUseIndexedDB()){
    return await storageGet();
  }

  try{
    const existing = await storageGet();

    if(existing){
      return existing;
    }

    const oldData = localStorage.getItem(STORAGE_KEY);

    if(!oldData){
      return null;
    }

    const parsed = JSON.parse(oldData);
    const ok = await storageSet(parsed);

    if(ok){
      console.log('✓ Đã chuyển dữ liệu từ localStorage sang IndexedDB');
    }

    return parsed;
  }catch(e){
    console.error('Lỗi chuyển dữ liệu localStorage → IndexedDB:', e);
    return null;
  }
}

let saveTimer = null;
let saveInProgress = false;
let savePending = false;

function persist(){
  clearTimeout(saveTimer);

  saveTimer = setTimeout(async () => {
    savePending = true;

    if(saveInProgress){
      return;
    }

    saveInProgress = true;

    try{
      while(savePending){
        savePending = false;

        const ok = await storageSet(state);

        if(!ok){
          toast('⚠️ Không thể lưu dữ liệu');
          break;
        }

        if(currentUser && !applyingRemoteUpdate){
          cloudSave(currentUser.uid, state);
        }
      }
    }catch(e){
      console.error('Lỗi persist:', e);
      toast('⚠️ Không thể lưu dữ liệu');
    }finally{
      saveInProgress = false;
    }
  }, 300);
}

/* ---------------------------- SRS logic ---------------------------- */
const SRS_LEVELS_DAYS=[0,1,2,4,7,14,30,60,120,240];
const SRS_SKILLS=['recognition','recall','listening','production'];
function newSkillStat(){ return {correct:0, wrong:0, lastReviewed:null}; }
function newSrs(){
  return {
    level:0, correct:0, wrong:0, lastReviewed:null, nextReview:new Date().toISOString(), history:[],
    skills:{recognition:newSkillStat(), recall:newSkillStat(), listening:newSkillStat(), production:newSkillStat()}
  };
}
function ensureSrs(word){
  if(!word.srs) word.srs=newSrs();
  word.srs.skills ||= {};
  SRS_SKILLS.forEach(k=>{ if(!word.srs.skills[k]) word.srs.skills[k]=newSkillStat(); });
  return word.srs;
}
function skillForMode(mode){
  if(['en2vi','mcq'].includes(mode)) return 'recognition';
  if(['vi2en','write','fill'].includes(mode)) return 'recall';
  if(['listen','speak'].includes(mode)) return 'listening';
  if(['translate','worksheet-translate','chat'].includes(mode)) return 'production';
  return 'recall';
}
function updateSrs(word, result, mode='unknown'){
  const s = ensureSrs(word);
  const now = new Date();
  const rating = typeof result==='string' ? result : (result ? 'good' : 'again');
  const isCorrect = rating !== 'again';
  const skillName = skillForMode(mode);
  const skill = s.skills[skillName] || (s.skills[skillName]=newSkillStat());

  if(isCorrect){ s.correct++; skill.correct++; }
  else { s.wrong++; skill.wrong++; }
  skill.lastReviewed = now.toISOString();

  let nextMs;
  if(rating==='again'){
    s.level = Math.max(0, s.level - 1);
    nextMs = 10 * 60 * 1000;
  } else if(rating==='hard'){
    const baseDays = Math.max(1, SRS_LEVELS_DAYS[Math.max(1,s.level)] || 1);
    nextMs = Math.max(12*60*60*1000, Math.round(baseDays*0.6*86400000));
  } else if(rating==='easy'){
    s.level = Math.min(SRS_LEVELS_DAYS.length - 1, s.level + 2);
    const days = Math.max(1, Math.round((SRS_LEVELS_DAYS[s.level] || 1) * 1.25));
    nextMs = days * 86400000;
  } else {
    s.level = Math.min(SRS_LEVELS_DAYS.length - 1, s.level + 1);
    nextMs = Math.max(1, SRS_LEVELS_DAYS[s.level]) * 86400000;
  }

  s.lastReviewed = now.toISOString();
  s.nextReview = new Date(now.getTime() + nextMs).toISOString();
  s.history.push({date:now.toISOString(), correct:isCorrect, rating, mode, skill:skillName});
  if(s.history.length > 60) s.history = s.history.slice(-60);
}
function isDue(word){
  const s = ensureSrs(word);
  if (s.correct + s.wrong === 0) return false;
  return new Date(s.nextReview).getTime() <= Date.now();
}
function statusOf(word){
  const s=ensureSrs(word);
  const total=s.correct+s.wrong;
  if(total===0) return 'new';
  if(isDue(word)) return 'due';
  if(s.level>=5) return 'mastered';
  return 'learning';
}
function priorityScore(word){
  const s=ensureSrs(word);
  const now=Date.now();
  const overdueDays=Math.max(0,(now-new Date(s.nextReview).getTime())/86400000);
  const total=s.correct+s.wrong;
  const errorRate=total?s.wrong/total:0.5;
  const recall=s.skills?.recall||newSkillStat();
  const production=s.skills?.production||newSkillStat();
  const rt=recall.correct+recall.wrong, pt=production.correct+production.wrong;
  const recallPenalty=rt?recall.wrong/rt*15:8;
  const productionPenalty=pt?production.wrong/pt*12:6;
  let score=overdueDays*3+errorRate*40+recallPenalty+productionPenalty;
  if(total===0) score+=55;
  return score;
}
function buildQueue(wordPool,count,prioritize){
  let pool=wordPool.filter(Boolean);
  if(prioritize){
    pool.sort((a,b)=>priorityScore(b)-priorityScore(a));
    const urgent=pool.slice(0,Math.ceil(count*0.7));
    const exploration=sample(pool.slice(Math.ceil(count*0.7)),count-urgent.length);
    return [...urgent,...exploration];
  }
  return sample(pool,count);
}
// Dùng riêng cho các phần tạo đề/câu: tránh việc priorityScore khiến cùng vài từ đứng đầu
// bị chọn lặp đi lặp lại mỗi lần bấm. recentEnglish là các từ vừa xuất hiện gần đây.
function buildDiverseQueue(wordPool,count,recentEnglish=[],prioritize=true){
  const pool=[...new Map((wordPool||[]).filter(Boolean).map(w=>[w.id||String(w.english||'').toLowerCase(),w])).values()];
  const n=Math.max(0,Math.min(Number(count)||0,pool.length));
  if(!n) return [];
  const recentSet=new Set((recentEnglish||[]).map(x=>String(x||'').trim().toLowerCase()).filter(Boolean));
  const fresh=pool.filter(w=>!recentSet.has(String(w.english||'').trim().toLowerCase()));
  const recent=pool.filter(w=>recentSet.has(String(w.english||'').trim().toLowerCase()));

  // Trong mỗi nhóm vẫn hơi ưu tiên từ yếu/quá hạn, nhưng thêm jitter lớn để thứ tự không cố định.
  const rank=(arr)=>[...arr].map(w=>({w,score:(prioritize?priorityScore(w):0)+Math.random()*28}))
    .sort((a,b)=>b.score-a.score).map(x=>x.w);
  const ordered=[...rank(fresh),...rank(recent)];
  return ordered.slice(0,n);
}
function weakWords(limit=8){
  return [...state.words]
    .filter(w=>{const sr=ensureSrs(w);return sr.wrong>0;})
    .sort((a,b)=>priorityScore(b)-priorityScore(a))
    .slice(0,limit);
}
function reviewedWordCountOnDate(date){
  const key=startOfDay(date).toDateString();
  let count=0;
  state.words.forEach(w=>{
    if((ensureSrs(w).history||[]).some(h=>startOfDay(h.date).toDateString()===key)) count++;
  });
  return count;
}
function buildTodayPlan(){
  const all=allWords();
  const cap=Math.min(20,Math.max(1,Number(state.settings.dailyGoal)||12));
  const selected=[], seen=new Set();
  const add=(arr,n,reason)=>{
    for(const w of arr){
      if(selected.length>=cap||n<=0) break;
      if(!w||seen.has(w.id)) continue;
      seen.add(w.id); selected.push({word:w,reason}); n--;
    }
  };
  const due=[...all].filter(isDue).sort((a,b)=>priorityScore(b)-priorityScore(a));
  const weak=weakWords(30);
  const fresh=[...all].filter(w=>{const x=ensureSrs(w);return x.correct+x.wrong===0;});
  add(due,Math.ceil(cap*0.5),'Đến hạn');
  add(weak,Math.ceil(cap*0.3),'Từ yếu');
  add(fresh,cap-selected.length,'Từ mới');
  add([...all].sort((a,b)=>priorityScore(b)-priorityScore(a)),cap-selected.length,'Ôn củng cố');
  return selected;
}

/* ---------------------------- AI module (tách riêng, dễ thay thế) ----------------------------
   Dùng Google Gemini API (generativelanguage.googleapis.com). Cần người dùng nhập Google API Key
   trong trang Cài đặt — key được lưu cùng dữ liệu ứng dụng (chỉ trên máy/tài khoản của người dùng). */
const AIModule = (function(){
  // Gemini 1.5 (và 1.0) đã bị Google khai tử hoàn toàn — gọi vào các model này chỉ nhận lỗi
  // 404, không giúp gì mà còn phí thời gian cascade. Danh sách dưới đây chỉ còn các model
  // 2.x/3.x còn đang hoạt động (khớp với danh sách chọn ở trang Cài đặt).
  const FALLBACK_MODELS = [
    'gemini-3.5-flash-lite',
    'gemini-3.1-flash-lite',
    'gemini-3.6-flash',
    'gemini-2.5-flash-lite'
  ];
  const reqCache = new Map();
  let activeRequest = null;

  function getApiKey(){ return (state && state.settings && state.settings.googleApiKey) || ''; }
  function setApiKey(k){ if(state && state.settings) state.settings.googleApiKey = k || ''; }
  function getModel(){ return (state && state.settings && state.settings.googleModel) || FALLBACK_MODELS[0]; }

  async function callGemini(prompt, config = {}, retries = 1, maxModels = null) {
    if (activeRequest) activeRequest.abort();
    const key = getApiKey();
    if (!key) throw new Error('Chưa cấu hình Google API Key (vào Cài đặt để thêm)');

    const preferredModel = getModel();
    let modelsToTry = [preferredModel, ...FALLBACK_MODELS.filter(m => m !== preferredModel)];
    // maxModels giới hạn số model được thử — dùng cho các tác vụ nhẹ, tần suất cao (như tra
    // từ điển dự phòng) để KHÔNG cascade qua toàn bộ 4 model (vốn dành cho các tác vụ quan
    // trọng như chấm điểm/dịch câu), tránh việc 1 lần gọi âm thầm tốn tới nhiều request.
    if (maxModels && maxModels > 0) modelsToTry = modelsToTry.slice(0, maxModels);

    let lastError = null;

    for (const currentModel of modelsToTry) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(currentModel)}:generateContent`;
      
      for (let i = 0; i <= retries; i++) {
        const controller = new AbortController();
        activeRequest = controller;
        const timeout = setTimeout(() => controller.abort(), 15000);

        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
            body: JSON.stringify({
              contents: [{ role: 'user', parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: 'application/json', ...config }
            }),
            signal: controller.signal
          });

          if (!res.ok) {
            const errText = await res.text().catch(() => '');
            if (res.status === 401 || res.status === 403) throw new Error('Sai API Key hoặc bị khoá hoàn toàn');
            if (res.status === 429) {
              if (errText.includes('quota')) {
                console.warn(`[AI Fallback] ${currentModel} cạn hạn mức. Đang chuyển model...`);
                lastError = new Error(`Model ${currentModel} hết hạn mức`);
                break; 
              }
              if (i < retries) {
                await new Promise(r => setTimeout(r, 2000));
                continue;
              }
              break;
            }
            if (res.status >= 500 && i < retries) {
              await new Promise(r => setTimeout(r, 2000));
              continue;
            }
            throw new Error(`Lỗi ${res.status}: ${errText.slice(0, 100)}`);
          }

          const data = await res.json();
          const text = data?.candidates?.[0]?.content?.parts?.find(part => typeof part?.text === 'string')?.text;
          if (!text) throw new Error('Phản hồi rỗng');
          
          if (currentModel !== preferredModel && state && state.settings) {
            state.settings.googleModel = currentModel;
            console.log(`[AI Auto-Fix] Đã tự động chốt model đang sống: ${currentModel}`);
            persist();
          }
          
          return text;
        } catch (e) {
          lastError = e;
          if (e.message.includes('Sai API Key')) throw e;
        } finally {
          clearTimeout(timeout);
          if (activeRequest === controller) activeRequest = null;
        }
      }
    }
    
    throw lastError || new Error('Tất cả các Model AI đều đã cạn hạn mức. Vui lòng tạo Key mới hoặc thử lại vào ngày mai.');
  }

  function extractJson(text){
    try {
      const t = String(text || '').replace(/```json/gi, '').replace(/```/g, '').trim();
      const start = t.search(/[{[]/);
      const end = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
      return JSON.parse(t.substring(start, end + 1));
    } catch (e) {
      return null;
    }
  }

  async function testConnection(){
    const text = await callGemini('{"ok": true}', { temperature: 0.1 });
    const json = extractJson(text);
    if(!json) throw new Error('Phản hồi không hợp lệ');
    return true;
  }

  function normalizeTargetWords(targetWords, allowedWords){
    const lookup = new Map(allowedWords.map(w => [w.english.trim().toLowerCase(), w.english]));
    return targetWords.map(word => lookup.get(String(word).trim().toLowerCase())).filter(Boolean);
  }

  // Danh sách chủ đề/bối cảnh để ép AI đổi ngữ cảnh mỗi lần tạo câu — quan trọng khi từ cần ôn
  // (ví dụ từ quá hạn ôn tập, được ưu tiên chọn) cứ lặp lại giống nhau giữa các lần bấm "Tạo câu
  // mới": nếu không ép đổi chủ đề, AI dễ quay về đúng một khuôn câu quen thuộc cho từ đó.
  const SENTENCE_CONTEXTS = [
    'gia đình', 'công việc và văn phòng', 'trường học và học tập', 'du lịch', 'mua sắm',
    'sức khỏe và thể dục', 'thể thao', 'công nghệ', 'thời tiết', 'bạn bè', 'nấu ăn và ẩm thực',
    'giao thông', 'môi trường', 'tài chính cá nhân', 'sở thích cá nhân', 'tin tức xã hội',
    'dự án nhóm', 'cuộc sống hàng ngày', 'nhà hàng/quán ăn', 'thành phố nơi sinh sống', 'âm nhạc/phim ảnh'
  ];

  function senseContextLines(words){
    return (words||[]).map((w,i)=>{
      const en=String(w?.english||'').trim();
      const vi=String(w?.vietnamese||'').trim();
      const ex=String(w?.example||'').trim();
      const pos=String(w?.pos||'').trim();
      return `${i+1}. English: "${en}"${pos?` | POS: ${pos}`:''}${vi?` | ghi chú nghĩa đang lưu (có thể sai/literal): "${vi}"`:''}${ex?` | ví dụ đang lưu: "${ex}"`:''}`;
    }).join('\n');
  }

  // Nếu model vẫn vô tình chèn chính target English vào câu tiếng Việt, sửa lại ngay ở client.
  // Chỉ thay target được biết trước; không đụng vào phần còn lại của câu.
  function scrubTargetEnglishFromVietnamese(sentence, words){
    let out=String(sentence||'').normalize('NFC').trim();
    const sorted=[...(words||[])].sort((a,b)=>String(b?.english||'').length-String(a?.english||'').length);
    for(const w of sorted){
      const en=String(w?.english||'').trim();
      if(!en) continue;
      const firstMeaning=String(w?.vietnamese||'').split(/[;,/]/)[0].replace(/^\s+|\s+$/g,'');
      const escaped=en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re=new RegExp(`(^|[^A-Za-z])(${escaped})(?=$|[^A-Za-z])`,'gi');
      if(re.test(out)){
        re.lastIndex=0;
        out=out.replace(re,(m,prefix)=>prefix+(firstMeaning||'cụm từ này'));
      }
    }
    return out.replace(/\s+/g,' ').trim();
  }

  async function generateSentence(words, recentSentences, forcedContext){
    const recent = (recentSentences||[]).slice(-10);
    const recentText = recent.join(' | ') || '(chưa có)';
    const nonce = Math.random().toString(36).slice(2,8)+'-'+Date.now();
    const context = forcedContext || pick(SENTENCE_CONTEXTS);
    const prompt = `Bạn đang tạo BÀI TẬP DỊCH NGƯỢC Việt → Anh cho người học từ vựng.

Trước tiên hãy tự xác định NGHĨA CHUẨN của từng từ/cụm tiếng Anh bằng kiến thức từ điển của bạn và câu ví dụ nếu có. Phần "ghi chú nghĩa đang lưu" chỉ là gợi ý của người dùng, có thể bị dịch literal hoặc sai; KHÔNG được mù quáng bê nó vào câu.

Mục tiêu từ vựng:
${senseContextLines(words)}

Bối cảnh gợi ý: ${context}.

Hãy viết đúng 1 câu TIẾNG VIỆT mà khi dịch tự nhiên sang tiếng Anh, người học có lý do rõ ràng để dùng các mục tiêu trên.

Quy tắc bắt buộc:
1. Câu phải 100% tiếng Việt. TUYỆT ĐỐI không chèn target English hay code-switch kiểu "settle down", "online", "camp", "deadline", "meeting", "project".
2. Không biến nghĩa từ điển thành cụm từ cứng. Hãy tạo một tình huống thật: ai làm gì, với ai, ở đâu hoặc vì sao.
3. Nếu có phrasal verb/idiom, dùng đúng NGHĨA CỦA TOÀN CỤM và đúng cấu trúc của nó; không dịch từng chữ.
4. Nếu có 2-3 mục tiêu khó đi chung, dùng hai vế ngắn nối bằng "nhưng", "vì", "khi", "nên" thay vì nhồi chúng vào một cụm danh từ.
5. Dài khoảng 8-20 từ, tự nhiên như lời nói/viết hàng ngày của người Việt. Không văn vẻ, triết lý, khẩu hiệu, đạo đức hóa.
6. Phải khác rõ rệt về tình huống/chủ ngữ/hành động so với các câu gần đây: ${recentText}
7. Không dùng lại khuôn "lúc nào ... cũng ..." nếu một câu gần đây đã có khuôn đó. Mã chống lặp: ${nonce}.

Trả về DUY NHẤT JSON: {"vietnamese":"câu tiếng Việt tự nhiên","hint":"gợi ý cực ngắn bằng tiếng Việt"}`;
    const text = await callGemini(prompt, { temperature: 0.68 });
    const json = extractJson(text);
    if(!json || typeof json.vietnamese !== 'string' || !json.vietnamese.trim()) throw new Error('Phản hồi AI không hợp lệ');
    json.vietnamese = scrubTargetEnglishFromVietnamese(json.vietnamese, words);
    json.targetWords = words.map(w=>w.english);
    json.hint = typeof json.hint==='string' ? json.hint : '';
    return json;
  }

  // Fast path chỉ dùng cho trang Luyện dịch câu. Giữ nguyên generator cũ để các module khác không bị ảnh hưởng.
  async function generateSentenceFast(words, recentSentences, forcedContext){
    const recent=(recentSentences||[]).slice(-5).join(' | ') || '(chưa có)';
    const context=forcedContext || pick(SENTENCE_CONTEXTS);
    const targets=(words||[]).map((w,i)=>`${i+1}) ${w.english}${w.vietnamese?` | ghi chú: ${w.vietnamese}`:''}${w.example?` | ví dụ: ${w.example}`:''}`).join('\n');
    const prompt=`Tạo 1 bài dịch Việt→Anh dùng đúng các target sau. Tự hiểu nghĩa chuẩn của toàn cụm; ghi chú Việt có thể sai/literal.\n${targets}\nBối cảnh: ${context}.\nYêu cầu: câu 100% tiếng Việt, không chèn English/code-switch; 8-18 từ; tự nhiên đời thường; phrasal verb dùng nghĩa toàn cụm; khác rõ các câu gần đây: ${recent}.\nChỉ JSON: {"vietnamese":"...","hint":"gợi ý Việt rất ngắn"}`;
    try{
      const text=await callGemini(prompt,{temperature:0.62,maxOutputTokens:220},0,2);
      const json=extractJson(text);
      if(!json || typeof json.vietnamese!=='string' || !json.vietnamese.trim()) throw new Error('Phản hồi AI không hợp lệ');
      json.vietnamese=scrubTargetEnglishFromVietnamese(json.vietnamese,words);
      json.targetWords=(words||[]).map(w=>w.english);
      json.hint=typeof json.hint==='string'?json.hint:'';
      return json;
    }catch(e){
      // Chỉ khi fast path lỗi mới quay về generator cũ để giữ độ ổn định.
      return generateSentence(words,recentSentences,forcedContext);
    }
  }

  function normalizeGradeResult(json){
    const g=json||{};
    return {
      score:clampScore(g.score,50),
      suggested:typeof g.suggested==='string'?g.suggested:'',
      grammarIssues:Array.isArray(g.grammarIssues)?g.grammarIssues.slice(0,3):[],
      vocabIssues:Array.isArray(g.vocabIssues)?g.vocabIssues.slice(0,3):[],
      spellingIssues:Array.isArray(g.spellingIssues)?g.spellingIssues.slice(0,3):[],
      missingWords:Array.isArray(g.missingWords)?g.missingWords.slice(0,4):[],
      extraWords:Array.isArray(g.extraWords)?g.extraWords.slice(0,4):[],
      overallFeedback:typeof g.overallFeedback==='string'?g.overallFeedback:''
    };
  }

  // Một request làm hai việc: chấm câu hiện tại + chuẩn bị luôn câu kế tiếp.
  // Nhờ vậy sau khi xem feedback, bấm "Câu tiếp theo" gần như tức thì và không phải gọi thêm AI.
  async function gradeTranslationAndNext(vnSentence,userAnswer,targetWords,nextWords,recentSentences){
    const nextTargets=(nextWords||[]).map((w,i)=>`${i+1}) ${w.english}${w.vietnamese?` | nghĩa ghi chú: ${w.vietnamese}`:''}${w.example?` | ví dụ: ${w.example}`:''}`).join('\n');
    const recent=(recentSentences||[]).slice(-4).join(' | ') || '(chưa có)';
    const prompt=`Làm 2 việc trong 1 JSON.\nA) Chấm bản dịch Việt→Anh. VN: "${vnSentence}". Target bắt buộc: ${targetWords.join(', ')}. Bài làm: "${userAnswer}". Chấm tự nhiên, chấp nhận nhiều cách diễn đạt đúng; feedback ngắn.\nB) Tạo câu Việt→Anh kế tiếp cho target dưới đây; tự hiểu nghĩa chuẩn toàn cụm, ghi chú Việt có thể sai.\n${nextTargets || '(không có target kế tiếp)'}\nCâu mới: 100% tiếng Việt, 8-18 từ, đời thường, không chèn English/code-switch, khác các câu gần đây: ${recent}.\nChỉ JSON: {"grade":{"score":85,"suggested":"...","grammarIssues":[],"vocabIssues":[],"spellingIssues":[],"missingWords":[],"extraWords":[],"overallFeedback":"..."},"next":{"vietnamese":"...","hint":"..."}}`;
    const text=await callGemini(prompt,{temperature:0.28,maxOutputTokens:760},0,2);
    const json=extractJson(text);
    if(!json || !json.grade) throw new Error('Phản hồi AI không hợp lệ');
    const grade=normalizeGradeResult(json.grade);
    let next=null;
    if(nextWords && nextWords.length && json.next && typeof json.next.vietnamese==='string' && json.next.vietnamese.trim()){
      next={
        vietnamese:scrubTargetEnglishFromVietnamese(json.next.vietnamese,nextWords),
        hint:typeof json.next.hint==='string'?json.next.hint:'',
        targetWords:nextWords.map(w=>w.english)
      };
    }
    return {grade,next};
  }

  function fallbackSentence(words){
    const safeWords = (words || []).filter(Boolean);
    if(!safeWords.length) throw new Error('Không có từ để tạo câu mẫu');
    const targetWords = safeWords.map(w=>w.english);
    const meanings = safeWords.map(w=>String(w.vietnamese||'').split(/[;,/]/)[0].trim()).filter(Boolean);
    const topic = meanings.join(' và ') || 'những ý này';
    const templates = [
      () => `Bạn có thể kể một tình huống thực tế liên quan đến ${topic} không?`,
      () => `Trong tình huống đó, điều quan trọng nhất là ${topic}.`,
      () => `Tôi đã gặp một tình huống khiến mình phải nghĩ đến ${topic}.`,
      () => `Chuyện hôm qua làm tôi nhớ đến ${topic}.`
    ];
    return { vietnamese: pick(templates)(), targetWords, hint:'' };
  }

  async function generateWorksheetSentences(words, numSentences, recentSentences) {
    const safeWords=(words||[]).filter(Boolean);
    if(!safeWords.length) throw new Error('Không có từ để tạo câu');
    const count=Math.max(1,Math.min(Number(numSentences)||1,25));
    const recent=(recentSentences||[]).slice(-10).join(' | ') || '(chưa có)';

    // Mỗi câu chỉ ép 1 từ/cụm mục tiêu. Đây là chủ ý: phần dò bài trước đây ghép 2-3 từ
    // ngẫu nhiên nên AI tạo câu rất gượng và thường chèn nguyên tiếng Anh vào câu Việt.
    const order=[];
    while(order.length<count){
      order.push(...shuffleArray([...safeWords]));
    }
    const chosen=order.slice(0,count);
    const specs=chosen.map((w,i)=>`${i+1}. ${senseContextLines([w]).replace(/^1\.\s*/, '')}`).join('\n');

    const prompt = `Tạo ${count} câu cho bài tập dịch Việt → Anh. MỖI câu tương ứng đúng một mục từ theo số thứ tự dưới đây.

${specs}

Yêu cầu bắt buộc:
1. Với mỗi mục, tự xác định nghĩa chuẩn của English expression. "Ghi chú nghĩa đang lưu" có thể sai/literal, chỉ dùng để tham khảo; ưu tiên nghĩa từ vựng chuẩn và câu ví dụ.
2. Câu phải 100% TIẾNG VIỆT, không chèn bất kỳ target English nào. Tránh luôn code-switch kiểu online/camp/deadline/meeting/project/team nếu có từ Việt tự nhiên.
3. Không viết kiểu "Họ hỏi bao giờ tụi mình settle down". Phải diễn đạt hoàn toàn bằng tiếng Việt nhưng vẫn tạo ngữ cảnh để người học dịch lại bằng target English.
4. Phrasal verb/idiom phải dùng nghĩa toàn cụm, không dịch từng chữ.
5. Mỗi câu 7-18 từ, tình huống đời thường, chủ thể/hành động rõ. Không văn chương, khẩu hiệu, triết lý hay các cụm danh từ dài.
6. Các câu phải khác nhau về chủ ngữ, tình huống và cấu trúc; ít nhất một câu hỏi nếu count > 1.
7. Không lặp gần giống các câu: ${recent}

Trả về DUY NHẤT mảng JSON đúng ${count} phần tử: [{"slot":1,"vietnamese":"..."},{"slot":2,"vietnamese":"..."}]`;

    const text = await callGemini(prompt, { temperature: 0.66 });
    let json = extractJson(text);
    if(json && !Array.isArray(json)){
      const arrKey=Object.keys(json).find(k=>Array.isArray(json[k]));
      json=arrKey?json[arrKey]:null;
    }
    if(!Array.isArray(json)) throw new Error('AI không tạo được câu hợp lệ nào.');

    const bySlot=new Map();
    json.forEach((item,idx)=>{
      if(!item || typeof item.vietnamese!=='string' || !item.vietnamese.trim()) return;
      const slot=Math.max(1,Math.min(count,parseInt(item.slot)||idx+1));
      if(!bySlot.has(slot)) bySlot.set(slot,item.vietnamese);
    });
    const results=[];
    for(let i=0;i<count;i++){
      const raw=bySlot.get(i+1);
      if(!raw) continue;
      results.push({
        vietnamese:scrubTargetEnglishFromVietnamese(raw,[chosen[i]]),
        targetWords:[chosen[i].english]
      });
    }
    if(!results.length) throw new Error('AI không tạo được câu hợp lệ nào.');
    return results;
  }

  function fallbackWorksheetSentences(words, numSentences){
    const safe=(words||[]).filter(Boolean);
    const res=[];
    if(!safe.length) return res;
    for(let i=0;i<numSentences;i++) res.push(fallbackSentence([safe[i%safe.length]]));
    return res;
  }

  async function gradeTranslation(vnSentence, userAnswer, targetWords){
    const prompt = `Chấm điểm dịch Việt-Anh. VN: "${vnSentence}". Bắt buộc dùng: ${targetWords.join(', ')}. Học sinh dịch: "${userAnswer}". Trả JSON: {"score":85,"suggested":"câu chuẩn","grammarIssues":[""],"vocabIssues":[""],"spellingIssues":[""],"missingWords":[""],"extraWords":[""],"overallFeedback":"nhận xét"}`;
    const text = await callGemini(prompt, { temperature: 0.2 });
    const json = extractJson(text);
    if(!json) throw new Error('Phản hồi AI không hợp lệ');
    json.score = clampScore(json.score, 50);
    json.suggested = json.suggested || '';
    json.grammarIssues = Array.isArray(json.grammarIssues) ? json.grammarIssues : [];
    json.vocabIssues = Array.isArray(json.vocabIssues) ? json.vocabIssues : [];
    json.spellingIssues = Array.isArray(json.spellingIssues) ? json.spellingIssues : [];
    json.missingWords = Array.isArray(json.missingWords) ? json.missingWords : [];
    json.extraWords = Array.isArray(json.extraWords) ? json.extraWords : [];
    json.overallFeedback = json.overallFeedback || '';
    return json;
  }

  function fallbackGrade(vnSentence, userAnswer, targetWords){
    const missing = targetWords.filter(w=>!containsWholeWord(userAnswer, w));
    const wordCount = userAnswer.trim().split(/\s+/).filter(Boolean).length;
    let score=100;
    score -= missing.length*25;
    if(wordCount<4) score-=20;
    if(!/[.!?]$/.test(userAnswer.trim())) score-=5;
    score=Math.max(0, Math.min(100, score));
    return {
      score, suggested:'', grammarIssues:[], vocabIssues: missing.length? [`Thiếu từ: ${missing.join(', ')}`] : [], spellingIssues:[], missingWords: missing, extraWords:[], overallFeedback:'Điểm ước tính.'
    };
  }

  async function gradeMultipleTranslations(sentencesData){
    if(!sentencesData || sentencesData.length === 0) return [];
    const CHUNK_SIZE = 5;
    const results = [];

    for (let i = 0; i < sentencesData.length; i += CHUNK_SIZE) {
      const chunk = sentencesData.slice(i, i + CHUNK_SIZE);
      const promptData = chunk.map((item, idx) => `Câu ${idx}:\nVN:"${item.vietnamese}"\nEN:"${item.userAnswer}"\nTừ bắt buộc:${item.targetWords.join(', ')}`).join('\n\n');
      const prompt = `Chấm điểm dịch. Trả MẢNG JSON theo thứ tự: [{"score":85,"suggested":"câu chuẩn","grammarIssues":[],"vocabIssues":[],"spellingIssues":[],"missingWords":[],"extraWords":[],"overallFeedback":"nhận xét"}].\n\n${promptData}`;
      
      const text = await callGemini(prompt, { temperature: 0.2 });
      let json = extractJson(text);
      if(!json) throw new Error('Phản hồi AI không parse được');
      if (!Array.isArray(json)) {
        const arrayKey = Object.keys(json).find(k => Array.isArray(json[k]));
        if (arrayKey) json = json[arrayKey];
        else json = [json];
      }
      results.push(...json);
    }

    return results.slice(0, sentencesData.length).map((r) => {
      return {
        score: clampScore(r?.score, 50), suggested: r?.suggested || '', grammarIssues: Array.isArray(r?.grammarIssues) ? r.grammarIssues : [], vocabIssues: Array.isArray(r?.vocabIssues) ? r.vocabIssues : [], spellingIssues: Array.isArray(r?.spellingIssues) ? r.spellingIssues : [], missingWords: Array.isArray(r?.missingWords) ? r.missingWords : [], extraWords: Array.isArray(r?.extraWords) ? r.extraWords : [], overallFeedback: r?.overallFeedback || ''
      };
    });
  }

  async function chatReply(scenarioLabel, targetWords, history, userMessage){
    const wordList = targetWords.map(w=>`${w.english} (${w.vietnamese})`).join(', ');
    const historyText = history.slice(-10).map(h=>`${h.role==='user'?'Học sinh':'AI'}: ${h.text}`).join('\n') || '(chưa có)';
    const prompt = `Bạn đang đóng vai trong một cuộc hội thoại luyện nói tiếng Anh với học sinh, theo tình huống: "${scenarioLabel}". Nếu phù hợp, hãy tự nhiên dùng các từ vựng sau trong lời thoại của bạn: ${wordList || '(không có yêu cầu từ vựng cụ thể)'}. Lịch sử hội thoại gần đây:\n${historyText}\nHọc sinh vừa nói: "${userMessage}"\nHãy trả lời NGẮN GỌN (1-3 câu), tự nhiên, đúng vai, hoàn toàn bằng tiếng Anh, để tiếp tục cuộc hội thoại. Trả về JSON: {"reply":"câu trả lời tiếng Anh"}`;
    const text = await callGemini(prompt, { temperature: 0.7 });
    const json = extractJson(text);
    if(!json || typeof json.reply !== 'string' || !json.reply.trim()) throw new Error('Phản hồi AI không hợp lệ');
    return json.reply.trim();
  }

  function fallbackChatReply(){
    const templates = [
      "That's interesting! Can you tell me a bit more about that?",
      "I see. What do you think about that?",
      "Okay, got it. What happens next?",
      "Sounds good. Could you say that again in a different way?"
    ];
    return pick(templates);
  }

  async function gradeConversation(scenarioLabel, targetWords, transcript){
    const transcriptText = transcript.map(h=>`${h.role==='user'?'Học sinh':'AI'}: ${h.text}`).join('\n');
    const prompt = `Đánh giá buổi luyện nói tiếng Anh của học sinh theo tình huống "${scenarioLabel}". Từ vựng cần luyện: ${targetWords.join(', ') || '(không có)'}. Đoạn hội thoại:\n${transcriptText}\nVới từng target word, chỉ đặt correct=true nếu học sinh dùng đúng nghĩa và chấp nhận được về ngữ pháp/ngữ cảnh. Trả về JSON: {"score":85,"overallFeedback":"nhận xét chung, khích lệ","strengths":[""],"improvements":[""],"wordsUsed":[""],"wordUsage":[{"word":"target","used":true,"correct":true,"feedback":"ngắn gọn"}]}`;
    const text = await callGemini(prompt, { temperature: 0.3 });
    const json = extractJson(text);
    if(!json) throw new Error('Phản hồi AI không hợp lệ');
    json.score = clampScore(json.score, 50);
    json.overallFeedback = json.overallFeedback || '';
    json.strengths = Array.isArray(json.strengths) ? json.strengths : [];
    json.improvements = Array.isArray(json.improvements) ? json.improvements : [];
    json.wordsUsed = Array.isArray(json.wordsUsed) ? json.wordsUsed : [];
    json.wordUsage = Array.isArray(json.wordUsage) ? json.wordUsage : [];
    return json;
  }

  function fallbackGradeConversation(targetWords, transcript){
    const userText = transcript.filter(h=>h.role==='user').map(h=>h.text).join(' ');
    const wordsUsed = targetWords.filter(w=>containsWholeWord(userText, w));
    const score = targetWords.length ? Math.round(wordsUsed.length/targetWords.length*100) : (userText.trim()?70:0);
    return {
      score, overallFeedback:'Điểm ước tính dựa trên số từ vựng bạn đã dùng trong buổi nói chuyện.',
      strengths: wordsUsed.length? [`Đã dùng: ${wordsUsed.join(', ')}`] : [],
      improvements: targetWords.filter(w=>!wordsUsed.includes(w)).map(w=>`Chưa dùng từ: ${w}`),
      wordsUsed,
      wordUsage: targetWords.map(w=>({word:w,used:wordsUsed.includes(w),correct:wordsUsed.includes(w),feedback:wordsUsed.includes(w)?'Đã dùng từ':'Chưa dùng từ'}))
    };
  }

  /* Tra cứu IPA + nghĩa tiếng Việt + từ loại + câu ví dụ cho MỘT từ, dùng chính AI đã cấu hình
     (không dùng API bên ngoài nào khác, tránh lỗi CORS và tốn thêm nguồn). Dùng retries=0 và
     maxModels=1 vì đây là tác vụ dự phòng tần suất cao (mỗi lần "Tra từ" hoặc mỗi từ trong
     "Thêm nhiều từ" có thể gọi hàm này) — nếu để cascade qua cả 4 model như các tác vụ chính
     (dịch câu/chấm điểm), một lần tra có thể âm thầm tốn tới 8 request khi hết hạn mức. */
  async function generateWordInfo(word){
    const prompt = `Từ/cụm tiếng Anh: "${word}". Hãy cung cấp thông tin từ điển Anh-Việt cho từ này. Trả về ĐÚNG JSON, không thêm chữ nào khác: {"pronunciation":"phiên âm IPA giọng Anh-Anh, có dấu / /","vietnamese":"nghĩa tiếng Việt phổ biến nhất, ngắn gọn","pos":"một trong: danh từ, động từ, tính từ, trạng từ, cụm từ, giới từ, khác","example":"1 câu ví dụ tiếng Anh ngắn, tự nhiên, có dùng từ này"}`;
    const text = await callGemini(prompt, { temperature: 0.2 }, 0, 1);
    const json = extractJson(text);
    if(!json) throw new Error('Phản hồi AI không hợp lệ');
    return json;
  }

  /* Tra cứu HÀNG LOẠT cho nhiều từ trong CÙNG MỘT lần gọi AI duy nhất — dùng cho việc
     thêm nhiều từ vựng một lúc, để tiết kiệm số lượt gọi API và nhanh hơn nhiều so với
     tra từng từ một. */
  async function generateWordInfoAdaptive(items){
    const allowedFields = new Set(['pronunciation','vietnamese','pos','example']);
    const cleanItems = (items||[]).map(x=>({
      english:String(x?.english||'').trim(),
      fields:[...new Set((x?.fields||[]).filter(f=>allowedFields.has(f)))]
    })).filter(x=>x.english && x.fields.length);
    if(!cleanItems.length) return [];

    const isMini = cleanItems.length <= 3;
    const hasPhrase = cleanItems.some(x=>/\s/.test(x.english));
    const list = cleanItems.map((x,i)=>`${i+1}. ${x.english} | cần: ${x.fields.join(', ')}`).join('\n');
    const fieldRules = `Tên field: pronunciation = IPA Anh-Anh có / /; vietnamese = nghĩa Việt ngắn, tự nhiên; pos = một trong [danh từ, động từ, tính từ, trạng từ, cụm từ, giới từ, khác]; example = 1 câu Anh ngắn dùng đúng mục.`;
    const phraseRule = hasPhrase ? ` Nếu là phrasal verb/idiom/cụm nhiều từ, bắt buộc tra theo NGHĨA TỪ VỰNG của toàn cụm, tuyệt đối không dịch từng chữ. Ví dụ: look down on = coi thường; stand up for = đứng ra bảo vệ/bênh vực; come down to = rốt cuộc là/phụ thuộc vào. Nếu cụm có nhiều nghĩa, chọn nghĩa thông dụng nhất cho người học. Câu ví dụ phải thể hiện đúng nghĩa đó.` : '';
    const prompt = isMini
      ? `Tra Anh-Việt. Chỉ điền các field được yêu cầu.${phraseRule} ${fieldRules}\n${list}\nTrả về duy nhất JSON array đúng thứ tự. Mỗi object có "english" và CHỈ các field được yêu cầu.`
      : `Bạn là từ điển Anh-Việt. Chỉ bổ sung các field đang thiếu cho từng mục dưới đây; không sinh lại field không được yêu cầu.${phraseRule} ${fieldRules}\n${list}\nTrả về duy nhất JSON array ${cleanItems.length} phần tử đúng thứ tự, mỗi object có "english" và chỉ các field được yêu cầu.`;

    const text = await callGemini(prompt, { temperature: 0 }, 0, 1);
    const json = extractJson(text);
    if(!Array.isArray(json)) throw new Error('Phản hồi AI không hợp lệ (không phải mảng)');
    return json;
  }

  async function generateWordInfoBatch(words){
    return generateWordInfoAdaptive((words||[]).map(english=>({
      english,
      fields:['pronunciation','vietnamese','pos','example']
    })));
  }

  return { generateSentence, generateSentenceFast, fallbackSentence, gradeTranslation, gradeTranslationAndNext, gradeMultipleTranslations, fallbackGrade, testConnection, getApiKey, setApiKey, getModel, generateWorksheetSentences, fallbackWorksheetSentences, chatReply, fallbackChatReply, gradeConversation, fallbackGradeConversation, generateWordInfo, generateWordInfoBatch, generateWordInfoAdaptive };
})();

/* ---------------------------- Dict module (tra cứu MIỄN PHÍ, không cần API key) ----------------------------
   Dùng Free Dictionary API (dictionaryapi.dev) để lấy IPA, từ loại, câu ví dụ, và MyMemory
   Translation API (mymemory.translated.net) để lấy nghĩa tiếng Việt. Cả hai đều miễn phí, không
   cần đăng ký API key, phản hồi gần như tức thì — dùng thay cho Gemini để tra IPA/nghĩa từ vựng,
   giúp tiết kiệm hạn mức Gemini cho phần luyện dịch câu & chấm bài (vẫn cần API key). */
const DictModule = (function(){
  const infoCache = new Map();
  const tokenIpaCache = new Map();
  // v2 cố tình đổi key để KHÔNG đọc lại cache v1 từng chứa các nghĩa phrasal verb sai
  // (ví dụ look down on -> "nhìn xuống", stand up for -> "đứng dậy").
  const AI_DICT_CACHE_KEY = 'sotu_ai_dict_cache_v2_openlex';
  let lastBatchStats = {requestCount:0, mode:'none', aiItems:0, aiFields:0, cacheHits:0, openSourceHits:0};

  function readAIDictCache(){
    try{
      const raw=localStorage.getItem(AI_DICT_CACHE_KEY);
      const obj=raw?JSON.parse(raw):{};
      return obj && typeof obj==='object' ? obj : {};
    }catch(e){ return {}; }
  }
  function getCachedAIInfo(word){
    const key=normalizeWordText(word);
    const all=readAIDictCache();
    const row=all[key];
    return row && typeof row==='object' ? {...row} : null;
  }
  function saveCachedAIInfo(word, patch){
    const key=normalizeWordText(word);
    if(!key || !patch) return;
    try{
      const all=readAIDictCache();
      const prev=all[key] && typeof all[key]==='object' ? all[key] : {};
      const keep={};
      for(const f of ['pronunciation','vietnamese','pos','example']){
        const v=String(patch[f]||'').trim();
        if(v) keep[f]=v;
        else if(prev[f]) keep[f]=prev[f];
      }
      all[key]={...keep,_ts:Date.now()};
      const keys=Object.keys(all);
      if(keys.length>500){
        keys.sort((a,b)=>(all[a]?._ts||0)-(all[b]?._ts||0));
        for(const k of keys.slice(0,keys.length-500)) delete all[k];
      }
      localStorage.setItem(AI_DICT_CACHE_KEY,JSON.stringify(all));
    }catch(e){}
  }

  const POS_MAP = {
    noun:'danh từ', verb:'động từ', adjective:'tính từ', adverb:'trạng từ',
    preposition:'giới từ', conjunction:'khác', interjection:'khác', pronoun:'khác',
    determiner:'khác', phrase:'cụm từ', idiom:'cụm từ', 'phrasal verb':'động từ'
  };
  function mapPos(raw){
    if(!raw) return '';
    const s=String(raw).toLowerCase().trim();
    if(POS_MAP[s]) return POS_MAP[s];
    if(s.includes('phrasal verb') || s.includes('cụm động từ')) return 'động từ';
    if(s.includes('danh từ')) return 'danh từ';
    if(s.includes('động từ')) return 'động từ';
    if(s.includes('tính từ')) return 'tính từ';
    if(s.includes('trạng từ')) return 'trạng từ';
    if(s.includes('giới từ')) return 'giới từ';
    if(s.includes('noun')) return 'danh từ';
    if(s.includes('verb')) return 'động từ';
    if(s.includes('adjective')) return 'tính từ';
    if(s.includes('adverb')) return 'trạng từ';
    if(s.includes('preposition')) return 'giới từ';
    if(s.includes('phrase') || s.includes('idiom')) return 'cụm từ';
    return 'khác';
  }

  const LOCAL_MEANINGS = new Map([
    ['commit','cam kết; thực hiện; phạm (một hành vi/phạm tội)'],
    ['commit to','cam kết, tận tâm với; cam kết làm điều gì'],
    ['committed','tận tâm, hết lòng; kiên định với điều gì'],
    ['sensitive','nhạy cảm; dễ bị ảnh hưởng'],
    ['insensitive','vô tâm, thiếu tinh tế; không để ý đến cảm xúc của người khác'],
    ['insecure','bất an, thiếu tự tin; không cảm thấy chắc chắn'],
    ['competent','có năng lực, đủ khả năng'],
    ['give up','từ bỏ; bỏ cuộc'],
    ['look after','chăm sóc, trông nom'],
    ['look forward to','mong đợi, háo hức chờ đợi'],
    ['put off','trì hoãn; làm ai mất hứng'],
    ['find out','tìm ra, phát hiện ra'],
    ['get over','vượt qua; hồi phục sau'],
    ['run out of','hết, cạn kiệt'],
    ['keep up with','theo kịp'],
    ['take care of','chăm sóc; xử lý'],
    ['carry out','thực hiện'],
    ['deal with','giải quyết; xử lý; đối phó với'],
    ['depend on','phụ thuộc vào'],
    ['rely on','dựa vào, tin cậy vào']
  ]);
  function localMeaning(word){ return LOCAL_MEANINGS.get(String(word||'').trim().toLowerCase()) || ''; }

  function decodeHtmlEntities(str){
    if(!str) return '';
    const ta=document.createElement('textarea'); ta.innerHTML=str; return ta.value;
  }
  function stripHtml(html){
    const tmp=document.createElement('div'); tmp.innerHTML=String(html||'');
    return (tmp.textContent||tmp.innerText||'').replace(/\s+/g,' ').trim();
  }
  function timeoutFetch(url, ms=4200){
    const c=new AbortController();
    const timer=setTimeout(()=>c.abort(),ms);
    return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(timer));
  }
  function normalizeIpa(raw){
    let s=String(raw||'').trim();
    if(!s) return '';
    if(s.startsWith('[') && s.endsWith(']')) s=s.slice(1,-1).trim();
    if(s.startsWith('/') && s.endsWith('/')) return s;
    s=s.replace(/^\/+|\/+$/g,'').trim();
    return s ? `/${s}/` : '';
  }
  function looksEnglishExample(text){
    const s=String(text||'').trim();
    if(!s) return false;
    // Nếu chứa nhiều ký tự tiếng Việt có dấu thì rất có thể đây không phải câu ví dụ tiếng Anh.
    const vi=(s.match(/[ăâđêôơưáàảãạấầẩẫậắằẳẵặéèẻẽẹếềểễệíìỉĩịóòỏõọốồổỗộớờởỡợúùủũụứừửữựýỳỷỹỵ]/gi)||[]).length;
    return vi <= 1 && /[A-Za-z]/.test(s);
  }

  /* Nguồn chính mới: API từ điển mở MinhQND (CC BY-SA 4.0), có CORS cho browser,
     trả nghĩa, IPA, POS và ví dụ. Dùng exact headword nên không cắt "come up against"
     thành "come up" nữa. */
  async function fetchMinhQNDEntry(word){
    const clean=String(word||'').trim().replace(/\s+/g,' ');
    if(!clean) return {pronunciation:'',vietnamese:'',pos:'',example:'',audio:'',source:''};
    try{
      const url=`https://dict.minhqnd.com/api/v1/lookup?word=${encodeURIComponent(clean)}&lang=en&def_lang=vi`;
      const res=await timeoutFetch(url,4800);
      if(!res.ok) return {pronunciation:'',vietnamese:'',pos:'',example:'',audio:'',source:''};
      const data=await res.json();
      if(data && data.exists===false) return {pronunciation:'',vietnamese:'',pos:'',example:'',audio:'',source:''};
      const results=Array.isArray(data?.results)?data.results:[];
      let pronunciation='',vietnamese='',pos='',example='',audio='';
      for(const row of results){
        if(row?.lang_code && !String(row.lang_code).toLowerCase().startsWith('en')) continue;
        if(!audio && row?.audio){
          const a=String(row.audio).trim();
          audio=a.startsWith('http')?a:`https://dict.minhqnd.com${a.startsWith('/')?'':'/'}${a}`;
        }
        if(!pronunciation && Array.isArray(row?.pronunciations)){
          const p=row.pronunciations.find(x=>x&&x.ipa) || row.pronunciations[0];
          if(p?.ipa) pronunciation=normalizeIpa(p.ipa);
        }
        if(Array.isArray(row?.meanings)){
          const meanings=[...row.meanings].sort((a,b)=>{
            const av=String(a?.definition_lang||'').toLowerCase()==='vi'?0:1;
            const bv=String(b?.definition_lang||'').toLowerCase()==='vi'?0:1;
            return av-bv;
          });
          for(const m of meanings){
            if(!vietnamese && m?.definition && (!m.definition_lang || String(m.definition_lang).toLowerCase()==='vi')){
              vietnamese=stripHtml(m.definition).replace(/\s+/g,' ').trim();
            }
            if(!pos && m?.pos) pos=mapPos(m.pos);
            if(!example && m?.example && looksEnglishExample(m.example)) example=stripHtml(m.example);
            if(vietnamese&&pos&&example) break;
          }
        }
        if(!vietnamese && Array.isArray(row?.translations)){
          const tr=row.translations.find(x=>x && String(x.lang_code||'').toLowerCase()==='vi' && x.translation);
          if(tr) vietnamese=String(tr.translation).trim();
        }
        if(pronunciation&&vietnamese&&pos&&example) break;
      }
      return {pronunciation,vietnamese,pos,example,audio,source:(pronunciation||vietnamese||pos||example)?'minhqnd':''};
    }catch(e){
      return {pronunciation:'',vietnamese:'',pos:'',example:'',audio:'',source:''};
    }
  }

  /* Free Dictionary API chỉ dùng exact query. Bản cũ từng thử "3 từ đầu" của cụm,
     gây ra dữ liệu của một cụm khác bị gán nhầm. */
  async function fetchDictionaryEntry(word){
    const candidate=String(word||'').trim().replace(/\s+/g,' ');
    if(!candidate) return {pronunciation:'',pos:'',example:'',audio:''};
    try{
      const res=await timeoutFetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(candidate)}`,3500);
      if(!res.ok) return {pronunciation:'',pos:'',example:'',audio:''};
      const data=await res.json();
      const entries=Array.isArray(data)?data:[];
      const entry=entries[0]; if(!entry) return {pronunciation:'',pos:'',example:'',audio:''};
      let pronunciation=normalizeIpa(entry.phonetic||'');
      if(!pronunciation && Array.isArray(entry.phonetics)){
        const p=entry.phonetics.find(x=>x&&x.text); if(p) pronunciation=normalizeIpa(p.text);
      }
      let audio='';
      if(Array.isArray(entry.phonetics)) audio=(entry.phonetics.find(p=>p&&p.audio)||{}).audio||'';
      let pos='',example='';
      if(Array.isArray(entry.meanings)){
        for(const m of entry.meanings){
          if(!pos && m?.partOfSpeech) pos=mapPos(m.partOfSpeech);
          if(!example && Array.isArray(m?.definitions)){
            const d=m.definitions.find(x=>x&&x.example); if(d) example=d.example;
          }
          if(pos&&example) break;
        }
      }
      return {pronunciation,pos,example,audio};
    }catch(e){ return {pronunciation:'',pos:'',example:'',audio:''}; }
  }

  async function fetchWiktionaryEntry(word){
    const raw=String(word||'').trim().replace(/\s+/g,' ');
    try{
      const res=await timeoutFetch(`https://en.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(raw)}`,4200);
      if(!res.ok) return {pos:'',example:''};
      const data=await res.json();
      const enEntries=data && (data.en || data.En);
      if(!Array.isArray(enEntries) || !enEntries.length) return {pos:'',example:''};
      let pos='',example='';
      for(const entry of enEntries){
        if(!pos && entry.partOfSpeech) pos=mapPos(entry.partOfSpeech);
        if(Array.isArray(entry.definitions)){
          for(const d of entry.definitions){
            if(!example && Array.isArray(d.parsedExamples) && d.parsedExamples.length){
              const e=stripHtml(d.parsedExamples[0].example);
              if(looksEnglishExample(e)) example=e;
            }
          }
        }
        if(pos&&example) break;
      }
      return {pos,example};
    }catch(e){ return {pos:'',example:''}; }
  }

  /* MyMemory chỉ còn dùng cho TỪ ĐƠN. Tuyệt đối không dùng để dịch phrasal verb,
     vì máy dịch câu từng cho ra các nghĩa literal sai như look down on = "nhìn xuống". */
  async function fetchVietnameseMeaningSingleWord(word){
    const local=localMeaning(word); if(local) return local;
    try{
      const res=await timeoutFetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word.trim())}&langpair=en|vi`,3500);
      if(!res.ok) return '';
      const data=await res.json();
      const raw=data?.responseData?.translatedText||'';
      const text=decodeHtmlEntities(raw).replace(/\.$/,'').trim();
      if(!text || text.toLowerCase()===word.trim().toLowerCase()) return '';
      return text;
    }catch(e){ return ''; }
  }

  /* Nếu nguồn mở có nghĩa cụm nhưng chưa có IPA, ghép IPA của từng token từ Free Dictionary.
     Đây là fallback miễn phí; nếu một token cũng không tra được thì để AI chỉ bổ sung riêng IPA. */
  async function fetchTokenIPA(token){
    const key=String(token||'').toLowerCase().replace(/^[^a-z']+|[^a-z']+$/g,'');
    if(!key) return '';
    if(tokenIpaCache.has(key)) return tokenIpaCache.get(key);
    const promise=(async()=>{
      const d=await fetchDictionaryEntry(key);
      return normalizeIpa(d.pronunciation||'');
    })();
    tokenIpaCache.set(key,promise);
    try{ return await promise; }catch(e){ return ''; }
  }
  async function composePhraseIPA(phrase){
    const tokens=String(phrase||'').toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g)||[];
    if(tokens.length<2 || tokens.length>7) return '';
    const ipas=await Promise.all(tokens.map(fetchTokenIPA));
    if(ipas.some(x=>!x)) return '';
    const inner=ipas.map(x=>x.replace(/^\//,'').replace(/\/$/,'')).join(' ').trim();
    return inner?`/${inner}/`:'';
  }

  function mergeMissing(target, patch){
    if(!target.pronunciation && patch?.pronunciation) target.pronunciation=normalizeIpa(patch.pronunciation);
    if(!target.vietnamese && patch?.vietnamese) target.vietnamese=String(patch.vietnamese).trim();
    if(!target.pos && patch?.pos) target.pos=mapPos(patch.pos);
    if(!target.example && patch?.example) target.example=String(patch.example).trim();
    if(!target.audio && patch?.audio) target.audio=String(patch.audio).trim();
  }

  async function lookupWordInfo(word, options={}){
    const clean=String(word||'').trim().replace(/\s+/g,' ');
    const allowAI=options.allowAI!==false;
    if(!clean) throw new Error('Nhập từ hoặc phrasal verb trước đã');
    const cacheKey=normalizeWordText(clean);
    if(infoCache.has(cacheKey)) return {...infoCache.get(cacheKey),usedAI:false,fromCache:true};

    const looksLikePhrase=/\s/.test(clean);
    const result={pronunciation:'',vietnamese:'',pos:'',example:'',audio:'',source:'',usedAI:false,fromAICache:false,openSourceHit:false};

    // 1) MinhQND: ưu tiên vì cùng một endpoint có thể cho nghĩa VI + IPA + POS + example.
    const open=await fetchMinhQNDEntry(clean);
    mergeMissing(result,open);
    if(open.source){ result.source='MinhQND'; result.openSourceHit=true; }

    // 2) Nghĩa local rất nhỏ chỉ làm fallback; không phải cơ chế nhận diện phrasal verb.
    if(!result.vietnamese){
      const local=localMeaning(clean);
      if(local){ result.vietnamese=local; result.source=result.source||'local'; }
    }

    // 3) Dictionary API + Wiktionary chỉ bù field còn thiếu, luôn exact query.
    if(!result.pronunciation || !result.pos || !result.example || !result.audio){
      const d=await fetchDictionaryEntry(clean);
      mergeMissing(result,d);
      if((d.pronunciation||d.pos||d.example) && !result.source) result.source='DictionaryAPI';
    }
    if(!result.pos || !result.example){
      const w=await fetchWiktionaryEntry(clean);
      mergeMissing(result,w);
      if((w.pos||w.example) && !result.source) result.source='Wiktionary';
    }

    // 4) Từ đơn mới dùng MyMemory. Cụm nhiều từ không bao giờ đi qua máy dịch literal này.
    if(!result.vietnamese && !looksLikePhrase){
      result.vietnamese=await fetchVietnameseMeaningSingleWord(clean);
      if(result.vietnamese && !result.source) result.source='MyMemory';
    }

    // 5) Cụm bị thiếu IPA: ghép IPA từng token từ nguồn miễn phí trước khi đụng AI.
    if(looksLikePhrase && !result.pronunciation){
      result.pronunciation=await composePhraseIPA(clean);
      if(result.pronunciation && !result.source) result.source='DictionaryAPI-components';
    }
    if(looksLikePhrase && !result.pos && result.vietnamese) result.pos='động từ';

    // Cache AI mới, version mới nên không thể kéo lại dữ liệu sai từ v1.
    const cachedAI=getCachedAIInfo(clean);
    if(cachedAI){
      const before=JSON.stringify([result.pronunciation,result.vietnamese,result.pos,result.example]);
      mergeMissing(result,cachedAI);
      const after=JSON.stringify([result.pronunciation,result.vietnamese,result.pos,result.example]);
      if(before!==after) result.fromAICache=true;
    }

    const dictAIFallbackAllowed=!state || !state.settings || state.settings.dictAIFallback!==false;
    const missingFields=[];
    if(!result.pronunciation) missingFields.push('pronunciation');
    if(!result.vietnamese) missingFields.push('vietnamese');
    if(!result.pos) missingFields.push('pos');
    if(!result.example) missingFields.push('example');

    if(allowAI && missingFields.length && AIModule.getApiKey() && dictAIFallbackAllowed){
      try{
        const rows=await AIModule.generateWordInfoAdaptive([{english:clean,fields:missingFields}]);
        const a=Array.isArray(rows)?(rows.find(x=>normalizeWordText(x?.english||'')===cacheKey)||rows[0]||{}):{};
        mergeMissing(result,a);
        if(a.pronunciation||a.vietnamese||a.pos||a.example){ saveCachedAIInfo(clean,a); result.usedAI=true; }
      }catch(aiErr){}
    }

    if(!result.pronunciation && !result.pos && !result.example && !result.vietnamese){
      throw new Error('Không tìm thấy dữ liệu cho từ/cụm này; thử lại sau hoặc nhập tay');
    }
    infoCache.set(cacheKey,{...result,usedAI:false});
    return result;
  }

  async function lookupWordInfoBatch(words,onProgress){
    const out=new Array(words.length);
    let nextIndex=0,done=0,cacheHits=0,openSourceHits=0;
    const worker=async()=>{
      while(true){
        const i=nextIndex++;
        if(i>=words.length) return;
        try{
          out[i]={english:words[i],...(await lookupWordInfo(words[i],{allowAI:false}))};
          if(out[i].fromCache || out[i].fromAICache) cacheHits++;
          if(out[i].openSourceHit) openSourceHits++;
        }catch(e){
          out[i]={english:words[i],pronunciation:'',pos:'',example:'',vietnamese:'',audio:'',usedAI:false};
        }
        done++; if(onProgress) onProgress(done,words.length);
      }
    };
    await Promise.all(Array.from({length:Math.min(4,words.length)},()=>worker()));

    const fallbackAllowed=!state || !state.settings || state.settings.dictAIFallback!==false;
    const requests=[], requestIndexes=[];
    out.forEach((r,i)=>{
      const fields=[];
      if(!r.pronunciation) fields.push('pronunciation');
      if(!r.vietnamese) fields.push('vietnamese');
      if(!r.pos) fields.push('pos');
      if(!r.example) fields.push('example');
      if(fields.length){ requests.push({english:words[i],fields}); requestIndexes.push(i); }
    });

    lastBatchStats={requestCount:0,mode:'none',aiItems:0,aiFields:0,cacheHits,openSourceHits};
    if(requests.length && AIModule.getApiKey() && fallbackAllowed){
      try{
        const aiRows=await AIModule.generateWordInfoAdaptive(requests);
        const byEnglish=new Map((Array.isArray(aiRows)?aiRows:[]).filter(Boolean).map(x=>[normalizeWordText(x.english||''),x]));
        requestIndexes.forEach((idx,j)=>{
          const wanted=requests[j], r=out[idx];
          const a=byEnglish.get(normalizeWordText(wanted.english)) || (Array.isArray(aiRows)?aiRows[j]:null) || {};
          const needed=new Set(wanted.fields);
          let gotAny=false;
          const take=(field,value)=>{
            if(!needed.has(field) || !value) return;
            if(field==='pronunciation' && !r.pronunciation){ r.pronunciation=normalizeIpa(value); gotAny=true; }
            if(field==='vietnamese' && !r.vietnamese){ r.vietnamese=String(value).trim(); gotAny=true; }
            if(field==='pos' && !r.pos){ r.pos=mapPos(value); gotAny=true; }
            if(field==='example' && !r.example){ r.example=String(value).trim(); gotAny=true; }
          };
          take('pronunciation',a.pronunciation); take('vietnamese',a.vietnamese); take('pos',a.pos); take('example',a.example);
          if(gotAny){ saveCachedAIInfo(words[idx],a); r.usedAI=true; }
        });
        lastBatchStats={requestCount:1,mode:requests.length<=3?'mini':'batch',aiItems:requests.length,aiFields:requests.reduce((n,x)=>n+x.fields.length,0),cacheHits,openSourceHits};
      }catch(e){
        console.warn('AI adaptive fallback failed:',e);
        lastBatchStats={requestCount:0,mode:'error',aiItems:requests.length,aiFields:requests.reduce((n,x)=>n+x.fields.length,0),cacheHits,openSourceHits};
      }
    }
    return out;
  }
  function getLastBatchStats(){ return {...lastBatchStats}; }
  return {lookupWordInfo,lookupWordInfoBatch,localMeaning,getLastBatchStats};
})();

/* ---------------------------- UI feedback sounds (không dùng API / không tải file âm thanh) ---------------------------- */
let uiAudioContext = null;
function getUiAudioContext(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return null;
    if(!uiAudioContext) uiAudioContext=new Ctx();
    if(uiAudioContext.state==='suspended') uiAudioContext.resume().catch(()=>{});
    return uiAudioContext;
  }catch(e){ return null; }
}
function playUiSound(type){
  const ctx=getUiAudioContext(); if(!ctx) return;
  const now=ctx.currentTime;
  const tone=(freq,start,duration,volume=0.055,wave='sine',endFreq=null)=>{
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=wave; osc.frequency.setValueAtTime(freq,now+start);
    if(endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq,now+start+duration);
    gain.gain.setValueAtTime(0.0001,now+start);
    gain.gain.exponentialRampToValueAtTime(volume,now+start+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+start+duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now+start); osc.stop(now+start+duration+0.02);
  };
  if(type==='correct'){
    tone(523.25,0,0.12,0.05,'sine',659.25);
    tone(659.25,0.105,0.16,0.055,'sine',783.99);

/* ---------------------------- Text to speech ---------------------------- */
let audioUnlocked = false;
let cachedVoices = [];
const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
function refreshVoicesCache(){
  if('speechSynthesis' in window){
    const v = window.speechSynthesis.getVoices();
    if(v && v.length) cachedVoices = v;
  }
}
if('speechSynthesis' in window){
  refreshVoicesCache();
  window.speechSynthesis.onvoiceschanged = refreshVoicesCache;
}
function unlockAudioOnce(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  try{
    const silent = new Audio("data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjI5LjEwMAAAAAAAAAAAAAAA//OEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==");
    silent.volume = 0;
    silent.play().catch(()=>{});
  }catch(e){}
  try{
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance('');
      u.volume = 0;
      window.speechSynthesis.speak(u);
      refreshVoicesCache();
    }
  }catch(e){}
}
['touchstart','pointerdown','click'].forEach(evt=>{
  document.addEventListener(evt, unlockAudioOnce, {once:true, passive:true});
});

function speak(text) {
  if(!text) return false;
  // Trên điện thoại, phát trực tiếp bằng SpeechSynthesis trong user gesture.
  if(isMobileDevice) return fallbackSpeak(text);
  try {
    const url = `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=en-GB&q=${encodeURIComponent(text)}`;
    const audio = new Audio(url);
    audio.preload = 'auto';
    audio.addEventListener('error', ()=>fallbackSpeak(text), {once:true});
    audio.play().catch(()=>fallbackSpeak(text));
    return true;
  } catch(e) { return fallbackSpeak(text); }
}

function fallbackSpeak(text) {
  if (!('speechSynthesis' in window)) {
    toast('Trình duyệt không hỗ trợ phát âm');
    return false;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB';
  u.rate = 0.9;
  
  const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
  const bestVoice = voices.find(v => v.name.includes('Google UK English')) || 
                    voices.find(v => v.name.includes('Google') && v.lang.includes('en')) || 
                    voices.find(v => v.name.includes('Natural') && v.lang.includes('en')) ||
                    voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
                    
  if (bestVoice) { u.voice = bestVoice; u.lang = bestVoice.lang; }
  window.speechSynthesis.speak(u);
  return true;
}

/* speakWord: phát âm một từ vựng, ƯU TIÊN audio thật (người đọc) lấy từ từ điển miễn phí
   (dictionaryapi.dev, vốn dùng lại file ghi âm gốc từ Wiktionary) nếu từ đó đã có sẵn
   word.pronunciationAudio. Nếu không có, hoặc file lỗi/không phát được, mới rơi về TTS
   (giọng máy) như trước. Dùng hàm này thay cho speak(word.english) ở bất cứ đâu đã có sẵn
   đối tượng "word" đầy đủ. */
const wordAudioCache = new Map();
function speakWord(word){
  if(!word) return false;
  const url = word.pronunciationAudio;
  if(url){
    try{
      let audio = wordAudioCache.get(url);
      if(!audio){ audio = new Audio(url); wordAudioCache.set(url, audio); }
      audio.currentTime = 0;
      audio.play().catch(()=>speak(word.english));
      return true;
    }catch(e){ /* rơi xuống TTS bên dưới */ }
  }
  return speak(word.english);
}

/* ---------------------------- Speech-to-text (nhận diện giọng nói) ---------------------------- */
function getSpeechRecognitionCtor(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}
function isSpeechRecognitionSupported(){
  return !!getSpeechRecognitionCtor();
}
function createSpeechRecognizer({ onResult, onError, onEnd }){
  const Ctor = getSpeechRecognitionCtor();
  if(!Ctor) return null;
  const rec = new Ctor();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.continuous = false;
  rec.onresult = (e)=>{
    const text = e.results?.[0]?.[0]?.transcript || '';
    if(onResult) onResult(text.trim());
  };
  rec.onerror = (e)=>{ if(onError) onError(e); };
  rec.onend = ()=>{ if(onEnd) onEnd(); };
  return rec;
}

function migrateState(state) {
  if (state.version == null) {
    state.version = 1;
  }

  if (!Array.isArray(state.notebooks)) {
    state.notebooks = [];
  }

  if (!Array.isArray(state.words)) {
    state.words = [];
  }

  if (!Array.isArray(state.mergedSets)) {
    state.mergedSets = [];
  }

  if (!Array.isArray(state.translationHistory)) {
    state.translationHistory = [];
  }

  if (!Array.isArray(state.practiceSessions)) {
    state.practiceSessions = [];
  }

  if (!Array.isArray(state.conversationHistory)) {
    state.conversationHistory = [];
  }

  state.settings ||= {};

  state.settings.dailyGoal ??= 20;
  state.settings.autoTTS ??= true;
  state.settings.dictAIFallback ??= true;
  state.settings.googleApiKey ??= '';
  state.settings.googleModel ??= 'gemini-flash-latest';

  state.ui ||= {};

  state.ui.page ||= 'dashboard';
  state.ui.worksheetSession ??= null;
  state.ui.practiceSession ??= null;
  if(state.ui.practiceSession && Array.isArray(state.ui.practiceSession.questions)){
    state.ui.practiceSession.questions.forEach(q=>{
      if(q && !['vi2en','en2vi','mcq','fill','listen','write'].includes(q.mode)){
        q.mode='vi2en';
        delete q.options;
        delete q.direction;
        delete q.sentence;
      }
    });
  }
  state.ui.flashSession ??= null;
  state.ui.chatSession ??= null;

  state.ui.notebooksUi ||= {};

  state.ui.notebooksUi.search ??= '';
  state.ui.notebooksUi.statusFilter ??= 'all';
  state.ui.notebooksUi.posFilter ??= 'all';

  state.words.forEach(word => {
    if (word.english == null) word.english = '';
    if (word.vietnamese == null) word.vietnamese = '';
    if (word.pos == null) word.pos = '';
    if (word.example == null) word.example = '';
    if (word.pronunciation == null) word.pronunciation = '';
    if (word.note == null) word.note = '';
    if (word.synonyms == null) word.synonyms = '';
    if (word.collocations == null) word.collocations = '';
    if (word.wordFamily == null) word.wordFamily = '';
    if (word.confusable == null) word.confusable = '';
    if (word.pronunciationAudio == null) word.pronunciationAudio = '';

    ensureSrs(word);
    word.srs.level = Number.isFinite(Number(word.srs.level)) ? Math.max(0, Math.min(SRS_LEVELS_DAYS.length-1, Number(word.srs.level))) : 0;
    word.srs.correct = Number.isFinite(Number(word.srs.correct)) ? Math.max(0, Number(word.srs.correct)) : 0;
    word.srs.wrong = Number.isFinite(Number(word.srs.wrong)) ? Math.max(0, Number(word.srs.wrong)) : 0;

    if (!Array.isArray(word.srs.history)) {
      word.srs.history = [];
    }

    if (word.srs.history.length > 60) {
      word.srs.history = word.srs.history.slice(-60);
    }

    word.srs.level ??= 0;
    word.srs.correct ??= 0;
    word.srs.wrong ??= 0;
    word.srs.lastReviewed ??= null;
    word.srs.nextReview ??= new Date().toISOString();
  });

  const MAX_TRANSLATION_HISTORY = 2000;
  const MAX_PRACTICE_SESSIONS = 1000;
  const MAX_CONVERSATION_HISTORY = 500;

  if (state.translationHistory.length > MAX_TRANSLATION_HISTORY) {
    state.translationHistory =
      state.translationHistory.slice(-MAX_TRANSLATION_HISTORY);
  }

  if (state.practiceSessions.length > MAX_PRACTICE_SESSIONS) {
    state.practiceSessions =
      state.practiceSessions.slice(-MAX_PRACTICE_SESSIONS);
  }

  if (state.conversationHistory.length > MAX_CONVERSATION_HISTORY) {
    state.conversationHistory =
      state.conversationHistory.slice(-MAX_CONVERSATION_HISTORY);
  }

  state.version = Math.max(state.version, 3);

  return state;
}

  let loaded = await migrateLocalStorageToIndexedDB();

    state = seedState();
    await storageSet(state);
  }
}

function wordsOfNotebook(nbId){ return state.words.filter(w=>w.notebookId===nbId); }
function wordsOfMergedSet(setId){
  const set = state.mergedSets.find(m=>m.id===setId);
  if(!set) return [];
  return state.words.filter(w=>set.notebookIds.includes(w.notebookId));

function allWords(){ return state.words; }

function wordsFromSource(source){
  if(!source || source.type==='all') return allWords();
  if(source.type==='notebook') return wordsOfNotebook(source.id);
  if(source.type==='merged') return wordsOfMergedSet(source.id);

    });

  }

function overallAccuracy(words){
  let correct=0, wrong=0;
  words.forEach(w=>{ const s=ensureSrs(w); correct+=s.correct; wrong+=s.wrong; });
  const total=correct+wrong;
  return total? Math.round(correct/total*100) : 0;
}
function activityLast14Days(){
  const days=[];
  for(let i=13;i>=0;i--){
    const d=daysAgo(i);
    const key=d.toDateString();
    let count=0;
    state.words.forEach(w=>{
      (ensureSrs(w).history||[]).forEach(h=>{ if(new Date(h.date).toDateString()===key) count++; });
    });
    state.translationHistory.forEach(t=>{ if(new Date(t.date).toDateString()===key) count++; });
    days.push({date:d, count});
  }
  return days;
}

    </div>` : ''}

    el.addEventListener('click', ()=>{
      navigate(el.getAttribute('data-nav'));

    });
  });
  const logoutBtn = sb.querySelector('#sb-logout');
